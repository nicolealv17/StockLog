<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLog · Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="components/css/sidebar.css" />
    <link rel="stylesheet" href="components/css/header.css" />
    <link rel="stylesheet" href="components/css/footer.css" />
    <link rel="stylesheet" href="components/css/modoescuro.css" />
    <style>
      :root {
        --bg-body: #edf3f8;
        --bg-card: #ffffff;
        --bg-soft: #f4f8fc;
        --border: #d4e2f0;

        --text-main: #0c1e2e;
        --text-secondary: #3b5a75;
        --text-muted: #718da8;

        --primary: #006bb3;
        --primary-hover: #005691;
        --primary-light: #e3f0fb;

        --green: #15803d;
        --green-bg: #dcfce7;
        --green-bar: #16a34a;

        --amber-bar: #d97706;

        --red: #b91c1c;
        --red-bg: #fee2e2;
        --red-bar: #dc2626;

        --shadow: 0 4px 12px rgba(12, 30, 46, 0.06);

        --fs-base: clamp(14px, 0.9vw + 12px, 16px);
        --fs-h1: clamp(19px, 1.2vw + 14px, 24px);
        --fs-title: clamp(15px, 1vw + 12px, 18px);

        --pad-content: 16px 20px;
        --gap-grid: clamp(14px, 1vw, 22px);
        --pad-card: clamp(18px, 1.4vw, 28px);
      }

        [data-theme="dark"],
        body.dark {
          --bg-body: #0a131d;
          --bg-card: #111f2e;
          --bg-soft: #16283b;
          --border: #1e364f;

          --text-main: #e2edf8;
          --text-secondary: #9cb5cd;
          --text-muted: #6482a0;

          --primary: #38bdf8;
          --primary-hover: #0284c7;
          --primary-light: #17324d;

          --green: #4ade80;
          --green-bg: #143823;
          --green-bar: #22c55e;

          --amber-bar: #f59e0b;

          --red: #f87171;
          --red-bg: #3e1919;
          --red-bar: #ef4444;

          --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
        }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html { font-size: var(--fs-base); }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        display: flex;
        min-height: 100vh;
        transition: background-color 0.2s, color 0.2s;
        font-size: 1rem;
        line-height: 1.5;
      }

      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-width: 0;
      }

      .dashboard-container {
        flex: 1;
        max-width: 100%;
        width: 100%;
        margin: 0;
        padding: var(--pad-content);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--gap-grid);
      }

      .top-header {
        width: 100%;
        max-width: 600px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .header-title-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header-title-group h1 {
        font-size: var(--fs-h1);
        font-weight: 700;
      }

      .header-title-group h1 span {
        color: var(--primary);
      }

      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: var(--pad-card);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 600px;
        transition: transform 0.2s;
      }

      .card-header-title {
        font-size: var(--fs-title);
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
      }

      .card-header-title .title-text {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .card-header-title i {
        color: var(--primary);
      }

      .form-grid {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-group label {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-wrapper i.input-icon {
        position: absolute;
        left: 12px;
        color: var(--text-muted);
        font-size: 14px;
        pointer-events: none;
      }

      .input-wrapper input,
      .input-wrapper select {
        width: 100%;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px 10px 38px;
        color: var(--text-main);
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .input-wrapper select {
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
      }

      .input-wrapper .select-arrow {
        position: absolute;
        right: 12px;
        color: var(--text-muted);
        pointer-events: none;
        font-size: 12px;
      }

      .input-wrapper input:focus,
      .input-wrapper select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-light);
      }

      .toggle-password {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 14px;
        padding: 4px;
      }

      .toggle-password:hover {
        color: var(--text-main);
      }

      /* Indicador de Força de Senha */
      .strength-meter {
        display: flex;
        gap: 4px;
        margin-top: 6px;
      }

      .strength-bar {
        height: 4px;
        flex: 1;
        background: var(--border);
        border-radius: 2px;
        transition: background-color 0.3s;
      }

      .strength-bar.active.weak { background-color: var(--red-bar); }
      .strength-bar.active.medium { background-color: var(--amber-bar); }
      .strength-bar.active.strong { background-color: var(--green-bar); }

      .strength-label {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 4px;
        font-weight: 500;
      }

      /* Alert / Mensagem */
      .mensagem-alerta {
        border-radius: 8px;
        font-size: 13.5px;
        font-weight: 600;
        display: none;
      }

      .mensagem-alerta:not(:empty) {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        margin-bottom: 16px;
      }

      .mensagem-alerta.error {
        background-color: var(--red-bg);
        color: var(--red);
        border: 1px solid var(--red-bar);
      }

      .mensagem-alerta.success {
        background-color: var(--green-bg);
        color: var(--green);
        border: 1px solid var(--green-bar);
      }

      .btn-submit {
        background-color: var(--primary);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: background-color 0.2s, transform 0.1s;
        margin-top: 10px;
        min-height: 44px;
      }

      .btn-submit:hover {
        background-color: var(--primary-hover);
      }

      .btn-submit:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .btn-spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #ffffff;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Efeito Shake de Erro */
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
      }

      .shake {
        animation: shake 0.4s ease-in-out;
      }

      @media (max-width: 768px) {
        .dashboard-container {
          padding: 12px;
        }

        .card {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div id="sidebar-root"></div>

    <div class="main-wrapper">
      <div id="header-root"></div>

      <div class="dashboard-container">
        <div class="top-header">
          <div class="header-title-group">
            <h1>StockLog · <span>Cadastro</span></h1>
          </div>
        </div>

        <section class="card" id="cardContainer">
          <div class="card-header-title">
            <span class="title-text">
              <i class="fa-solid fa-user-plus"></i> Cadastro de Funcionário
            </span>
          </div>

          <!-- Div para Mensagens de Alerta -->
          <div id="mensagem" class="mensagem-alerta"></div>

          <form id="registerForm" class="form-grid">
            <!-- Nome Completo -->
            <div class="form-group">
              <label for="nomeInput">Nome Completo</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-user input-icon"></i>
                <input
                  type="text"
                  id="nomeInput"
                  placeholder="Digite o nome completo"
                  required
                />
              </div>
            </div>

            <!-- CPF -->
            <div class="form-group">
              <label for="cpfInput">CPF</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-id-card input-icon"></i>
                <input
                  type="text"
                  id="cpfInput"
                  placeholder="000.000.000-00"
                  maxlength="14"
                  required
                />
              </div>
            </div>

            <!-- Área (Caixa Seletora) -->
            <div class="form-group">
              <label for="areaSelect">Área de Atuação</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-sitemap input-icon"></i>
                <select id="areaSelect" required>
                  <option value="" disabled selected>Selecione a área...</option>
                  <option value="Gestão">Gestão</option>
                  <option value="Estoque">Estoque</option>
                </select>
                <i class="fa-solid fa-chevron-down select-arrow"></i>
              </div>
            </div>

            <!-- Senha -->
            <div class="form-group">
              <label for="passwordInput">Senha de Acesso</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>
                <input
                  type="password"
                  id="passwordInput"
                  placeholder="Digite a senha"
                  required
                />
                <i class="fa-regular fa-eye toggle-password" id="togglePassword" title="Mostrar/Ocultar Senha"></i>
              </div>
              
              <!-- Barra de Força da Senha -->
              <div class="strength-meter">
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
              </div>
              <span id="strengthLabel" class="strength-label"></span>
            </div>

            <!-- Botão de Envio -->
            <button type="submit" class="btn-submit" id="btnRegister">
              <span id="btnText"><i class="fa-solid fa-user-check"></i> Cadastrar Funcionário</span>
              <div id="btnSpinner" class="btn-spinner"></div>
            </button>
          </form>
        </section>
      </div>

      <div id="footer-root"></div>
    </div>

    <!-- Firebase SDK Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyAr4n6dwFxFKfMr46ftQ2ktDDKZXIFNtmk",
        authDomain: "stocklog-ff7aa.firebaseapp.com",
        databaseURL: "https://stocklog-ff7aa-default-rtdb.firebaseio.com",
        projectId: "stocklog-ff7aa",
        storageBucket: "stocklog-ff7aa.firebasestorage.app",
        messagingSenderId: "787537499919",
        appId: "1:787537499919:web:fb267c72c0bc3b002e107a"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const auth = firebase.auth();

      // ====== Máscara de CPF ======
      const cpfInput = document.getElementById('cpfInput');
      cpfInput.addEventListener('input', (e) => {
        let v = e.target.value.replace(/\D/g, '').slice(0, 11);
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        e.target.value = v;
      });

      // ====== Mostrar/Ocultar Senha ======
      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('passwordInput');

      togglePassword.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePassword.className = isPassword ? 'fa-regular fa-eye-slash toggle-password' : 'fa-regular fa-eye toggle-password';
      });

      // ====== Indicador de Força da Senha ======
      const strengthBars = document.querySelectorAll('.strength-bar');
      const strengthLabel = document.getElementById('strengthLabel');

      passwordInput.addEventListener('input', () => {
        const v = passwordInput.value;
        let score = 0;
        if (v.length >= 8) score++;
        if (/[A-Z]/.test(v)) score++;
        if (/[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;

        strengthBars.forEach((bar, i) => {
          bar.classList.remove('active', 'weak', 'medium', 'strong');
          if (i < score) {
            bar.classList.add('active');
            if (score <= 2) bar.classList.add('weak');
            else if (score === 3) bar.classList.add('medium');
            else bar.classList.add('strong');
          }
        });

        const labels = ['', 'Senha fraca', 'Senha fraca', 'Senha média', 'Senha forte'];
        strengthLabel.textContent = labels[score] || '';
      });

      // ====== Submissão do Formulário ======
      const form = document.getElementById('registerForm');
      const mensagem = document.getElementById('mensagem');
      const btnRegister = document.getElementById('btnRegister');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      function showMessage(text, type) {
        mensagem.className = 'mensagem-alerta ' + (type || '');
        mensagem.innerHTML = type === 'error'
          ? `<i class="fa-solid fa-circle-exclamation"></i> ${text}`
          : type === 'success'
            ? `<i class="fa-solid fa-circle-check"></i> ${text}`
            : text;
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const cpfVal = cpfInput.value.replace(/\D/g, '');
        if (cpfVal.length !== 11) {
          showMessage('CPF inválido. Preencha todos os dígitos.', 'error');
          document.getElementById('cardContainer').classList.add('shake');
          setTimeout(() => document.getElementById('cardContainer').classList.remove('shake'), 400);
          return;
        }

        btnText.style.display = 'none';
        btnSpinner.style.display = 'block';
        btnRegister.disabled = true;
        showMessage('Processando cadastro...', '');

        setTimeout(() => {
          btnText.style.display = 'inline';
          btnSpinner.style.display = 'none';
          btnRegister.disabled = false;
          showMessage('Cadastro realizado com sucesso!', 'success');
        }, 1800);
      });
    </script>

    <!-- Componentes Globais -->
    <script src="components/js/header.js"></script>
    <script src="components/js/sidebar.js"></script>
    <script src="components/js/footer.js"></script>
    <script src="components/js/modoescuro.js"></script>

    <!-- Sincronização do Modo Escuro com a Página Inteira -->
  <script>
    (function () {
      const STORAGE_KEY = 'stocklog-theme';

      function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.body.classList.toggle('dark', isDark);
        try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
      }

      // 1. Carrega tema salvo no carregamento
      const saved = (() => {
        try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
      })() || 'light';
      applyTheme(saved);

      // 2. Se algum script externo mudar a classe do body, sincroniza
      const observer = new MutationObserver(() => {
        const bodyIsDark = document.body.classList.contains('dark');
        const htmlIsDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (bodyIsDark !== htmlIsDark) {
          applyTheme(bodyIsDark ? 'dark' : 'light');
        }
      });
      observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

      // 3. Captura cliques em qualquer botão de tema (mesmo após o DOM ser atualizado)
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('#themeToggle, .theme-toggle, [data-theme-toggle]');
        if (!btn) return;
        // Pequeno delay para deixar o modo escuro.js externo agir primeiro
        setTimeout(() => {
          const current = document.body.classList.contains('dark') ||
                          document.documentElement.getAttribute('data-theme') === 'dark';
          applyTheme(current ? 'dark' : 'light');
        }, 50);
      });
    })();
  </script>
  </body>
</html>
