<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLog · Leitor de QR Code</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="components/css/sidebar.css" />
    <link rel="stylesheet" href="components/css/header.css" />
    <link rel="stylesheet" href="components/css/footer.css" />
    <link rel="stylesheet" href="components/css/modoescuro.css" />
    <link rel="stylesheet" href="components/css/responsive.css" />

    <style>
      :root {
        --bg-body: #edf3f8;
        --bg-card: #ffffff;
        --bg-soft: #f4f8fc;
        --border: #d4e2f0;

        --text-main: #0c1e2e;
        --text-secondary: #3b5a75;
        --text-muted: #718da8;

        --primary: #006bb3;
        --primary-dark: #004d80;
        --primary-light: #e3f0fb;

        --green: #15803d;
        --green-bg: #dcfce7;

        --amber: #b45309;
        --amber-bg: #fef3c7;

        --red: #b91c1c;
        --red-bg: #fee2e2;

        --shadow: 0 8px 24px rgba(12, 30, 46, 0.08);
        --radius: 14px;
      }

      body.dark {
        --bg-body: #0a131d;
        --bg-card: #111f2e;
        --bg-soft: #16283b;
        --border: #1e364f;

        --text-main: #e2edf8;
        --text-secondary: #9cb5cd;
        --text-muted: #6482a0;

        --primary: #38bdf8;
        --primary-light: #17324d;

        --green: #4ade80;
        --green-bg: #143823;

        --amber: #fbbf24;
        --amber-bg: #3d2d11;

        --red: #f87171;
        --red-bg: #3e1919;

        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        min-height: 100vh;
        transition: background-color 0.3s, color 0.3s;
      }

      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-width: 0;
      }

      .dashboard-container {
        max-width: 100%;
        width: 100%;
        margin: 0;
        padding: 24px 28px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        flex: 1;
      }

      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }
      .page-header h1 {
        font-size: clamp(20px, 1.2vw + 16px, 26px);
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .page-header h1 i { color: var(--primary); }
      .page-header p {
        color: var(--text-muted);
        font-size: 14px;
        margin-top: 4px;
      }

      .qr-layout {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 22px;
      }
      @media (max-width: 980px) {
        .qr-layout { grid-template-columns: 1fr; }
      }

      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: var(--shadow);
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 18px;
      }
      .card-header h2 {
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .card-header h2 i { color: var(--primary); }

      .badge-soft {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 20px;
      }

      /* Scanner area */
      .scanner-wrap {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        background: #0a131d;
        aspect-ratio: 4 / 3;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .scanner-wrap video,
      .scanner-wrap canvas {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .scanner-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .scanner-frame {
        position: relative;
        width: 65%;
        aspect-ratio: 1 / 1;
        max-width: 260px;
      }
      .scanner-frame::before,
      .scanner-frame::after,
      .scanner-corners::before,
      .scanner-corners::after {
        content: "";
        position: absolute;
        width: 28px;
        height: 28px;
        border: 3px solid var(--primary);
      }
      .scanner-frame::before {
        top: 0; left: 0;
        border-right: 0; border-bottom: 0;
        border-top-left-radius: 8px;
      }
      .scanner-frame::after {
        top: 0; right: 0;
        border-left: 0; border-bottom: 0;
        border-top-right-radius: 8px;
      }
      .scanner-corners::before {
        bottom: 0; left: 0;
        border-right: 0; border-top: 0;
        border-bottom-left-radius: 8px;
      }
      .scanner-corners::after {
        bottom: 0; right: 0;
        border-left: 0; border-top: 0;
        border-bottom-right-radius: 8px;
      }
      .scanner-line {
        position: absolute;
        left: 8%;
        right: 8%;
        height: 2px;
        background: var(--primary);
        box-shadow: 0 0 12px var(--primary);
        animation: scanLine 2.4s ease-in-out infinite;
      }
      @keyframes scanLine {
        0%, 100% { top: 8%; }
        50% { top: calc(100% - 8%); }
      }

      .scanner-empty {
        color: #c5dcf2;
        text-align: center;
        padding: 18px;
      }
      .scanner-empty i {
        font-size: 48px;
        color: var(--primary);
        margin-bottom: 10px;
      }
      .scanner-empty p {
        font-size: 13px;
        opacity: 0.85;
        line-height: 1.5;
      }

      .scanner-actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 18px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: 0.2s;
        border: 1px solid transparent;
        flex: 1;
        min-width: 0;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover { background: var(--primary-dark); }
      .btn-outline {
        background: var(--bg-soft);
        color: var(--text-secondary);
        border-color: var(--border);
      }
      .btn-outline:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: var(--primary-light);
      }

      /* Manual input */
      .manual-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 14px;
      }
      .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .input-group label {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .input-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        transition: 0.2s;
      }
      .input-wrap:focus-within {
        border-color: var(--primary);
        background: var(--bg-card);
        box-shadow: 0 0 0 3px rgba(0, 107, 179, 0.15);
      }
      .input-wrap i {
        color: var(--text-muted);
        font-size: 14px;
      }
      .input-wrap input {
        flex: 1;
        border: none;
        background: transparent;
        outline: none;
        color: var(--text-main);
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
      }
      .input-wrap input::placeholder { color: var(--text-muted); }

      .samples {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }
      .samples-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 10px;
      }
      .sample-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .sample-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        cursor: pointer;
        transition: 0.2s;
      }
      .sample-item:hover {
        border-color: var(--primary);
        background: var(--primary-light);
      }
      .sample-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .sample-code {
        font-weight: 700;
        color: var(--text-main);
        font-size: 13.5px;
        font-family: ui-monospace, "SF Mono", monospace;
      }
      .sample-name {
        font-size: 12px;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sample-item i { color: var(--primary); font-size: 14px; }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--green);
        color: #fff;
        padding: 14px 22px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(20px);
        transition: all 0.3s ease;
        z-index: 9999;
        max-width: calc(100% - 32px);
      }
      .toast.show { opacity: 1; visibility: visible; transform: translateY(0); }
      .toast.error { background: var(--red); }

      @media (max-width: 768px) {
        .dashboard-container { padding: 14px; }
        .card { padding: 18px; }
        .toast { left: 16px; right: 16px; bottom: 16px; text-align: center; justify-content: center; }
      }
    </style>
  </head>
  <body>
    <div id="sidebar-root"></div>

    <div class="main-wrapper">
      <div id="header-root"></div>

      <div class="dashboard-container">
        <div class="page-header">
          <div>
            <h1><i class="fas fa-qrcode"></i> Leitor de QR Code</h1>
            <p>Aponte a câmera para a etiqueta da peça ou digite o código manualmente</p>
          </div>
        </div>

        <div class="qr-layout">
          <!-- Scanner -->
          <section class="card">
            <div class="card-header">
              <h2><i class="fas fa-camera"></i> Scanner da Câmera</h2>
              <span class="badge-soft" id="cameraStatus">Inativa</span>
            </div>

            <div class="scanner-wrap" id="scannerWrap">
              <video id="videoEl" playsinline muted hidden></video>
              <div class="scanner-overlay" id="scannerOverlay">
                <div class="scanner-frame">
                  <div class="scanner-corners"></div>
                  <div class="scanner-line"></div>
                </div>
              </div>
              <div class="scanner-empty" id="scannerEmpty">
                <i class="fas fa-qrcode"></i>
                <p><strong>Câmera desligada</strong><br />Clique em "Ativar câmera" para começar a escanear.</p>
              </div>
            </div>

            <div class="scanner-actions">
              <button class="btn btn-primary" id="btnStartCam" type="button">
                <i class="fas fa-video"></i> Ativar câmera
              </button>
              <button class="btn btn-outline" id="btnStopCam" type="button" disabled>
                <i class="fas fa-stop"></i> Parar
              </button>
            </div>
          </section>

          <!-- Manual + Samples -->
          <section class="card">
            <div class="card-header">
              <h2><i class="fas fa-keyboard"></i> Entrada Manual</h2>
              <span class="badge-soft" id="dbCount">0 códigos</span>
            </div>

            <form class="manual-form" id="manualForm">
              <div class="input-group">
                <label for="codigoInput">Código da etiqueta</label>
                <div class="input-wrap">
                  <i class="fas fa-barcode"></i>
                  <input
                    type="text"
                    id="codigoInput"
                    placeholder="Ex: SLG-T400-A7821"
                    autocomplete="off"
                    spellcheck="false"
                  />
                </div>
              </div>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-search"></i> Buscar Peça
              </button>
            </form>

            <div class="samples">
              <div class="samples-title">
                <i class="fas fa-flask"></i> Códigos disponíveis para teste
              </div>
              <div class="sample-list" id="sampleList"></div>
            </div>
          </section>
        </div>
      </div>

      <div id="footer-root"></div>
    </div>

    <div class="toast" id="toast">
      <i class="fas fa-circle-check"></i>
      <span id="toastMsg">Sucesso</span>
    </div>

    <script>
      // Banco simulado de códigos (mesmo banco de produto.html)
      const CODIGOS_VALIDOS = [
        "SLG-T400-A7821",
        "SLG-FL50-1020",
        "SLG-EV420-2026",
        "SLG-CP3045-9921",
        "SLG-MP1042-7788",
        "SLG-CS7023-4401"
      ];

      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      const toastIcon = toast.querySelector("i");

      function showToast(message, type) {
        toastMsg.textContent = message;
        toast.classList.toggle("error", type === "error");
        toastIcon.className = type === "error" ? "fas fa-circle-xmark" : "fas fa-circle-check";
        toast.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove("show"), 2800);
      }

      // ---- Render samples ----
      function renderSamples() {
        const list = document.getElementById("sampleList");
        document.getElementById("dbCount").textContent = CODIGOS_VALIDOS.length + " códigos";

        // Pequeno mapa só pra mostrar nomes amigáveis
        const nomes = {
          "SLG-T400-A7821": "Eixo de Transmissão Principal T-400",
          "SLG-FL50-1020":  "Flange Aço ABNT 1020 ø50mm",
          "SLG-EV420-2026": "Eixo Vazado 420mm",
          "SLG-CP3045-9921":"Parafuso Sextavado M8x30",
          "SLG-MP1042-7788":"Chapa de Aço Inox 304",
          "SLG-CS7023-4401":"Óleo Lubrificante ISO VG 68"
        };

        list.innerHTML = CODIGOS_VALIDOS.map(c => `
          <div class="sample-item" data-code="${c}">
            <div class="sample-info">
              <span class="sample-code">${c}</span>
              <span class="sample-name">${nomes[c] || ""}</span>
            </div>
            <i class="fas fa-arrow-right"></i>
          </div>
        `).join("");

        list.querySelectorAll(".sample-item").forEach(el => {
          el.addEventListener("click", () => {
            document.getElementById("codigoInput").value = el.dataset.code;
            irParaProduto(el.dataset.code);
          });
        });
      }

      // ---- Navegação ----
      function irParaProduto(codigo) {
        if (!codigo) return;
        const code = codigo.trim().toUpperCase();

        if (!CODIGOS_VALIDOS.includes(code)) {
          showToast("Código não encontrado: " + code, "error");
          return;
        }

        showToast("Peça encontrada! Abrindo detalhes…", "ok");
        setTimeout(() => {
          window.location.href = "produto.html?codigo=" + encodeURIComponent(code);
        }, 600);
      }

      // ---- Form manual ----
      document.getElementById("manualForm").addEventListener("submit", function (e) {
        e.preventDefault();
        irParaProduto(document.getElementById("codigoInput").value);
      });

      // ---- Câmera (jsQR via CDN sob demanda) ----
      const btnStartCam = document.getElementById("btnStartCam");
      const btnStopCam = document.getElementById("btnStopCam");
      const videoEl = document.getElementById("videoEl");
      const scannerEmpty = document.getElementById("scannerEmpty");
      const cameraStatus = document.getElementById("cameraStatus");

      let stream = null;
      let scanLoopId = null;
      let jsQRLoaded = false;

      async function loadJsQR() {
        if (jsQRLoaded) return;
        await new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
        jsQRLoaded = true;
      }

      async function startCamera() {
        try {
          await loadJsQR();

          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: false
          });

          videoEl.srcObject = stream;
          await videoEl.play();

          videoEl.hidden = false;
          scannerEmpty.style.display = "none";
          cameraStatus.textContent = "Ativa";
          cameraStatus.style.background = "var(--green-bg)";
          cameraStatus.style.color = "var(--green)";
          cameraStatus.style.borderColor = "var(--green)";

          btnStartCam.disabled = true;
          btnStopCam.disabled = false;

          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d", { willReadFrequently: true });

          const tick = () => {
            if (!stream) return;
            if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
              canvas.width = videoEl.videoWidth;
              canvas.height = videoEl.videoHeight;
              ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
              const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
              const code = jsQR(imageData.data, imageData.width, imageData.height);
              if (code && code.data) {
                stopCamera();
                document.getElementById("codigoInput").value = code.data;
                irParaProduto(code.data);
                return;
              }
            }
            scanLoopId = requestAnimationFrame(tick);
          };
          tick();
        } catch (err) {
          console.error(err);
          showToast("Não foi possível acessar a câmera.", "error");
          cameraStatus.textContent = "Erro";
        }
      }

      function stopCamera() {
        if (scanLoopId) cancelAnimationFrame(scanLoopId);
        scanLoopId = null;
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        }
        videoEl.srcObject = null;
        videoEl.hidden = true;
        scannerEmpty.style.display = "";
        cameraStatus.textContent = "Inativa";
        cameraStatus.style.background = "";
        cameraStatus.style.color = "";
        cameraStatus.style.borderColor = "";
        btnStartCam.disabled = false;
        btnStopCam.disabled = true;
      }

      btnStartCam.addEventListener("click", startCamera);
      btnStopCam.addEventListener("click", stopCamera);

      // Limpa recursos ao sair
      window.addEventListener("beforeunload", stopCamera);

      // Init
      renderSamples();
      document.getElementById("codigoInput").focus();
    </script>

    <script src="components/js/header.js"></script>
    <script src="components/js/sidebar.js"></script>
    <script src="components/js/footer.js"></script>
    <script src="components/js/modoescuro.js"></script>
  </body>
</html>
