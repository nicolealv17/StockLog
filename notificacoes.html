<!DOCTYPE html>
<html lang="pt-BR">
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLog · Central de notificações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <link rel="stylesheet" href="components/css/sidebar.css" />
    <link rel="stylesheet" href="components/css/header.css" />
    <link rel="stylesheet" href="components/css/footer.css" />
    <link rel="stylesheet" href="components/css/modoescuro.css" />

    <style>
      :root {
        --bg-body: #edf3f8;
        --bg-card: #ffffff;
        --bg-soft: #f4f8fc;
        --border: #d4e2f0;

        --text-main: #0c1e2e;
        --text-secondary: #3b5a75;
        --text-muted: #718da8;

        --primary: #006bb3;
        --primary-light: #e3f0fb;

        --green: #15803d;
        --green-bg: #dcfce7;
        --green-bar: #16a34a;

        --amber: #b45309;
        --amber-bg: #fef3c7;
        --amber-bar: #d97706;

        --red: #b91c1c;
        --red-bg: #fee2e2;
        --red-bar: #dc2626;

        --purple: #6b21a8;
        --purple-bg: #f3e8ff;
        --purple-bar: #8b5cf6;

        --blue: #0369a1;
        --blue-bg: #e0f2fe;
        --blue-bar: #0284c7;

        --teal: #0f766e;
        --teal-bg: #ccfbf1;
        --teal-bar: #14b8a6;

        --row-stripe: #f5f9fd;
        --shadow: 0 4px 12px rgba(12, 30, 46, 0.06);

        /* Tipografia fluida */
        --fs-base: clamp(14px, 0.9vw + 12px, 16px);
        --fs-h1: clamp(19px, 1.2vw + 14px, 24px);
        --fs-title: clamp(15px, 1vw + 12px, 18px);

        /* Espaçamentos fluidos */
        --pad-content: 16px 20px;
        --gap-grid: clamp(14px, 1vw, 22px);
        --pad-card: clamp(18px, 1.4vw, 28px);
      }

      body.dark {
        --bg-body: #0a131d;
        --bg-card: #111f2e;
        --bg-soft: #16283b;
        --border: #1e364f;

        --text-main: #e2edf8;
        --text-secondary: #9cb5cd;
        --text-muted: #6482a0;

        --primary: #38bdf8;
        --primary-light: #17324d;

        --green: #4ade80;
        --green-bg: #143823;

        --amber: #fbbf24;
        --amber-bg: #3d2d11;

        --red: #f87171;
        --red-bg: #3e1919;

        --purple: #c084fc;
        --purple-bg: #331d48;

        --blue: #38bdf8;
        --blue-bg: #123147;

        --teal: #2dd4bf;
        --teal-bg: #0e3733;

        --row-stripe: #152638;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html { font-size: var(--fs-base); }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        display: flex;
        min-height: 100vh;
        transition: background-color 0.2s, color 0.2s;
        font-size: 1rem;
        line-height: 1.5;
      }

      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-width: 0;
      }

      .dashboard-container {
        max-width: 100%;
        width: 100%;
        margin: 0;
        padding: var(--pad-content);
        display: flex;
        flex-direction: column;
        gap: var(--gap-grid);
      }

      .top-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .header-title-group {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .header-title-group h1 {
        font-size: var(--fs-h1);
        font-weight: 700;
      }

      .header-title-group h1 span {
        color: var(--primary);
      }

      .btn-action {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s;
      }

      .btn-action:hover {
        background-color: var(--bg-soft);
        border-color: var(--primary);
        color: var(--primary);
      }

      .btn-action.btn-primary {
        background-color: var(--primary);
        color: #ffffff;
        border-color: var(--primary);
      }

      .btn-action.btn-primary:hover {
        opacity: 0.9;

      }

      /* Grid de Resumo Stats */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: var(--gap-grid);
      }

      .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        box-shadow: var(--shadow);
      }

      .stat-icon {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }

      .stat-info h3 {
        font-size: 22px;
        font-weight: 800;
        line-height: 1.1;
      }

      .stat-info p {
        font-size: 12.5px;
        color: var(--text-muted);
        font-weight: 600;
        margin-top: 2px;
      }

      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: var(--pad-card);
        box-shadow: var(--shadow);
        width: 100%;
      }

      .card-header-title {
        font-size: var(--fs-title);
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .card-header-title .title-text {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .table-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        min-width: 240px;
        flex: 1;
      }

      .search-box i {
        color: var(--text-muted);
        font-size: 13px;
      }

      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        color: var(--text-main);
        font-family: inherit;
        font-size: 13.5px;
        width: 100%;
      }

      select.filter-select {
        border: 1px solid var(--border);
        background: var(--bg-soft);
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 8px;
        outline: none;
        cursor: pointer;
      }

      .filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        background: var(--bg-soft);
        color: var(--text-secondary);
        font-size: 12.5px;
        font-weight: 600;
        padding: 7px 14px;
        border-radius: 20px;
        cursor: pointer;
        transition: 0.15s;
      }

      .filter-chip:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .filter-chip.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      /* Container da Lista de Notificações */
      .notifications-feed {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 16px;
      }

      .notif-card {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 16px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-left: 5px solid var(--border);
        border-radius: 10px;
        transition: transform 0.15s, background-color 0.15s;
        position: relative;
      }

      .notif-card:hover {
        transform: translateY(-1px);
      }

      /* Borda lateral por prioridade/tipo */
      .notif-card.type-atraso { border-left-color: var(--red); }
      .notif-card.type-estoque { border-left-color: var(--amber); }
      .notif-card.type-maquina { border-left-color: var(--purple); }
      .notif-card.type-tarefa { border-left-color: var(--blue); }
      .notif-card.type-entrega { border-left-color: var(--teal); }

      /* Estado não lida */
      .notif-card.unread {
        background: var(--bg-card);
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      }

      .notif-card.unread::after {
        content: "";
        position: absolute;
        top: 16px;
        right: 16px;
        width: 8px;
        height: 8px;
        background-color: var(--primary);
        border-radius: 50%;
      }

      .notif-left {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        flex: 1;
      }

      .notif-icon {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
      }

      .type-atraso .notif-icon { background: var(--red-bg); color: var(--red); }
      .type-estoque .notif-icon { background: var(--amber-bg); color: var(--amber); }
      .type-maquina .notif-icon { background: var(--purple-bg); color: var(--purple); }
      .type-tarefa .notif-icon { background: var(--blue-bg); color: var(--blue); }
      .type-entrega .notif-icon { background: var(--teal-bg); color: var(--teal); }

      .notif-content {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .notif-header-line {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .notif-tag {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 12px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      .type-atraso .notif-tag { background: var(--red-bg); color: var(--red); }
      .type-estoque .notif-tag { background: var(--amber-bg); color: var(--amber); }
      .type-maquina .notif-tag { background: var(--purple-bg); color: var(--purple); }
      .type-tarefa .notif-tag { background: var(--blue-bg); color: var(--blue); }
      .type-entrega .notif-tag { background: var(--teal-bg); color: var(--teal); }

      .notif-time {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 500;
      }

      .notif-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-main);
      }

      .notif-desc {
        font-size: 13.5px;
        color: var(--text-secondary);
        line-height: 1.4;
      }

      .notif-meta {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 6px;
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 600;
      }

      .notif-meta span {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .notif-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
      }

      .action-btn-sm {
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-secondary);
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .action-btn-sm:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: var(--bg-soft);
      }

      .action-btn-sm.danger:hover {
        border-color: var(--red);
        color: var(--red);
        background: var(--red-bg);
      }

      .empty-state {
        text-align: center;
        padding: 40px 12px;
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      .empty-state i {
        font-size: 32px;
        margin-bottom: 10px;
        display: block;
        color: var(--border);
      }

      .results-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
        font-size: 0.88em;
        color: var(--text-muted);
        flex-wrap: wrap;
        gap: 10px;
      }

      .toast-popup {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--green-bar);
        color: #ffffff;
        padding: 14px 22px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(20px);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 9999;
      }

      .toast-popup.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      @media (max-width: 768px) {
        .dashboard-container {
          padding: 12px;
        }

        .notif-card {
          flex-direction: column;
        }

        .notif-actions {
          width: 100%;
          justify-content: flex-end;
          border-top: 1px solid var(--border);
          padding-top: 10px;
        }

        .table-controls {
          flex-direction: column;
          align-items: stretch;
          width: 100%;
        }

        .search-box, select.filter-select {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="sidebar-root"></div>

    <div class="main-wrapper">
      <div id="header-root"></div>

      <div class="dashboard-container">
        <!-- Top Title & Global Actions -->
        <div class="top-header">
          <div class="header-title-group">
            <h1>Central de <span>Notificações</span></h1>
            <span class="btn-action" style="cursor: default;">
              <i class="fas fa-bell"></i> <strong id="totalUnreadBadge">5 não lidas</strong>
            </span>
          </div>
          <div class="header-actions">
            <button class="btn-action" onclick="markAllAsRead()">
              <i class="fas fa-check-double"></i> Marcar todas como lidas
            </button>
            <button class="btn-action" onclick="clearReadNotifications()">
              <i class="fas fa-trash-can"></i> Limpar lidas
            </button>
          </div>
        </div>

        <!-- Summary Stats Grid -->
        <section class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon" style="background: var(--red-bg); color: var(--red);">
              <i class="fas fa-clock-rotate-left"></i>
            </div>
            <div class="stat-info">
              <h3 id="countAtrasos">2</h3>
              <p>Pedidos Atrasados</p>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon" style="background: var(--amber-bg); color: var(--amber);">
              <i class="fas fa-boxes-stacked"></i>
            </div>
            <div class="stat-info">
              <h3 id="countEstoque">2</h3>
              <p>Alertas de Estoque</p>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon" style="background: var(--purple-bg); color: var(--purple);">
              <i class="fas fa-triangle-exclamation"></i>
            </div>
            <div class="stat-info">
              <h3 id="countMaquina">1</h3>
              <p>Máquina Parada</p>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon" style="background: var(--teal-bg); color: var(--teal);">
              <i class="fas fa-truck-ramp-box"></i>
            </div>
            <div class="stat-info">
              <h3 id="countEntrega">1</h3>
              <p>Entregas Próximas</p>
            </div>
          </div>
        </section>

        <!-- Main Feed Section -->
        <section class="card">
          <div class="card-header-title">
            <span class="title-text"><i class="fas fa-list-check"></i> Avisos e Eventos Recentes</span>
            <div class="table-controls">
              <div class="search-box">
                <i class="fas fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Buscar por título, código ou detalhes..." oninput="renderFeed()" />
              </div>
              <select class="filter-select" id="typeFilter" onchange="renderFeed()">
                <option value="todos">Todos os tipos</option>
                <option value="atraso">Pedido Atrasado</option>
                <option value="estoque">Estoque Baixo</option>
                <option value="maquina">Máquina Parada</option>
                <option value="tarefa">Nova Tarefa</option>
                <option value="entrega">Entrega Próxima</option>
              </select>
            </div>
          </div>

          <!-- Quick Filter Chips -->
          <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;">
            <button class="filter-chip active" data-status="todos" onclick="setStatusFilter('todos', this)">Todas</button>
            <button class="filter-chip" data-status="unread" onclick="setStatusFilter('unread', this)">
              <i class="fas fa-circle" style="color:var(--primary); font-size:7px;"></i> Não Lidas
            </button>
            <button class="filter-chip" data-status="read" onclick="setStatusFilter('read', this)">
              <i class="fas fa-check" style="font-size:10px;"></i> Lidas
            </button>
          </div>

          <!-- Notification Feed -->
          <div class="notifications-feed" id="notificationsFeed"></div>

          <!-- Footer Metadata -->
          <div class="results-footer">
            <span id="resultsCount">Mostrando 7 notificações</span>
            <span>Atualizado em tempo real</span>
          </div>
        </section>
      </div>

      <div id="footer-root"></div>
    </div>

    <!-- Toast Component -->
    <div id="toastPopup" class="toast-popup">
      <i class="fas fa-circle-check" style="font-size: 18px;"></i>
      <span id="toastMessage">Ação realizada com sucesso!</span>
    </div>

    <script>
      // Base Data for Centralized Notifications
      let notifications = [
        {
          id: 1,
          type: "atraso",
          tagText: "Pedido Atrasado",
          title: "Pedido #PED-8942 com atraso crítico de entrega",
          desc: "O fornecedor Metalúrgica Silva informou atraso de 2 dias na entrega da Chapa de Aço Inox 304. Requer reagendamento na linha de montagem.",
          time: "Há 15 min",
          read: false,
          refCode: "#PED-8942",
          location: "Fornecedor Ext.",
          icon: "fa-solid fa-clock-rotate-left"
        },
        {
          id: 2,
          type: "maquina",
          tagText: "Máquina Parada",
          title: "Linha 03 - Torno CNC Master com falha hidráulica",
          desc: "Sensor de pressão acionou parada de emergência às 10:14. Equipe de manutenção preventiva foi notificada.",
          time: "Há 42 min",
          read: false,
          refCode: "#CNC-03",
          location: "Setor Usinagem",
          icon: "fa-solid fa-triangle-exclamation"
        },
        {
          id: 3,
          type: "estoque",
          tagText: "Estoque Baixo",
          title: "Nível crítico: Rolamento Esférico 6204-ZZ",
          desc: "Estoque atual é de apenas 12 unidades (Mínimo de Segurança: 50 unidades). Risco de parada no setor 2.",
          time: "Há 1 hora",
          read: false,
          refCode: "#ROL-6204",
          location: "Almoxarifado A2",
          icon: "fa-solid fa-boxes-stacked"
        },
        {
          id: 4,
          type: "entrega",
          tagText: "Entrega Próxima",
          title: "Carga agendada: Transportadora Swift Express",
          desc: "Recebimento de 200 caixas organizadoras previsto para às 14:30 na Doca 02. Conferência de Nota Fiscal necessária.",
          time: "Há 2 horas",
          read: false,
          refCode: "#REC-1092",
          location: "Doca 02",
          icon: "fa-solid fa-truck-ramp-box"
        },
        {
          id: 5,
          type: "tarefa",
          tagText: "Nova Tarefa",
          title: "Ordem de Produção #OP-2026-88 atribuída a você",
          desc: "Nova Ordem de Serviço criada pelo Supervisor Carlos para inventário rotativo do setor de ferramentas.",
          time: "Há 3 horas",
          read: false,
          refCode: "#OP-2026-88",
          location: "Galpão Principal",
          icon: "fa-solid fa-list-check"
        },
        {
          id: 6,
          type: "estoque",
          tagText: "Estoque Baixo",
          title: "Alerta de Reposição: Parafuso M8x40 Galvanizado",
          desc: "Atingiu a margem de segurança de 15%. Recomenda-se emissão de Ordem de Compra.",
          time: "Há 5 horas",
          read: true,
          refCode: "#PRF-M840",
          location: "Almoxarifado B1",
          icon: "fa-solid fa-boxes-stacked"
        },
        {
          id: 7,
          type: "atraso",
          tagText: "Pedido Atrasado",
          title: "Insumo químico #INS-302 fora do prazo limite",
          desc: "Transportadora excedeu a janela de entrega do produto. Solicitação de suporte aberta no portal do fornecedor.",
          time: "Ontem às 16:40",
          read: true,
          refCode: "#INS-302",
          location: "Logística Inbound",
          icon: "fa-solid fa-clock-rotate-left"
        }
      ];

      let currentStatusFilter = "todos";

      function setStatusFilter(status, element) {
        currentStatusFilter = status;
        document.querySelectorAll(".filter-chip").forEach((chip) => chip.classList.remove("active"));
        element.classList.add("active");
        renderFeed();
      }

      function showToast(msg) {
        const toast = document.getElementById("toastPopup");
        document.getElementById("toastMessage").innerText = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
      }

      function toggleReadStatus(id) {
        const item = notifications.find((n) => n.id === id);
        if (item) {
          item.read = !item.read;
          showToast(item.read ? "Notificação marcada como lida." : "Notificação marcada como não lida.");
          renderFeed();
        }
      }

      function deleteNotification(id) {
        notifications = notifications.filter((n) => n.id !== id);
        showToast("Notificação removida.");
        renderFeed();
      }

      function markAllAsRead() {
        notifications.forEach((n) => (n.read = true));
        showToast("Todas as notificações foram marcadas como lidas.");
        renderFeed();
      }

      function clearReadNotifications() {
        notifications = notifications.filter((n) => !n.read);
        showToast("Notificações lidas foram removidas.");
        renderFeed();
      }

      function updateStatsCounters() {
        const unreadCount = notifications.filter((n) => !n.read).length;
        document.getElementById("totalUnreadBadge").innerText = `${unreadCount} não lida${unreadCount !== 1 ? 's' : ''}`;

        document.getElementById("countAtrasos").innerText = notifications.filter(n => n.type === 'atraso').length;
        document.getElementById("countEstoque").innerText = notifications.filter(n => n.type === 'estoque').length;
        document.getElementById("countMaquina").innerText = notifications.filter(n => n.type === 'maquina').length;
        document.getElementById("countEntrega").innerText = notifications.filter(n => n.type === 'entrega').length;
      }

      function renderFeed() {
        const feed = document.getElementById("notificationsFeed");
        const searchVal = document.getElementById("searchInput").value.toLowerCase();
        const typeVal = document.getElementById("typeFilter").value;

        const filtered = notifications.filter((item) => {
          // Status filter
          if (currentStatusFilter === "unread" && item.read) return false;
          if (currentStatusFilter === "read" && !item.read) return false;

          // Type filter
          if (typeVal !== "todos" && item.type !== typeVal) return false;

          // Search term filter
          const textMatch =
            item.title.toLowerCase().includes(searchVal) ||
            item.desc.toLowerCase().includes(searchVal) ||
            item.refCode.toLowerCase().includes(searchVal) ||
            item.location.toLowerCase().includes(searchVal);

          return textMatch;
        });

        updateStatsCounters();
        document.getElementById("resultsCount").innerText = `Mostrando ${filtered.length} de ${notifications.length} avisos`;

        if (filtered.length === 0) {
          feed.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-bell-slash"></i>
              Nenhum aviso ou notificação foi encontrado com os filtros atuais.
            </div>
          `;
          return;
        }

        feed.innerHTML = filtered
          .map(
            (item) => `
          <div class="notif-card type-${item.type} ${!item.read ? 'unread' : ''}">
            <div class="notif-left">
              <div class="notif-icon">
                <i class="${item.icon}"></i>
              </div>
              <div class="notif-content">
                <div class="notif-header-line">
                  <span class="notif-tag">${item.tagText}</span>
                  <span class="notif-time"><i class="far fa-clock"></i> ${item.time}</span>
                </div>
                <h2 class="notif-title">${item.title}</h2>
                <p class="notif-desc">${item.desc}</p>
                <div class="notif-meta">
                  <span><i class="fas fa-hashtag"></i> Ref: ${item.refCode}</span>
                  <span><i class="fas fa-location-dot"></i> Local: ${item.location}</span>
                </div>
              </div>
            </div>
            <div class="notif-actions">
              <button class="action-btn-sm" onclick="toggleReadStatus(${item.id})" title="${item.read ? 'Marcar como não lida' : 'Marcar como lida'}">
                <i class="fas ${item.read ? 'fa-envelope-open' : 'fa-check'}"></i>
                ${item.read ? 'Não lida' : 'Lida'}
              </button>
              <button class="action-btn-sm danger" onclick="deleteNotification(${item.id})" title="Excluir notificação">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        `
          )
          .join("");
      }

      // Initial execution
      document.addEventListener("DOMContentLoaded", () => {
        renderFeed();
      });
    </script>

    
    <script src="components/js/header.js"></script>

    <script src="components/js/sidebar.js"></script>

    <script src="components/js/footer.js"></script>

    <script src="components/js/modoescuro.js"></script>
  </body>
</html>
