<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLog · Ajuda de Produção</title>
    <link rel="icon" type="image/png" href="IMG/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="components/css/sidebar.css" />
    <link rel="stylesheet" href="components/css/header.css" />
    <link rel="stylesheet" href="components/css/chat.css" />
    <link rel="stylesheet" href="components/css/footer.css" />
    <link rel="stylesheet" href="components/css/modoescuro.css" />
    <link rel="stylesheet" href="components/css/responsive.css" />

    <style>
      :root {
        --bg-body: #f0f5fc;
        --bg-card: #ffffff;
        --bg-soft: #f5faff;
        --border: #e2ecf6;
        --text-main: #0a1f33;
        --text-secondary: #3d5f7e;
        --text-muted: #7b92b2;
        --primary: #006bb3;
        --primary-light: #e1eefb;
        --green: #1a7b72;
        --green-bg: #e6f3f1;
        --amber: #c47a1f;
        --amber-bg: #fcf3e6;
        --red: #b2433a;
        --red-bg: #faeeed;
        --shadow: 0 4px 12px rgba(0, 40, 80, 0.04), 0 12px 32px rgba(0, 40, 80, 0.02);
      }

      body.dark {
        --bg-body: #0d1727;
        --bg-card: #14243e;
        --bg-soft: #0f1f30;
        --border: #1d344b;
        --text-main: #e2edf8;
        --text-secondary: #a5bed6;
        --text-muted: #6f8daa;
        --primary: #38bdf8;
        --primary-light: #1d3a55;
        --green: #4a9d8f;
        --green-bg: #123a2a;
        --amber: #d1a24a;
        --amber-bg: #3a2f15;
        --red: #c96a61;
        --red-bg: #3a1f1f;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        display: flex;
        min-height: 100vh;
        transition: background-color 0.2s, color 0.2s;
      }

      .main-wrapper { flex: 1; display: flex; flex-direction: column; min-height: 100vh; min-width: 0; }
      .dashboard-container { padding: 20px; display: flex; flex-direction: column; gap: 20px; }

      .page-header { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
      .page-header h1 { font-size: 24px; font-weight: 700; }
      .page-header h1 span { color: var(--primary); }

      .recipe-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }

      .recipe-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .recipe-card:hover {
        border-color: var(--primary);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 40, 80, 0.1);
      }

      .recipe-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: var(--primary-light);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }

      .recipe-info h3 {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .recipe-info p {
        font-size: 13px;
        color: var(--text-muted);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        padding: 20px;
      }

      .modal-overlay.active { display: flex; }

      .modal {
        background: var(--bg-card);
        border-radius: 16px;
        width: 100%;
        max-width: 500px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        animation: slideUp 0.3s ease;
      }

      @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .modal-header h2 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }

      .close-btn {
        background: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        width: 32px;
        height: 32px;
        cursor: pointer;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }

      .close-btn:hover { background: var(--bg-soft); color: var(--text-main); }

      .ingredient-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .ingredient-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .ingredient-name {
        font-weight: 600;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .ingredient-qty {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .availability-badge {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 10px;
        text-transform: uppercase;
      }

      .avail-yes { background: var(--green-bg); color: var(--green); }
      .avail-no { background: var(--red-bg); color: var(--red); }
    </style>
  </head>
  <body>
    <div id="sidebar-root"></div>
    <div class="main-wrapper">
      <div id="header-root"></div>
      <div class="dashboard-container">
        <div class="page-header">
          <h1><i class="fas fa-book-open"></i> Ajuda de <span>Produção</span></h1>
        </div>
        <div class="recipe-grid" id="recipeGrid">
          <!-- Receitas injetadas via JS -->
        </div>
      </div>
      <div id="footer-root"></div>
    </div>

    <div id="recipeModal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modalTitle"><i class="fas fa-box"></i> Detalhes da Produção</h2>
          <button class="close-btn" onclick="closeRecipeModal()"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="ingredient-list" id="ingredientList">
          <!-- Ingredientes injetados via JS -->
        </div>
      </div>
    </div>

    <script src="components/js/header.js"></script>
    <script src="components/js/modoescuro.js"></script>
    <script src="components/js/sidebar.js"></script>
    <script src="components/js/chat.js"></script>
    <script src="components/js/config.js"></script>
    <script src="components/js/footer.js"></script>
    <script src="JS/ajuda_producao.js"></script>
  </body>
</html>
