<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLog · Ajuda de Produção</title>
    <link rel="icon" type="image/png" href="IMG/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="components/css/sidebar.css" />
    <link rel="stylesheet" href="components/css/header.css" />
    <link rel="stylesheet" href="components/css/chat.css" />
    <link rel="stylesheet" href="components/css/footer.css" />
    <link rel="stylesheet" href="components/css/modoescuro.css" />
    <link rel="stylesheet" href="components/css/responsive.css" />

    <!-- jsPDF: usado para gerar a Ficha de Procedimento de Produção em PDF, direto no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
      :root {
        --bg-body: #f0f5fc;
        --bg-card: #ffffff;
        --bg-soft: #f5faff;
        --border: #e2ecf6;
        --text-main: #0a1f33;
        --text-secondary: #3d5f7e;
        --text-muted: #7b92b2;
        --primary: #006bb3;
        --primary-light: #e1eefb;
        --green: #1a7b72;
        --green-bg: #e6f3f1;
        --amber: #c47a1f;
        --amber-bg: #fcf3e6;
        --red: #b2433a;
        --red-bg: #faeeed;
        --shadow:
          0 1px 2px rgba(0, 40, 80, 0.04), 0 2px 8px rgba(0, 40, 80, 0.03);
        --shadow-hover:
          0 8px 20px rgba(0, 40, 80, 0.1), 0 2px 6px rgba(0, 40, 80, 0.06);

        --cat-chapas: #45607d;
        --cat-chapas-bg: #e9eef4;
        --cat-usinados: #6d4fa3;
        --cat-usinados-bg: #efe9f8;
        --cat-conexoes: #006bb3;
        --cat-conexoes-bg: #e1eefb;
        --cat-fixacao: #c47a1f;
        --cat-fixacao-bg: #fcf3e6;
        --cat-estrutural: #47586b;
        --cat-estrutural-bg: #eef1f4;
        --cat-embalagem: #1a7b72;
        --cat-embalagem-bg: #e6f3f1;
        --cat-pneus: #5a4a3f;
        --cat-pneus-bg: #efece7;

        /* escala de espaçamento — usada em todos os componentes desta página */
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --sp-5: 20px;
        --sp-6: 24px;
        --sp-7: 32px;

        --radius-card: 14px;
        --radius-chip: 10px;
      }

      body.dark {
        --bg-body: #0d1727;
        --bg-card: #14243e;
        --bg-soft: #0f1f30;
        --border: #1d344b;
        --text-main: #e2edf8;
        --text-secondary: #a5bed6;
        --text-muted: #6f8daa;
        --primary: #38bdf8;
        --primary-light: #1d3a55;
        --green: #4a9d8f;
        --green-bg: #123a2a;
        --amber: #d1a24a;
        --amber-bg: #3a2f15;
        --red: #c96a61;
        --red-bg: #3a1f1f;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 2px 8px rgba(0, 0, 0, 0.15);
        --shadow-hover: 0 10px 24px rgba(0, 0, 0, 0.35);

        --cat-chapas: #9db2c8;
        --cat-chapas-bg: #1c2a3a;
        --cat-usinados: #c3aee8;
        --cat-usinados-bg: #2a2140;
        --cat-conexoes: #38bdf8;
        --cat-conexoes-bg: #16324a;
        --cat-fixacao: #e3b568;
        --cat-fixacao-bg: #3a2f15;
        --cat-estrutural: #a9b7c6;
        --cat-estrutural-bg: #1e2a38;
        --cat-embalagem: #6fc2b3;
        --cat-embalagem-bg: #123a2a;
        --cat-pneus: #c9b8a3;
        --cat-pneus-bg: #2c2620;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        display: flex;
        min-height: 100vh;
        transition:
          background-color 0.2s,
          color 0.2s;
      }

.main-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-width: 0;
  margin: 0;
  padding: 0;
}
      .dashboard-container {
        padding: 0 0 var(--sp-5) 0; /* sem padding em cima/laterais */
        display: flex;
        flex-direction: column;
        gap: var(--sp-5);
        flex: 1;
      }

      .page-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--sp-4);
        flex-wrap: wrap;
      }
      .page-header h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .page-header h1 span {
        color: var(--primary);
      }
      .page-header p {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .page-summary {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 14px 6px 6px;
        box-shadow: var(--shadow);
      }
      .page-summary .dot {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--green-bg);
        color: var(--green);
        font-size: 12px;
      }

      /* ---------- Grid de receitas ---------- */
.recipe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: var(--sp-5);
  padding: var(--sp-5);   /* respiro em todos os lados, já que os filtros saíram */
}

      .empty-state {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--sp-3);
        color: var(--text-muted);
        font-size: 14px;
        padding: 60px 0;
        text-align: center;
      }
      .empty-state i {
        font-size: 26px;
        color: var(--border);
      }

      .recipe-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        overflow: hidden;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          border-color 0.18s ease;
        box-shadow: var(--shadow);
      }

      .recipe-card:hover,
      .recipe-card:focus-visible {
        border-color: var(--primary);
        transform: translateY(-4px);
        box-shadow: var(--shadow-hover);
      }

      .recipe-card:hover .recipe-image img {
        transform: scale(1.06);
      }
      .recipe-card:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      /* imagem em proporção fixa para todos os cards ficarem no mesmo tamanho,
         independente do formato/tamanho original da foto */
      .recipe-image {
        position: relative;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        background: var(--bg-soft);
      }

      .recipe-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.35s ease;
      }

      .recipe-image::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0) 60%,
          rgba(0, 0, 0, 0.16) 100%
        );
        pointer-events: none;
      }

      .category-tag {
        position: absolute;
        top: var(--sp-3);
        left: var(--sp-3);
        font-size: 11px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        z-index: 1;
      }

      .category-tag.cat-chapas {
        background: var(--cat-chapas-bg);
        color: var(--cat-chapas);
      }
      .category-tag.cat-usinados {
        background: var(--cat-usinados-bg);
        color: var(--cat-usinados);
      }
      .category-tag.cat-conexoes {
        background: var(--cat-conexoes-bg);
        color: var(--cat-conexoes);
      }
      .category-tag.cat-fixacao {
        background: var(--cat-fixacao-bg);
        color: var(--cat-fixacao);
      }
      .category-tag.cat-estrutural {
        background: var(--cat-estrutural-bg);
        color: var(--cat-estrutural);
      }
      .category-tag.cat-embalagem {
        background: var(--cat-embalagem-bg);
        color: var(--cat-embalagem);
      }
      .category-tag.cat-pneus {
        background: var(--cat-pneus-bg);
        color: var(--cat-pneus);
      }

      .recipe-body {
        padding: var(--sp-4) var(--sp-4) 0;
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .recipe-body h3 {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 3px;
        line-height: 1.3;
      }

      .recipe-body p {
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 37px;
      }

      .insumo-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 600;
        margin-top: var(--sp-3);
      }
      .insumo-meta i {
        font-size: 11px;
      }

      /* Status de produção é o elemento de maior peso do card — ocupa a base inteira */
      .status-footer {
        margin-top: var(--sp-4);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: var(--sp-3) var(--sp-4);
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .status-footer i {
        font-size: 13px;
      }

      .status-footer.ready {
        background: var(--green-bg);
        color: var(--green);
      }
      .status-footer.partial {
        background: var(--amber-bg);
        color: var(--amber);
      }
      .status-footer.blocked {
        background: var(--red-bg);
        color: var(--red);
      }

      /* ---------- Modal ---------- */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        padding: 20px;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal {
        background: var(--bg-card);
        border-radius: 16px;
        width: 100%;
        max-width: 520px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        animation: slideUp 0.25s ease;
      }

      @keyframes slideUp {
        from {
          transform: translateY(16px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .modal-image {
        position: relative;
        height: 170px;
      }

      .modal-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .close-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        background: var(--bg-card);
        border: none;
        border-radius: 8px;
        width: 32px;
        height: 32px;
        cursor: pointer;
        color: var(--text-main);
        font-size: 16px;
        line-height: 1;
        font-weight: 700;
        box-shadow: var(--shadow);
      }

      .modal-body {
        padding: var(--sp-5) var(--sp-6) var(--sp-6);
      }

      .modal-body h2 {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .modal-subtitle {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: var(--sp-4);
      }

      .modal-progress {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: var(--sp-3);
        margin-bottom: var(--sp-5);
      }
      .modal-progress-bar {
        flex: 1;
        height: 6px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      .modal-progress-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--green);
      }
      .modal-progress-label {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-secondary);
        white-space: nowrap;
      }

      .ingredient-list {
        display: flex;
        flex-direction: column;
        gap: var(--sp-3);
      }

      .ingredient-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--sp-3);
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        gap: 10px;
      }

      .ingredient-item.unavailable {
        border-color: var(--red);
        border-style: dashed;
      }

      .ingredient-name {
        font-weight: 600;
        font-size: 14px;
      }

      .codigo-tag {
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        color: var(--text-muted);
        font-size: 11px;
      }

      .low-stock-warning {
        display: block;
        color: var(--amber);
        font-weight: 600;
        font-size: 11px;
        margin-top: 2px;
      }

      .ingredient-qty {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
        white-space: nowrap;
      }

      .availability-badge {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 10px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .avail-yes {
        background: var(--green-bg);
        color: var(--green);
      }
      .avail-no {
        background: var(--red-bg);
        color: var(--red);
      }

      /* ---------- Passo a passo (modal) ---------- */
      .modal-section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin: var(--sp-5) 0 var(--sp-3);
      }
      .modal-section-title i {
        color: var(--primary);
        font-size: 12px;
      }

      .steps-list {
        display: flex;
        flex-direction: column;
        gap: var(--sp-3);
      }

      .step-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: var(--sp-3);
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .step-number {
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--primary);
        color: #fff;
        font-size: 11.5px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .step-text {
        font-size: 13.5px;
        line-height: 1.5;
        color: var(--text-main);
        padding-top: 2px;
      }

      /* ---------- Ações do modal / botão de PDF ---------- */
      .modal-actions {
        margin-top: var(--sp-5);
      }

      .download-pdf-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        background: var(--primary);
        border: none;
        border-radius: 10px;
        padding: 13px 16px;
        cursor: pointer;
        transition:
          filter 0.15s ease,
          transform 0.1s ease;
      }

      .download-pdf-btn:hover {
        filter: brightness(1.08);
      }

      .download-pdf-btn:active {
        transform: translateY(1px);
      }

      .download-pdf-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      @media (prefers-reduced-motion: reduce) {
        .recipe-card,
        .recipe-image img,
        .modal {
          transition: none;
          animation: none;
        }
      }
    </style>
    <script src="JS/auth-guard.js"></script>
  </head>
  <body>
    <div id="sidebar-root"></div>
    <div class="main-wrapper">
      <div id="header-root"></div>
      <div class="dashboard-container">
        <div class="recipe-grid" id="recipeGrid">
          <!-- Receitas injetadas via JS -->
        </div>
      </div>
      <div id="footer-root"></div>
    </div>

    <div id="recipeModal" class="modal-overlay">
      <div class="modal">
        <div class="modal-image">
          <img id="modalImage" src="" alt="" />
          <button class="close-btn" onclick="closeRecipeModal()">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <h2 id="modalTitle">Detalhes da Produção</h2>
          <p class="modal-subtitle" id="modalSubtitle"></p>
          <div class="modal-progress" id="modalProgress">
            <div class="modal-progress-bar">
              <div class="modal-progress-fill" id="modalProgressFill"></div>
            </div>
            <span class="modal-progress-label" id="modalProgressLabel"></span>
          </div>
          <div class="ingredient-list" id="ingredientList">
            <!-- Ingredientes injetados via JS -->
          </div>

          <div class="modal-section-title">
            <i class="fa-solid fa-list-ol"></i> Passo a passo de produção
          </div>
          <div class="steps-list" id="stepsList">
            <!-- Passos injetados via JS -->
          </div>

          <div class="modal-actions">
            <button
              class="download-pdf-btn"
              id="downloadPdfBtn"
              onclick="generatePDF(currentModalRecipeId)"
            >
              <i class="fa-solid fa-file-arrow-down"></i>
              Baixar Ficha de Procedimento (PDF)
            </button>
          </div>
        </div>
      </div>
    </div>
