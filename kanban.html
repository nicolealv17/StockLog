<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLog · Kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="components/css/sidebar.css" />
    <link rel="stylesheet" href="components/css/header.css" />
    <link rel="stylesheet" href="components/css/footer.css" />
    <link rel="stylesheet" href="components/css/modoescuro.css" />
    <link rel="stylesheet" href="components/css/responsive.css" />
    <style>
      /* ================================================================
       TOKENS / VARIÁVEIS
       ================================================================ */
      :root {
        --bg-body: #f0f5fc;
        --bg-card: #ffffff;
        --bg-soft: #f5faff;
        --border: #e2ecf6;
        --border-hover: #c6daea;

        --primary: #006bb3;
        --primary-dark: #004d80;
        --primary-light: #e1eefb;
        --primary-gradient: linear-gradient(145deg, #0077be, #005a8c);

        --text-main: #0a1f33;
        --text-secondary: #3d5f7e;
        --text-muted: #7b92b2;

        --shadow-card:
          0 4px 12px rgba(0, 40, 80, 0.04), 0 12px 32px rgba(0, 40, 80, 0.02);
        --shadow-hover:
          0 8px 24px rgba(0, 40, 80, 0.08), 0 16px 48px rgba(0, 40, 80, 0.04);

        --green: #1a7b72;
        --green-bg: #e0f2ea;
        --amber: #c47a1f;
        --amber-bg: #faecd6;
        --red: #b2433a;
        --red-bg: #fae2e0;
        --purple: #6f4c4e;
        --purple-bg: #ede6f5;
        --pink: #a13e73;
        --pink-bg: #f7e3ee;
      }

      body.dark {
        --bg-body: #0d1727;
        --bg-card: #14243e;
        --bg-soft: #0f1f30;
        --border: #1d344b;
        --border-hover: #2a4866;

        --text-main: #e2edf8;
        --text-secondary: #a5bed6;
        --text-muted: #6f8daa;

        --primary-light: #1d3a55;

        --green-bg: #123a2a;
        --amber-bg: #3a2f15;
        --red-bg: #3a1f1f;
        --purple-bg: #2a1f3d;
        --pink-bg: #351427;
        --pink: #d1699f;

        --shadow-card:
          0 4px 12px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.2);
        --shadow-hover:
          0 8px 24px rgba(0, 0, 0, 0.4), 0 16px 48px rgba(0, 0, 0, 0.2);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-body);
        color: var(--text-main);
        display: flex;
        min-height: 100vh;
        transition: background 0.3s, color 0.3s;
      }
      a { text-decoration: none; color: inherit; }
      button { cursor: pointer; font-family: inherit; border: none; background: none; }
      input, select, textarea { font-family: inherit; color: var(--text-main); }

      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-width: 0;
      }
      .content {
        flex: 1;
        padding: 28px 32px 20px;
        min-width: 0;
      }

      /* ============ BOTÕES ============ */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 18px;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 600;
        border: 1px solid transparent;
        cursor: pointer;
        transition: 0.2s;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .btn i { font-size: 14px; }
      .btn.primary {
        background: var(--primary-gradient);
        color: #fff;
        box-shadow: var(--shadow-card);
      }
      .btn.primary:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
      .btn.secondary {
        background: var(--bg-soft);
        color: var(--text-main);
        border-color: var(--border);
      }
      .btn.secondary:hover { border-color: var(--border-hover); }
      .btn.danger {
        background: var(--red-bg);
        color: var(--red);
        border-color: var(--red);
      }
      .btn.danger:hover { background: var(--red); color: #fff; }

      /* ============ KPI / STATS ============ */
      .stats-wrapper {
        display: flex;
        align-items: stretch;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        flex: 1 1 auto;
        min-width: 0;
      }
      .kpi-card {
        background: var(--bg-card);
        border-radius: 12px;
        padding: 14px 18px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-card);
        transition: 0.3s;
        position: relative;
        overflow: hidden;
        min-width: 0;
        width: 100%;
      }
      .kpi-card:hover {
        border-color: var(--border-hover);
        box-shadow: var(--shadow-hover);
        transform: translateY(-2px);
      }
      .kpi-card::after {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: var(--primary-gradient);
        opacity: 0.6;
      }
      .kpi-card.c-blue::after { background: var(--primary-gradient); }
      .kpi-card.c-amber::after { background: var(--amber); opacity: 0.8; }
      .kpi-card.c-red::after { background: var(--red); opacity: 0.8; }
      .kpi-card.c-green::after { background: var(--green); opacity: 0.8; }
      .kpi-card.c-purple::after { background: var(--purple); opacity: 0.8; }
      .kpi-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .kpi-label i { color: var(--primary); font-size: 12px; }
      .kpi-value { font-size: 26px; font-weight: 700; color: var(--text-main); line-height: 1.1; }

      /* Botão "Adicionar Tarefa" — ocupa o mesmo "andar" dos cards
         e tem altura compatível para não ficar miúdo. */
      .stats-wrapper > .btn.primary {
        align-self: stretch;
        padding: 0 22px;
        font-size: 14px;
      }

      /* ============ FILTER BAR ============ */
      .filter-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 24px;
        flex-wrap: wrap;
        align-items: center;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        box-shadow: var(--shadow-card);
      }
      .search-box { flex: 1; min-width: 220px; position: relative; }
      .search-box i {
        position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
        color: var(--text-muted); font-size: 14px; pointer-events: none;
      }
      .search-box input {
        width: 100%;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px 10px 36px;
        font-size: 13.5px;
        outline: none;
        transition: 0.2s;
      }
      .search-box input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-light);
      }
      .filter-select {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 32px 10px 12px;
        font-size: 13.5px;
        font-weight: 500;
        outline: none;
        cursor: pointer;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237b92b2' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 14px;
        min-width: 150px;
        transition: 0.2s;
      }
      .filter-select:hover { border-color: var(--border-hover); }
      .filter-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
      .filter-clear {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 12.5px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: 0.2s;
      }
      .filter-clear:hover { background: var(--bg-soft); color: var(--text-main); border-color: var(--border-hover); }

      /* ============ KANBAN BOARD ============ */
      .kanban-board {
        display: grid;
        grid-template-columns: repeat(4, minmax(280px, 1fr));
        gap: 16px;
        align-items: start;
      }
      .kanban-column {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow-card);
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 300px);
        min-height: 360px;
        overflow: hidden;
        transition: 0.2s;
      }
      .kanban-column.drag-over {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-light);
      }
      .column-header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        background: var(--bg-soft);
        border-radius: 14px 14px 0 0;
      }
      .column-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
      .column-dot.todo { background: var(--text-muted); }
      .column-dot.doing { background: var(--primary); }
      .column-dot.review { background: var(--amber); }
      .column-dot.done { background: var(--green); }
      .column-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-main);
        flex: 1;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .column-count {
        background: var(--bg-card);
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 20px;
        border: 1px solid var(--border);
      }
      .column-add-btn, .column-collapse-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        width: 26px; height: 26px;
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-size: 12.5px;
        transition: 0.2s;
      }
      .column-add-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
      .column-collapse-btn:hover { border-color: var(--primary); color: var(--primary); }
      .column-collapse-btn { margin-left: auto; }
      .column-cards {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
        flex: 1;
        min-height: 200px;
      }
      .column-empty {
        text-align: center;
        padding: 24px 12px;
        color: var(--text-muted);
        font-size: 12px;
        border: 2px dashed var(--border);
        border-radius: 10px;
        margin: 4px;
        font-style: italic;
      }

      /* ============ KANBAN CARD ============ */
      .kanban-card {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        cursor: grab;
        transition: 0.2s;
        position: relative;
        border-left: 3px solid var(--text-muted);
        user-select: none;
      }
      .kanban-card:hover {
        border-color: var(--border-hover);
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }
      .kanban-card:active { cursor: grabbing; }
      .kanban-card.dragging { opacity: 0.5; transform: rotate(1.5deg); cursor: grabbing; }
      .kanban-card.priority-alta { border-left-color: var(--red); }
      .kanban-card.priority-media { border-left-color: var(--amber); }
      .kanban-card.priority-baixa { border-left-color: var(--green); }
      .kanban-card.overdue { background: linear-gradient(135deg, var(--bg-soft), var(--red-bg)); }

      .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      .card-id { font-size: 10.5px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.04em; }
      .card-menu-btn {
        background: transparent; border: none; color: var(--text-muted);
        width: 22px; height: 22px; border-radius: 6px;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; transition: 0.15s; flex-shrink: 0;
      }
      .card-menu-btn:hover { background: var(--bg-card); color: var(--text-main); }
      .card-menu {
        position: absolute; top: 34px; right: 8px;
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 10px; box-shadow: var(--shadow-hover);
        padding: 6px; display: none; flex-direction: column; z-index: 10; min-width: 140px;
      }
      .card-menu.open { display: flex; }
      .card-menu button {
        background: transparent; border: none; color: var(--text-main);
        padding: 7px 10px; text-align: left; font-size: 12.5px; border-radius: 6px;
        display: flex; align-items: center; gap: 8px; font-weight: 500; transition: 0.15s;
      }
      .card-menu button:hover { background: var(--bg-soft); }
      .card-menu button.danger { color: var(--red); }
      .card-menu button.danger:hover { background: var(--red-bg); }

      .card-title { font-size: 13.5px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; line-height: 1.35; }
      .card-desc {
        font-size: 12px; color: var(--text-secondary); margin-bottom: 10px;
        display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden; line-height: 1.45;
      }
      .card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
      .tag {
        font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
        text-transform: uppercase; letter-spacing: 0.04em; border: 1px solid transparent;
      }
      .tag-priority-alta { background: var(--red-bg); color: var(--red); border-color: var(--red); }
      .tag-priority-media { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
      .tag-priority-baixa { background: var(--green-bg); color: var(--green); border-color: var(--green); }
      .tag-cat-estoque { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
      .tag-cat-transporte { background: var(--purple-bg); color: var(--purple); border-color: var(--purple); }
      .tag-cat-compras { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
      .tag-cat-financeiro { background: var(--green-bg); color: var(--green); border-color: var(--green); }
      .tag-cat-logistica { background: var(--pink-bg); color: var(--pink); border-color: var(--pink); }

      .card-footer {
        display: flex; justify-content: space-between; align-items: center; gap: 8px;
        padding-top: 8px; border-top: 1px solid var(--border);
      }
      .card-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); }
      .card-meta span { display: inline-flex; align-items: center; gap: 4px; }
      .card-meta .overdue-flag { color: var(--red); font-weight: 700; }
      .card-avatar {
        width: 26px; height: 26px; border-radius: 50%;
        background: var(--primary-light); border: 1px solid var(--primary); color: var(--primary);
        display: flex; align-items: center; justify-content: center;
        font-size: 11px; font-weight: 700; flex-shrink: 0;
      }
      .kanban-card.overdue .card-avatar { border-color: var(--red); color: var(--red); background: var(--red-bg); }

      /* ============ MODAL ============ */
      .modal-overlay {
        position: fixed; inset: 0; background: rgba(10, 20, 35, 0.55); backdrop-filter: blur(4px);
        display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
      }
      .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .modal {
        background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
        width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto;
        box-shadow: var(--shadow-hover); padding: 28px; position: relative;
        animation: slideUp 0.25s ease;
      }
      @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      .modal-title { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
      .modal-title i { color: var(--primary); font-size: 18px; }
      .modal-subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 22px; }
      .modal-close {
        position: absolute; top: 18px; right: 18px; background: transparent; border: none; color: var(--text-muted);
        width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
        font-size: 15px; transition: 0.15s;
      }
      .modal-close:hover { background: var(--bg-soft); color: var(--text-main); }

      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .form-grid .full { grid-column: 1 / -1; }
      .form-group { display: flex; flex-direction: column; gap: 6px; }
      .form-label { font-size: 11.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
      .form-label .req { color: var(--red); margin-left: 2px; }
      .form-input, .form-textarea, .form-select {
        background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px;
        padding: 10px 12px; font-size: 13.5px; outline: none; width: 100%; transition: 0.2s;
      }
      .form-input:focus, .form-textarea:focus, .form-select:focus {
        border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light);
      }
      .form-textarea { resize: vertical; min-height: 80px; font-family: inherit; }
      .form-select {
        cursor: pointer; appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237b92b2' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat; background-position: right 10px center; background-size: 14px; padding-right: 32px;
      }
      .form-error { font-size: 12px; color: var(--red); margin-top: 2px; display: none; }
      .form-error.show { display: block; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); }

      /* ============ TOAST ============ */
      .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
      .toast {
        background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--primary);
        border-radius: 10px; padding: 12px 16px; box-shadow: var(--shadow-hover);
        display: flex; align-items: center; gap: 10px; min-width: 240px; max-width: 360px;
        pointer-events: auto; color: var(--text-main); font-size: 13.5px; font-weight: 500;
        animation: slideInRight 0.3s ease;
      }
      .toast.success { border-left-color: var(--green); }
      .toast.error { border-left-color: var(--red); }
      .toast.warning { border-left-color: var(--amber); }
      .toast i { font-size: 16px; flex-shrink: 0; }
      .toast.success i { color: var(--green); }
      .toast.error i { color: var(--red); }
      .toast.warning i { color: var(--amber); }
      .toast.info i { color: var(--primary); }
      @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
      .toast.hiding { animation: slideOutRight 0.3s ease forwards; }
      @keyframes slideOutRight { to { opacity: 0; transform: translateX(40px); } }

      /* ============ RESPONSIVIDADE ============ */
      @media (max-width: 1200px) {
        .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .kpi-value { font-size: 22px; }
        .kanban-board { grid-template-columns: repeat(2, minmax(260px, 1fr)); }
      }
      @media (max-width: 900px) {
        .kanban-board { grid-template-columns: 1fr; gap: 14px; }
        .kanban-column { max-height: none; min-height: 0; }
        .kanban-column.collapsed .column-cards { display: none; }
        .stats-wrapper { flex-direction: column; align-items: stretch; }
        .stats-wrapper > .btn.primary { width: 100%; padding: 12px 18px; }
        .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      }
      @media (max-width: 768px) {
        .content { padding: 18px 16px; }
        .form-grid { grid-template-columns: 1fr; }
        .filter-select { min-width: 100%; }
        .search-box { min-width: 100%; }
        .kpi-grid { grid-template-columns: 1fr; }
        .kpi-value { font-size: 22px; }
      }
    </style>
  </head>
  <body>
    <!-- SIDEBAR -->
    <div id="sidebar-root"></div>

    <div class="main-wrapper">
      <!-- HEADER -->
      <div id="header-root"></div>

      <main class="content" role="main">
        <!-- STATS + BOTÃO ADICIONAR -->
        <div class="stats-wrapper">
          <div class="kpi-grid" id="kanbanStats"></div>
          <button class="btn primary" onclick="openTaskModal()">
            <i class="fas fa-plus"></i> Adicionar Tarefa
          </button>
        </div>

        <!-- FILTER BAR -->
        <div class="filter-bar">
          <div class="search-box">
            <i class="fas fa-magnifying-glass"></i>
            <input type="search" id="searchInput" placeholder="Pesquisar tarefas por título, descrição ou responsável..." />
          </div>
          <select class="filter-select" id="filterPriority">
            <option value="">Todas Prioridades</option>
            <option value="alta">Alta</option>
            <option value="media">Média</option>
            <option value="baixa">Baixa</option>
          </select>
          <select class="filter-select" id="filterResponsible">
            <option value="">Todos Responsáveis</option>
          </select>
          <select class="filter-select" id="filterCategory">
            <option value="">Todas Categorias</option>
            <option value="Estoque">Estoque</option>
            <option value="Transporte">Transporte</option>
            <option value="Compras">Compras</option>
            <option value="Financeiro">Financeiro</option>
            <option value="Logística">Logística</option>
          </select>
          <select class="filter-select" id="filterStatus">
            <option value="">Todos Status</option>
            <option value="todo">A Fazer</option>
            <option value="doing">Em Andamento</option>
            <option value="review">Em Revisão</option>
            <option value="done">Concluído</option>
          </select>
          <button class="filter-clear" onclick="clearFilters()">
            <i class="fas fa-rotate-left"></i> Limpar
          </button>
        </div>

        <!-- KANBAN BOARD -->
        <div class="kanban-board" id="kanbanBoard">
          <div class="kanban-column" data-status="todo">
            <div class="column-header">
              <span class="column-dot todo"></span>
              <span class="column-title">A Fazer</span>
              <span class="column-count" id="count-todo">0</span>
              <button class="column-add-btn" onclick="openTaskModal('todo')" aria-label="Adicionar tarefa"><i class="fas fa-plus"></i></button>
            </div>
            <div class="column-cards" id="col-todo" data-status="todo"></div>
          </div>

          <div class="kanban-column" data-status="doing">
            <div class="column-header">
              <span class="column-dot doing"></span>
              <span class="column-title">Em Andamento</span>
              <span class="column-count" id="count-doing">0</span>
              <button class="column-add-btn" onclick="openTaskModal('doing')" aria-label="Adicionar tarefa"><i class="fas fa-plus"></i></button>
            </div>
            <div class="column-cards" id="col-doing" data-status="doing"></div>
          </div>

          <div class="kanban-column" data-status="review">
            <div class="column-header">
              <span class="column-dot review"></span>
              <span class="column-title">Em Revisão</span>
              <span class="column-count" id="count-review">0</span>
              <button class="column-add-btn" onclick="openTaskModal('review')" aria-label="Adicionar tarefa"><i class="fas fa-plus"></i></button>
            </div>
            <div class="column-cards" id="col-review" data-status="review"></div>
          </div>

          <div class="kanban-column" data-status="done">
            <div class="column-header">
              <span class="column-dot done"></span>
              <span class="column-title">Concluído</span>
              <span class="column-count" id="count-done">0</span>
              <button class="column-add-btn" onclick="openTaskModal('done')" aria-label="Adicionar tarefa"><i class="fas fa-plus"></i></button>
            </div>
            <div class="column-cards" id="col-done" data-status="done"></div>
          </div>
        </div>
      </main>

      <!-- RODAPÉ -->
      <div id="footer-root"></div>
    </div>

    <!-- ================== TASK MODAL ================== -->
    <div class="modal-overlay" id="taskModal">
      <div class="modal">
        <button class="modal-close" onclick="closeTaskModal()" aria-label="Fechar"><i class="fas fa-xmark"></i></button>
        <div class="modal-title"><i class="fas fa-table-columns"></i> <span id="modalTitle">Nova Tarefa</span></div>
        <div class="modal-subtitle">Preencha os dados para registrar uma nova atividade no quadro.</div>

        <form id="taskForm" onsubmit="event.preventDefault(); saveTask();">
          <input type="hidden" id="taskId" />
          <div class="form-grid">
            <div class="form-group full">
              <label class="form-label">Título <span class="req">*</span></label>
              <input class="form-input" type="text" id="taskTitle" placeholder="Ex: Conferir estoque do depósito" maxlength="120" />
              <div class="form-error" id="err-title">Informe o título da tarefa.</div>
            </div>
            <div class="form-group full">
              <label class="form-label">Descrição</label>
              <textarea class="form-textarea" id="taskDesc" placeholder="Detalhes adicionais sobre a tarefa..."></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Responsável <span class="req">*</span></label>
              <select class="form-select" id="taskResponsible"><option value="">Selecione...</option></select>
              <div class="form-error" id="err-responsible">Selecione um responsável.</div>
            </div>
            <div class="form-group">
              <label class="form-label">Prioridade <span class="req">*</span></label>
              <select class="form-select" id="taskPriority">
                <option value="alta">Alta</option>
                <option value="media" selected>Média</option>
                <option value="baixa">Baixa</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Categoria <span class="req">*</span></label>
              <select class="form-select" id="taskCategory">
                <option value="Estoque">Estoque</option>
                <option value="Transporte">Transporte</option>
                <option value="Compras">Compras</option>
                <option value="Financeiro">Financeiro</option>
                <option value="Logística">Logística</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Data de Entrega</label>
              <input class="form-input" type="date" id="taskDueDate" />
            </div>
            <div class="form-group full">
              <label class="form-label">Status</label>
              <select class="form-select" id="taskStatus">
                <option value="todo">A Fazer</option>
                <option value="doing">Em Andamento</option>
                <option value="review">Em Revisão</option>
                <option value="done">Concluído</option>
              </select>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn secondary" onclick="closeTaskModal()">Cancelar</button>
            <button type="submit" class="btn primary"><i class="fas fa-check"></i> <span id="modalSaveText">Salvar Tarefa</span></button>
          </div>
        </form>
      </div>
    </div>

    <!-- ================== TOAST CONTAINER ================== -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="components/js/header.js"></script>
    <script src="components/js/sidebar.js"></script>
    <script src="components/js/footer.js"></script>
    <script src="components/js/modoescuro.js"></script>

    <script>
      /* =========================================================
         StockLog — Kanban (lógica do quadro)
         ========================================================= */
      const STORAGE_KEY = "stocklog_kanban_v1";
      const USERS_KEY = "stocklog_kanban_users_v1";

      const STATUS_LABELS = { todo: "A Fazer", doing: "Em Andamento", review: "Em Revisão", done: "Concluído" };

      const DEFAULT_USERS = ["Maria Silva", "João Santos", "Pedro Costa", "Ana Oliveira", "Carlos Lima", "Fernanda Rocha", "Rafael Mendes"];

      const DEFAULT_TASKS = [
        { id: "t1", title: "Conferir estoque do depósito central", desc: "Realizar contagem física e validar com sistema.", responsible: "Maria Silva", priority: "alta", category: "Estoque", dueDate: "2026-08-22", status: "doing" },
        { id: "t2", title: "Atualizar entrada de mercadorias", desc: "Lançar NF-e 4521, 4522 e 4523 no sistema.", responsible: "João Santos", priority: "media", category: "Estoque", dueDate: "2026-08-21", status: "todo" },
        { id: "t3", title: "Conferir pedidos pendentes", desc: "Validar status de 14 pedidos em aberto na transportadora.", responsible: "Carlos Lima", priority: "alta", category: "Logística", dueDate: "2026-08-20", status: "todo" },
        { id: "t4", title: "Organizar rota de entrega - Zona Sul", desc: "Sequenciar 8 entregas por CEP e prazo.", responsible: "Rafael Mendes", priority: "media", category: "Transporte", dueDate: "2026-08-23", status: "doing" },
        { id: "t5", title: "Verificar produtos com estoque baixo", desc: "Parafuso M8, Luva Nitrílica e Chapa Inox 304.", responsible: "Ana Oliveira", priority: "alta", category: "Estoque", dueDate: "2026-08-20", status: "review" },
        { id: "t6", title: "Atualizar cadastro de fornecedor", desc: "Inox do Brasil — novo contato comercial.", responsible: "Fernanda Rocha", priority: "baixa", category: "Compras", dueDate: "2026-08-25", status: "todo" },
        { id: "t7", title: "Conferir movimentações de estoque", desc: "Auditoria semanal — entradas e saídas.", responsible: "Maria Silva", priority: "media", category: "Estoque", dueDate: "2026-08-19", status: "done" },
        { id: "t8", title: "Emitir ordem de compra - Fixadores", desc: "Solicitar 5.000 parafusos M8 zincados.", responsible: "Pedro Costa", priority: "media", category: "Compras", dueDate: "2026-08-24", status: "todo" },
        { id: "t9", title: "Analisar ruptura de estoque", desc: "Levantar itens críticos para reunião semanal.", responsible: "Carlos Lima", priority: "alta", category: "Estoque", dueDate: "2026-08-21", status: "review" },
        { id: "t10", title: "Processar devoluções - Cliente XPTO", desc: "3 volumes retornados por avaria. Registrar NF.", responsible: "Ana Oliveira", priority: "baixa", category: "Logística", dueDate: "2026-08-26", status: "todo" },
        { id: "t11", title: "Atualizar tabela de frete", desc: "Revisão trimestral com transportadoras parceiras.", responsible: "Rafael Mendes", priority: "baixa", category: "Financeiro", dueDate: "2026-08-30", status: "todo" },
        { id: "t12", title: "Treinamento de equipe - WMS", desc: "Capacitar 4 operadores no novo sistema.", responsible: "Fernanda Rocha", priority: "media", category: "Logística", dueDate: "2026-08-27", status: "doing" }
      ];

      let state = {
        tasks: [],
        users: [],
        filters: { search: "", priority: "", responsible: "", category: "", status: "" },
        currentDragId: null
      };

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          const users = localStorage.getItem(USERS_KEY);
          state.tasks = saved ? JSON.parse(saved) : DEFAULT_TASKS.slice();
          state.users = users ? JSON.parse(users) : DEFAULT_USERS.slice();
          if (!saved) saveState();
          if (!users) saveUsers();
        } catch (e) {
          console.error("Erro ao carregar:", e);
          state.tasks = DEFAULT_TASKS.slice();
          state.users = DEFAULT_USERS.slice();
        }
      }
      function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks)); }
      function saveUsers() { localStorage.setItem(USERS_KEY, JSON.stringify(state.users)); }

      function clearFilters() {
        state.filters = { search: "", priority: "", responsible: "", category: "", status: "" };
        document.getElementById("searchInput").value = "";
        document.getElementById("filterPriority").value = "";
        document.getElementById("filterResponsible").value = "";
        document.getElementById("filterCategory").value = "";
        document.getElementById("filterStatus").value = "";
        render();
        showToast("Filtros limpos.", "info");
      }
      document.getElementById("searchInput").addEventListener("input", (e) => { state.filters.search = e.target.value.toLowerCase(); render(); });
      document.getElementById("filterPriority").addEventListener("change", (e) => { state.filters.priority = e.target.value; render(); });
      document.getElementById("filterResponsible").addEventListener("change", (e) => { state.filters.responsible = e.target.value; render(); });
      document.getElementById("filterCategory").addEventListener("change", (e) => { state.filters.category = e.target.value; render(); });
      document.getElementById("filterStatus").addEventListener("change", (e) => { state.filters.status = e.target.value; render(); });

      function populateSelects() {
        const resp = document.getElementById("filterResponsible");
        const taskResp = document.getElementById("taskResponsible");
        resp.innerHTML = '<option value="">Todos Responsáveis</option>';
        taskResp.innerHTML = '<option value="">Selecione...</option>';
        state.users.forEach((u) => {
          resp.insertAdjacentHTML("beforeend", `<option value="${u}">${u}</option>`);
          taskResp.insertAdjacentHTML("beforeend", `<option value="${u}">${u}</option>`);
        });
      }

      function renderStats() {
        const total = state.tasks.length;
        const doing = state.tasks.filter((t) => t.status === "doing").length;
        const overdue = state.tasks.filter((t) => isOverdue(t)).length;
        const done = state.tasks.filter((t) => t.status === "done").length;
        const high = state.tasks.filter((t) => t.priority === "alta" && t.status !== "done").length;

        const stats = [
          { label: "Total de Tarefas", value: total, icon: "fa-table-columns", cls: "c-blue" },
          { label: "Em Andamento", value: doing, icon: "fa-circle-play", cls: "c-blue" },
          { label: "Em Atraso", value: overdue, icon: "fa-triangle-exclamation", cls: "c-red" },
          { label: "Concluídas", value: done, icon: "fa-circle-check", cls: "c-green" },
          { label: "Prioridade Alta", value: high, icon: "fa-fire", cls: "c-amber" }
        ];

        document.getElementById("kanbanStats").innerHTML = stats
          .map(
            (s) => `
          <div class="kpi-card ${s.cls}">
            <div class="kpi-label"><i class="fas ${s.icon}"></i> ${s.label}</div>
            <div class="kpi-value">${s.value}</div>
          </div>`
          )
          .join("");
      }

      function isOverdue(task) {
        if (!task.dueDate || task.status === "done") return false;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const due = new Date(task.dueDate + "T00:00:00");
        return due < today;
      }
      function formatDateBR(dateStr) {
        if (!dateStr) return "";
        const [y, m, d] = dateStr.split("-");
        return `${d}/${m}`;
      }
      function daysUntil(dateStr) {
        if (!dateStr) return null;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const due = new Date(dateStr + "T00:00:00");
        return Math.ceil((due - today) / (1000 * 60 * 60 * 24));
      }
      function getInitials(name) {
        if (!name) return "?";
        return name.split(" ").map((n) => n[0]).slice(0, 2).join("").toUpperCase();
      }
      function escapeHtml(str) {
        if (str == null) return "";
        return String(str).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
      }

      function applyFilters(tasks) {
        return tasks.filter((t) => {
          const f = state.filters;
          if (f.search) {
            const hay = (t.title + " " + t.desc + " " + t.responsible).toLowerCase();
            if (!hay.includes(f.search)) return false;
          }
          if (f.priority && t.priority !== f.priority) return false;
          if (f.responsible && t.responsible !== f.responsible) return false;
          if (f.category && t.category !== f.category) return false;
          if (f.status && t.status !== f.status) return false;
          return true;
        });
      }

      function renderCard(task) {
        const overdue = isOverdue(task);
        const days = daysUntil(task.dueDate);
        let dateLabel = "";
        if (task.dueDate) {
          if (overdue) dateLabel = `<span class="overdue-flag"><i class="fas fa-circle-exclamation"></i> ${formatDateBR(task.dueDate)}</span>`;
          else if (days === 0) dateLabel = `<span style="color: var(--amber)"><i class="fas fa-clock"></i> Hoje</span>`;
          else if (days === 1) dateLabel = `<span><i class="fas fa-calendar"></i> Amanhã</span>`;
          else dateLabel = `<span><i class="fas fa-calendar"></i> ${formatDateBR(task.dueDate)}</span>`;
        }

        const catSlug = task.category.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]/g, "");
        const catClass = "tag-cat-" + catSlug;

        return `
          <div class="kanban-card priority-${task.priority} ${overdue ? "overdue" : ""}" draggable="true" data-id="${task.id}">
            <div class="card-top">
              <span class="card-id">#${task.id.toUpperCase()}</span>
              <button class="card-menu-btn" onclick="toggleCardMenu(event, '${task.id}')" aria-label="Menu"><i class="fas fa-ellipsis-vertical"></i></button>
              <div class="card-menu" id="menu-${task.id}">
                <button onclick="editTask('${task.id}')"><i class="fas fa-pen"></i> Editar</button>
                <button onclick="duplicateTask('${task.id}')"><i class="fas fa-copy"></i> Duplicar</button>
                <button class="danger" onclick="deleteTask('${task.id}')"><i class="fas fa-trash"></i> Excluir</button>
              </div>
            </div>
            <div class="card-title">${escapeHtml(task.title)}</div>
            ${task.desc ? `<div class="card-desc">${escapeHtml(task.desc)}</div>` : ""}
            <div class="card-tags">
              <span class="tag tag-priority-${task.priority}">${task.priority.charAt(0).toUpperCase() + task.priority.slice(1)}</span>
              <span class="tag ${catClass}">${escapeHtml(task.category)}</span>
            </div>
            <div class="card-footer">
              <div class="card-meta">${dateLabel || '<span style="opacity:0.6"><i class="fas fa-calendar"></i> Sem prazo</span>'}</div>
              <div class="card-avatar" title="${escapeHtml(task.responsible)}">${getInitials(task.responsible)}</div>
            </div>
          </div>`;
      }

      function renderColumn(status) {
        const col = document.getElementById("col-" + status);
        const filtered = applyFilters(state.tasks.filter((t) => t.status === status));
        if (filtered.length === 0) {
          const hasFilters = state.filters.search || state.filters.priority || state.filters.category || state.filters.responsible || state.filters.status;
          col.innerHTML = `<div class="column-empty">Nenhuma tarefa<br>${hasFilters ? "com os filtros aplicados" : "aqui ainda"}</div>`;
        } else {
          col.innerHTML = filtered.map(renderCard).join("");
        }
        document.getElementById("count-" + status).textContent = filtered.length;
        attachDragEvents(col);
      }

      function render() {
        renderStats();
        ["todo", "doing", "review", "done"].forEach(renderColumn);
        populateSelects();
      }

      function attachDragEvents(col) {
        col.querySelectorAll(".kanban-card").forEach((card) => {
          card.addEventListener("dragstart", (e) => {
            state.currentDragId = card.dataset.id;
            card.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
            try { e.dataTransfer.setData("text/plain", card.dataset.id); } catch (_) {}
          });
          card.addEventListener("dragend", () => {
            card.classList.remove("dragging");
            state.currentDragId = null;
            document.querySelectorAll(".kanban-column").forEach((c) => c.classList.remove("drag-over"));
          });
        });
      }

      document.querySelectorAll(".column-cards").forEach((col) => {
        col.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          col.parentElement.classList.add("drag-over");
        });
        col.addEventListener("dragleave", (e) => {
          if (!col.contains(e.relatedTarget)) col.parentElement.classList.remove("drag-over");
        });
        col.addEventListener("drop", (e) => {
          e.preventDefault();
          col.parentElement.classList.remove("drag-over");
          const id = state.currentDragId || e.dataTransfer.getData("text/plain");
          if (!id) return;
          const task = state.tasks.find((t) => t.id === id);
          if (!task) return;
          const newStatus = col.dataset.status;
          if (task.status === newStatus) return;
          const oldLabel = STATUS_LABELS[task.status];
          const newLabel = STATUS_LABELS[newStatus];
          task.status = newStatus;
          saveState();
          render();
          showToast(`"${task.title}" movida: ${oldLabel} → ${newLabel}`, "success");
        });
      });

      function toggleCardMenu(e, id) {
        e.stopPropagation();
        document.querySelectorAll(".card-menu").forEach((m) => { if (m.id !== "menu-" + id) m.classList.remove("open"); });
        const menu = document.getElementById("menu-" + id);
        if (menu) menu.classList.toggle("open");
      }
      document.addEventListener("click", () => document.querySelectorAll(".card-menu").forEach((m) => m.classList.remove("open")));

      function openTaskModal(status = "todo") {
        document.getElementById("taskForm").reset();
        document.getElementById("taskId").value = "";
        document.getElementById("taskStatus").value = status;
        document.getElementById("taskPriority").value = "media";
        document.getElementById("modalTitle").textContent = "Nova Tarefa";
        document.getElementById("modalSaveText").textContent = "Salvar Tarefa";
        document.querySelectorAll(".form-error").forEach((e) => e.classList.remove("show"));
        populateSelects();
        document.getElementById("taskModal").classList.add("open");
      }
      function closeTaskModal() { document.getElementById("taskModal").classList.remove("open"); }

      function editTask(id) {
        const task = state.tasks.find((t) => t.id === id);
        if (!task) return;
        document.getElementById("taskId").value = task.id;
        document.getElementById("taskTitle").value = task.title;
        document.getElementById("taskDesc").value = task.desc || "";
        document.getElementById("taskResponsible").value = task.responsible;
        document.getElementById("taskPriority").value = task.priority;
        document.getElementById("taskCategory").value = task.category;
        document.getElementById("taskDueDate").value = task.dueDate || "";
        document.getElementById("taskStatus").value = task.status;
        document.getElementById("modalTitle").textContent = "Editar Tarefa";
        document.getElementById("modalSaveText").textContent = "Atualizar Tarefa";
        document.querySelectorAll(".form-error").forEach((e) => e.classList.remove("show"));
        document.getElementById("taskModal").classList.add("open");
      }

      function saveTask() {
        const id = document.getElementById("taskId").value;
        const title = document.getElementById("taskTitle").value.trim();
        const responsible = document.getElementById("taskResponsible").value;
        const priority = document.getElementById("taskPriority").value;
        const category = document.getElementById("taskCategory").value;
        const dueDate = document.getElementById("taskDueDate").value;
        const status = document.getElementById("taskStatus").value;
        const desc = document.getElementById("taskDesc").value.trim();

        let valid = true;
        const showErr = (fid, show) => {
          const el = document.getElementById("err-" + fid);
          if (el) el.classList.toggle("show", show);
          if (show) valid = false;
        };
        showErr("title", !title);
        showErr("responsible", !responsible);
        if (!valid) return;

        if (id) {
          const task = state.tasks.find((t) => t.id === id);
          if (task) {
            Object.assign(task, { title, desc, responsible, priority, category, dueDate, status });
            showToast("Tarefa atualizada.", "success");
          }
        } else {
          const newId = "t" + Date.now().toString(36);
          state.tasks.push({ id: newId, title, desc, responsible, priority, category, dueDate, status });
          if (!state.users.includes(responsible)) { state.users.push(responsible); saveUsers(); }
          showToast("Tarefa criada no quadro.", "success");
        }
        saveState();
        closeTaskModal();
        render();
      }

      function deleteTask(id) {
        const task = state.tasks.find((t) => t.id === id);
        if (!task) return;
        if (!confirm(`Excluir a tarefa "${task.title}"?`)) return;
        state.tasks = state.tasks.filter((t) => t.id !== id);
        saveState();
        render();
        showToast("Tarefa excluída.", "warning");
      }

      function duplicateTask(id) {
        const task = state.tasks.find((t) => t.id === id);
        if (!task) return;
        const newId = "t" + Date.now().toString(36);
        state.tasks.push({ ...task, id: newId, title: task.title + " (cópia)", status: "todo" });
        saveState();
        render();
        showToast("Tarefa duplicada.", "info");
      }

      function toggleColumn(btn) {
        if (window.innerWidth > 900) return;
        const col = btn.closest(".kanban-column");
        col.classList.toggle("collapsed");
        const icon = btn.querySelector("i");
        icon.className = col.classList.contains("collapsed") ? "fas fa-chevron-down" : "fas fa-chevron-up";
      }

      function showToast(message, type = "info") {
        const container = document.getElementById("toastContainer");
        const icons = { success: "fa-circle-check", error: "fa-circle-xmark", warning: "fa-triangle-exclamation", info: "fa-circle-info" };
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${icons[type] || "fa-circle-info"}"></i><span>${escapeHtml(message)}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.classList.add("hiding");
          setTimeout(() => toast.remove(), 300);
        }, 3200);
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeTaskModal();
          document.querySelectorAll(".card-menu").forEach((m) => m.classList.remove("open"));
        }
        if (e.key === "n" && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          openTaskModal();
        }
      });

      loadState();
      populateSelects();
      render();
    </script>
  </body>
</html>
