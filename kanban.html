<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLog · Kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="components/css/sidebar.css" />
    <link rel="stylesheet" href="components/css/header.css" />
    <link rel="stylesheet" href="components/css/chat.css" />
    <link rel="stylesheet" href="components/css/footer.css" />
    <link rel="stylesheet" href="components/css/modoescuro.css" />
    <link rel="stylesheet" href="components/css/responsive.css" />
       <style>
      :root {
        --bg-body: #f0f5fc;
        --bg-card: #ffffff;
        --bg-soft: #f5faff;
        --border: #e2ecf6;
        --border-hover: #c6daea;

        --primary: #006bb3;
        --primary-dark: #004d80;
        --primary-light: #e1eefb;
        --primary-gradient: linear-gradient(145deg, #0077be, #005a8c);

        --text-main: #0a1f33;
        --text-secondary: #3d5f7e;
        --text-muted: #7b92b2;

        --shadow-card: 0 4px 12px rgba(0, 40, 80, 0.04), 0 12px 32px rgba(0, 40, 80, 0.02);
        --shadow-hover: 0 8px 24px rgba(0, 40, 80, 0.08), 0 16px 48px rgba(0, 40, 80, 0.04);

        --green: #1a7b72; --green-bg: #e6f3f1;
        --amber: #c47a1f; --amber-bg: #fcf3e6;
        --red: #b2433a; --red-bg: #faeeed;
        --purple: #4a5a7a; --purple-bg: #edf0f7;
        --pink: #8a4d70; --pink-bg: #f6ecf2;
      }

      body.dark {
        --bg-body: #0d1727; --bg-card: #14243e; --bg-soft: #0f1f30;
        --border: #1d344b; --border-hover: #2a4866;
        --text-main: #e2edf8; --text-secondary: #a5bed6; --text-muted: #6f8daa;
        --primary: #38bdf8;
        --primary-light: #1d3a55;
        --green: #4a9d8f; --green-bg: #123a2a;
        --amber: #d1a24a; --amber-bg: #3a2f15;
        --red: #c96a61; --red-bg: #3a1f1f;
        --purple: #9fb1d8; --purple-bg: #202d46;
        --pink: #c98aa8; --pink-bg: #34182a;
        --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.2);
        --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.4), 0 16px 48px rgba(0, 0, 0, 0.2);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: "Inter", sans-serif; background: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; transition: background 0.3s, color 0.3s; }
      a { text-decoration: none; color: inherit; }
      button { cursor: pointer; font-family: inherit; border: none; background: none; }

      .main-wrapper { flex: 1; display: flex; flex-direction: column; min-height: 100vh; min-width: 0; }
      .content { flex: 1; padding: 28px 32px 20px; min-width: 0; }

      .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 600; border: 1px solid transparent; cursor: pointer; transition: 0.2s; white-space: nowrap; flex-shrink: 0; }
      .btn i { font-size: 14px; }
      .btn.primary { background: var(--primary-gradient); color: #fff; box-shadow: var(--shadow-card); }
      .btn.primary:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
      .btn.secondary { background: var(--bg-soft); color: var(--text-main); border-color: var(--border); }
      .btn.secondary:hover { border-color: var(--border-hover); }

      .view-tabs { display: flex; gap: 6px; margin-bottom: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; box-shadow: var(--shadow-card); flex-wrap: wrap; }
      .view-tab { padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text-secondary); transition: 0.2s; display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; background: transparent; border: none; }
      .view-tab:hover { background: var(--bg-soft); color: var(--text-main); }
      .view-tab.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(0, 107, 179, 0.3); }
      .view-tab.active:hover { background: var(--primary-dark); }

      .view-panel { display: none; animation: fadeIn 0.25s ease; }
      .view-panel.active { display: block; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

      .stats-wrapper { display: flex; align-items: stretch; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
      .kpi-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; flex: 1 1 auto; min-width: 0; }
      .kpi-card { background: var(--bg-card); border-radius: 12px; padding: 14px 18px; border: 1px solid var(--border); box-shadow: var(--shadow-card); transition: 0.3s; position: relative; overflow: hidden; min-width: 0; width: 100%; }
      .kpi-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
      .kpi-card::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--primary-gradient); opacity: 0.6; }
      .kpi-card.c-blue::after { background: var(--primary-gradient); }
      .kpi-card.c-amber::after { background: var(--amber); opacity: 0.8; }
      .kpi-card.c-red::after { background: var(--red); opacity: 0.8; }
      .kpi-card.c-green::after { background: var(--green); opacity: 0.8; }
      .kpi-card.c-purple::after { background: var(--purple); opacity: 0.8; }
      .kpi-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
      .kpi-label i { color: var(--primary); font-size: 12px; }
      .kpi-value { font-size: 26px; font-weight: 700; color: var(--text-main); line-height: 1.1; }
      .stats-wrapper > .btn.primary { align-self: stretch; padding: 0 22px; font-size: 14px; }

      .filter-bar { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; box-shadow: var(--shadow-card); }
      .search-box { flex: 1; min-width: 220px; position: relative; }
      .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; pointer-events: none; }
      .search-box input { width: 100%; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px 10px 36px; font-size: 13.5px; outline: none; transition: 0.2s; }
      .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
      .filter-select { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 10px 32px 10px 12px; font-size: 13.5px; font-weight: 500; outline: none; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237b92b2' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 10px center; background-size: 14px; min-width: 150px; transition: 0.2s; }
      .filter-select:hover { border-color: var(--border-hover); }
      .filter-clear { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 10px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
      .filter-clear:hover { background: var(--bg-soft); color: var(--text-main); border-color: var(--border-hover); }

      .kanban-board { display: grid; grid-template-columns: repeat(4, minmax(280px, 1fr)); gap: 16px; align-items: start; }
      .kanban-column { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; max-height: calc(100vh - 300px); min-height: 360px; overflow: hidden; transition: 0.2s; }
      .kanban-column.drag-over { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
      .column-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; background: var(--bg-soft); border-radius: 14px 14px 0 0; }
      .column-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
      .column-dot.todo { background: var(--text-muted); }
      .column-dot.doing { background: var(--primary); }
      .column-dot.review { background: var(--amber); }
      .column-dot.done { background: var(--green); }
      .column-title { font-size: 13px; font-weight: 700; color: var(--text-main); flex: 1; text-transform: uppercase; letter-spacing: 0.04em; }
      .column-count { background: var(--bg-soft); color: var(--text-secondary); font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); white-space: nowrap; }
      .column-add-btn, .column-collapse-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; transition: 0.2s; }
      .column-add-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
      .column-cards { padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; min-height: 200px; }
      .column-empty { text-align: center; padding: 24px 12px; color: var(--text-muted); font-size: 12px; border: 2px dashed var(--border); border-radius: 10px; margin: 4px; font-style: italic; }

      /* Cartão colorido por prioridade: fundo + faixa lateral variam conforme alta/média/baixa */
      .kanban-card { border: 2px solid var(--text-muted); border-radius: 10px; padding: 12px; cursor: grab; transition: 0.2s; position: relative; user-select: none; background: var(--bg-card); }
      .kanban-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
      .kanban-card:active { cursor: grabbing; }
      .kanban-card.dragging { opacity: 0.5; transform: rotate(1.5deg); cursor: grabbing; }
      .kanban-card.priority-alta { background: var(--bg-card); border-color: var(--red); }
      .kanban-card.priority-media { background: var(--bg-card); border-color: var(--amber); }
      .kanban-card.priority-baixa { background: var(--bg-card); border-color: var(--green); }
      .kanban-card.overdue { border-color: var(--red); box-shadow: inset 0 0 0 1px rgba(178, 67, 58, 0.25); }

      .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      .card-id { font-size: 10.5px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.04em; }
      .card-menu-btn { background: transparent; border: none; color: var(--text-muted); width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: 0.15s; flex-shrink: 0; }
      .card-menu-btn:hover { background: var(--bg-card); color: var(--text-main); }
      .card-menu { position: absolute; top: 34px; right: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-hover); padding: 6px; display: none; flex-direction: column; z-index: 10; min-width: 140px; }
      .card-menu.open { display: flex; }
      .card-menu button { background: transparent; border: none; color: var(--text-main); padding: 7px 10px; text-align: left; font-size: 12.5px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-weight: 500; transition: 0.15s; }
      .card-menu button:hover { background: var(--bg-soft); }
      .card-menu button.danger { color: var(--red); }
      .card-menu button.danger:hover { background: var(--red-bg); }

      .card-title { font-size: 13.5px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; line-height: 1.35; }
      .card-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.45; }

      .card-progress { margin: 8px 0 10px; display: flex; align-items: center; gap: 8px; }
      .card-progress .progress-track { flex: 1; height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
      .card-progress .progress-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; background: var(--primary-gradient); }
      .card-progress .progress-text { font-size: 10px; font-weight: 600; color: var(--text-muted); white-space: nowrap; min-width: 30px; text-align: right; }

      .card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
      .tag { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em; border: 1px solid transparent; }
      .tag-priority-alta { background: var(--red); color: #fff; border-color: var(--red); }
      .tag-priority-media { background: var(--amber); color: #fff; border-color: var(--amber); }
      .tag-priority-baixa { background: var(--green); color: #fff; border-color: var(--green); }
      .tag-cat-estoque { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
      .tag-cat-transporte { background: var(--purple-bg); color: var(--purple); border-color: var(--purple); }
      .tag-cat-compras { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
      .tag-cat-financeiro { background: var(--green-bg); color: var(--green); border-color: var(--green); }
      .tag-cat-logistica { background: var(--pink-bg); color: var(--pink); border-color: var(--pink); }
      .tag-cat-suporte { background: var(--purple-bg); color: var(--purple); border-color: var(--purple); }
      .tag-cat-ti { background: var(--pink-bg); color: var(--pink); border-color: var(--pink); }
      .tag-cat-administrativo { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
      .tag-cat-rh { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

      .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
      .card-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); }
      .card-meta span { display: inline-flex; align-items: center; gap: 4px; }
      .card-meta .overdue-flag { color: var(--red); font-weight: 700; }
      .card-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--primary-light); border: 1px solid var(--primary); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; cursor: help; transition: 0.2s; }
      .card-avatar:hover { transform: scale(1.1); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
      .kanban-card.overdue .card-avatar { border-color: var(--red); color: var(--red); background: var(--red-bg); }

      .modal-overlay { position: fixed; inset: 0; background: rgba(10, 20, 35, 0.55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
      .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
      .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-hover); padding: 28px; position: relative; animation: slideUp 0.25s ease; }
      .modal-title { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
      .modal-title i { color: var(--primary); font-size: 18px; }
      .modal-subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 22px; }
      .modal-close { position: absolute; top: 18px; right: 18px; background: transparent; border: none; color: var(--text-muted); width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: 0.15s; }
      .modal-close:hover { background: var(--bg-soft); color: var(--text-main); }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .form-grid .full { grid-column: 1 / -1; }
      .form-group { display: flex; flex-direction: column; gap: 6px; }
      .form-label { font-size: 11.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
      .form-input, .form-textarea, .form-select { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; outline: none; width: 100%; transition: 0.2s; }
      .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
      .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); }

      .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
      .toast { background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--primary); border-radius: 10px; padding: 12px 16px; box-shadow: var(--shadow-hover); display: flex; align-items: center; gap: 10px; min-width: 240px; max-width: 360px; pointer-events: auto; color: var(--text-main); font-size: 13.5px; font-weight: 500; animation: slideInRight 0.3s ease; }
      .toast.success { border-left-color: var(--green); }
      .toast.error { border-left-color: var(--red); }
      .toast.warning { border-left-color: var(--amber); }
      .toast i { font-size: 16px; flex-shrink: 0; }

      @media (max-width: 1200px) {
        .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .kanban-board { grid-template-columns: repeat(2, minmax(260px, 1fr)); }
      }
      @media (max-width: 900px) {
        .kanban-board { grid-template-columns: 1fr; gap: 14px; }
        .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      }
    </style>
  </head>
  <body>
    <!-- SIDEBAR -->
    <div id="sidebar-root"></div>

    <div class="main-wrapper">
      <!-- HEADER -->
      <div id="header-root"></div>

      <main class="content" role="main">
        <!-- CHAVE SELETORA: Kanban de OPs / Tarefas Administrativas -->
        <div class="view-tabs" role="tablist">
          <button class="view-tab active" data-view="production" role="tab" aria-selected="true">
            <i class="fas fa-industry"></i> Kanban de Produção (OPs)
          </button>
          <button class="view-tab" data-view="tasks" role="tab" aria-selected="false">
            <i class="fas fa-tasks"></i> Tarefas Operacionais / Suporte
          </button>
        </div>

        <!-- PAINEL: PRODUÇÃO (OPs) -->
        <div class="view-panel active" id="panel-production">
          <div class="stats-wrapper">
            <div class="kpi-grid" id="kanbanStats-production"></div>
            <button class="btn primary" onclick="openTaskModal('production')">
              <i class="fas fa-plus"></i> Nova OP
            </button>
          </div>

          <div class="filter-bar">
            <div class="search-box">
              <i class="fas fa-magnifying-glass"></i>
              <input type="search" id="searchInput-production" placeholder="Pesquisar OPs por produto, operador ou código..." />
            </div>
            <select class="filter-select" id="filterPriority-production">
              <option value="">Todas Prioridades</option>
              <option value="alta">Alta</option>
              <option value="media">Média</option>
              <option value="baixa">Baixa</option>
            </select>
            <select class="filter-select" id="filterResponsible-production">
              <option value="">Todos Operadores</option>
            </select>
            <select class="filter-select" id="filterCategory-production">
              <option value="">Todas Categorias</option>
              <option value="Estoque">Estoque</option>
              <option value="Transporte">Transporte</option>
              <option value="Compras">Compras</option>
              <option value="Financeiro">Financeiro</option>
              <option value="Logística">Logística</option>
            </select>
            <select class="filter-select" id="filterStatus-production">
              <option value="">Todos Status</option>
              <option value="todo">Planejamento</option>
              <option value="doing">Em Produção</option>
              <option value="review">Controle QA</option>
              <option value="done">Pronto / Expedição</option>
            </select>
            <button class="filter-clear" onclick="clearFilters('production')">
              <i class="fas fa-rotate-left"></i> Limpar
            </button>
          </div>

          <div class="kanban-board" id="kanbanBoard-production">
            <div class="kanban-column" data-status="todo" data-board="production">
              <div class="column-header">
                <span class="column-dot todo"></span>
                <span class="column-title">Planejamento</span>
                <span class="column-count" id="count-todo-production">0</span>
                <button class="column-add-btn" onclick="openTaskModal('production','todo')" aria-label="Adicionar OP"><i class="fas fa-plus"></i></button>
              </div>
              <div class="column-cards" id="col-todo-production" data-status="todo" data-board="production"></div>
            </div>

            <div class="kanban-column" data-status="doing" data-board="production">
              <div class="column-header">
                <span class="column-dot doing"></span>
                <span class="column-title">Em Produção</span>
                <span class="column-count" id="count-doing-production">0</span>
                <button class="column-add-btn" onclick="openTaskModal('production','doing')" aria-label="Adicionar OP"><i class="fas fa-plus"></i></button>
              </div>
              <div class="column-cards" id="col-doing-production" data-status="doing" data-board="production"></div>
            </div>

            <div class="kanban-column" data-status="review" data-board="production">
              <div class="column-header">
                <span class="column-dot review"></span>
                <span class="column-title">Controle QA</span>
                <span class="column-count" id="count-review-production">0</span>
                <button class="column-add-btn" onclick="openTaskModal('production','review')" aria-label="Adicionar OP"><i class="fas fa-plus"></i></button>
              </div>
              <div class="column-cards" id="col-review-production" data-status="review" data-board="production"></div>
            </div>

            <div class="kanban-column" data-status="done" data-board="production">
              <div class="column-header">
                <span class="column-dot done"></span>
                <span class="column-title">Pronto / Expedição</span>
                <span class="column-count" id="count-done-production">0</span>
                <button class="column-add-btn" onclick="openTaskModal('production','done')" aria-label="Adicionar OP"><i class="fas fa-plus"></i></button>
              </div>
              <div class="column-cards" id="col-done-production" data-status="done" data-board="production"></div>
            </div>
          </div>
        </div>

        <!-- PAINEL: TAREFAS OPERACIONAIS / SUPORTE -->
        <div class="view-panel" id="panel-tasks">
          <div class="stats-wrapper">
            <div class="kpi-grid" id="kanbanStats-tasks"></div>
            <button class="btn primary" onclick="openTaskModal('tasks')">
              <i class="fas fa-plus"></i> Nova Tarefa
            </button>
          </div>

          <div class="filter-bar">
            <div class="search-box">
              <i class="fas fa-magnifying-glass"></i>
              <input type="search" id="searchInput-tasks" placeholder="Pesquisar tarefas por título, responsável..." />
            </div>
            <select class="filter-select" id="filterPriority-tasks">
              <option value="">Todas Prioridades</option>
              <option value="alta">Alta</option>
              <option value="media">Média</option>
              <option value="baixa">Baixa</option>
            </select>
            <select class="filter-select" id="filterResponsible-tasks">
              <option value="">Todos Responsáveis</option>
            </select>
            <select class="filter-select" id="filterCategory-tasks">
              <option value="">Todas Categorias</option>
              <option value="Suporte">Suporte</option>
              <option value="TI">TI</option>
              <option value="Administrativo">Administrativo</option>
              <option value="RH">RH</option>
              <option value="Financeiro">Financeiro</option>
            </select>
            <select class="filter-select" id="filterStatus-tasks">
              <option value="">Todos Status</option>
              <option value="todo">A Fazer</option>
              <option value="doing">Em Andamento</option>
              <option value="review">Em Revisão</option>
              <option value="done">Concluído</option>
            </select>
            <button class="filter-clear" onclick="clearFilters('tasks')">
              <i class="fas fa-rotate-left"></i> Limpar
            </button>
          </div>

          <div class="kanban-board" id="kanbanBoard-tasks">
            <div class="kanban-column" data-status="todo" data-board="tasks">
              <div class="column-header">
                <span class="column-dot todo"></span>
                <span class="column-title">A Fazer</span>
                <span class="column-count" id="count-todo-tasks">0</span>
                <button class="column-add-btn" onclick="openTaskModal('tasks','todo')" aria-label="Adicionar tarefa"><i class="fas fa-plus"></i></button>
              </div>
              <div class="column-cards" id="col-todo-tasks" data-status="todo" data-board="tasks"></div>
            </div>

            <div class="kanban-column" data-status="doing" data-board="tasks">
              <div class="column-header">
                <span class="column-dot doing"></span>
                <span class="column-title">Em Andamento</span>
                <span class="column-count" id="count-doing-tasks">0</span>
                <button class="column-add-btn" onclick="openTaskModal('tasks','doing')" aria-label="Adicionar tarefa"><i class="fas fa-plus"></i></button>
              </div>
              <div class="column-cards" id="col-doing-tasks" data-status="doing" data-board="tasks"></div>
            </div>

            <div class="kanban-column" data-status="review" data-board="tasks">
              <div class="column-header">
                <span class="column-dot review"></span>
                <span class="column-title">Em Revisão</span>
                <span class="column-count" id="count-review-tasks">0</span>
                <button class="column-add-btn" onclick="openTaskModal('tasks','review')" aria-label="Adicionar tarefa"><i class="fas fa-plus"></i></button>
              </div>
              <div class="column-cards" id="col-review-tasks" data-status="review" data-board="tasks"></div>
            </div>

            <div class="kanban-column" data-status="done" data-board="tasks">
              <div class="column-header">
                <span class="column-dot done"></span>
                <span class="column-title">Concluído</span>
                <span class="column-count" id="count-done-tasks">0</span>
                <button class="column-add-btn" onclick="openTaskModal('tasks','done')" aria-label="Adicionar tarefa"><i class="fas fa-plus"></i></button>
              </div>
              <div class="column-cards" id="col-done-tasks" data-status="done" data-board="tasks"></div>
            </div>
          </div>
        </div>
      </main>

      <!-- RODAPÉ -->
      <div id="footer-root"></div>
    </div>

    <!-- ================== TASK MODAL ================== -->
    <div class="modal-overlay" id="taskModal">
      <div class="modal">
        <button class="modal-close" onclick="closeTaskModal()" aria-label="Fechar"><i class="fas fa-xmark"></i></button>
        <div class="modal-title"><i class="fas fa-table-columns"></i> <span id="modalTitle">Nova Ordem de Produção</span></div>
        <div class="modal-subtitle">Preencha os dados para registrar o card no quadro.</div>

        <form id="taskForm" onsubmit="event.preventDefault(); saveTask();">
          <input type="hidden" id="taskId" />
          <input type="hidden" id="taskBoard" />
          <div class="form-grid">
            <div class="form-group full">
              <label class="form-label" id="taskTitleLabel">Produto / Item <span class="req">*</span></label>
              <input class="form-input" type="text" id="taskTitle" placeholder="Ex: Flange Aço ABNT 1020 ø50mm" maxlength="120" />
              <div class="form-error" id="err-title">Informe o título do card.</div>
            </div>
            <div class="form-group full">
              <label class="form-label">Descrição / Observações</label>
              <textarea class="form-textarea" id="taskDesc" placeholder="Detalhes, roteiro, observações..."></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" id="taskResponsibleLabel">Operador Responsável <span class="req">*</span></label>
              <select class="form-select" id="taskResponsible"><option value="">Selecione...</option></select>
              <div class="form-error" id="err-responsible">Selecione um responsável.</div>
            </div>
            <div class="form-group">
              <label class="form-label">Prioridade <span class="req">*</span></label>
              <select class="form-select" id="taskPriority">
                <option value="alta">Alta</option>
                <option value="media" selected>Média</option>
                <option value="baixa">Baixa</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Categoria <span class="req">*</span></label>
              <select class="form-select" id="taskCategory"></select>
            </div>
            <div class="form-group">
              <label class="form-label">Data Limite</label>
              <input class="form-input" type="date" id="taskDueDate" />
            </div>
            <div class="form-group full">
              <label class="form-label">Status</label>
              <select class="form-select" id="taskStatus"></select>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn secondary" onclick="closeTaskModal()">Cancelar</button>
            <button type="submit" class="btn primary"><i class="fas fa-check"></i> <span id="modalSaveText">Salvar OP</span></button>
          </div>
        </form>
      </div>
    </div>

    <!-- ================== TOAST CONTAINER ================== -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="components/js/header.js"></script>
    <script src="components/js/sidebar.js"></script>
    <script src="components/js/chat.js"></script>
    <script src="components/js/config.js"></script>
    <script src="components/js/footer.js"></script>
    <script src="components/js/modoescuro.js"></script>
    <script src="JS/kanban.js" defer></script>
  </body>
</html>
