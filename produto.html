<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLog · Detalhes da Peça</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="components/css/sidebar.css" />
    <link rel="stylesheet" href="components/css/header.css" />
    <link rel="stylesheet" href="components/css/footer.css" />
    <link rel="stylesheet" href="components/css/modoescuro.css" />
    <link rel="stylesheet" href="components/css/responsive.css" />

    <style>
      :root {
        --bg-body: #edf3f8;
        --bg-card: #ffffff;
        --bg-soft: #f4f8fc;
        --border: #d4e2f0;

        --text-main: #0c1e2e;
        --text-secondary: #3b5a75;
        --text-muted: #718da8;

        --primary: #006bb3;
        --primary-dark: #004d80;
        --primary-light: #e3f0fb;

        --green: #15803d;
        --green-bg: #dcfce7;

        --amber: #b45309;
        --amber-bg: #fef3c7;

        --red: #b91c1c;
        --red-bg: #fee2e2;

        --blue: #0369a1;
        --blue-bg: #e0f2fe;

        --purple: #6b21a8;
        --purple-bg: #f3e8ff;

        --shadow: 0 8px 24px rgba(12, 30, 46, 0.08);
        --radius: 14px;
      }

      body.dark {
        --bg-body: #0a131d;
        --bg-card: #111f2e;
        --bg-soft: #16283b;
        --border: #1e364f;

        --text-main: #e2edf8;
        --text-secondary: #9cb5cd;
        --text-muted: #6482a0;

        --primary: #38bdf8;
        --primary-light: #17324d;

        --green: #4ade80;
        --green-bg: #143823;

        --amber: #fbbf24;
        --amber-bg: #3d2d11;

        --red: #f87171;
        --red-bg: #3e1919;

        --blue: #38bdf8;
        --blue-bg: #123147;

        --purple: #c084fc;
        --purple-bg: #321d47;

        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        min-height: 100vh;
        transition: background-color 0.3s, color 0.3s;
      }

      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-width: 0;
      }

      .dashboard-container {
        max-width: 100%;
        width: 100%;
        margin: 0;
        padding: 24px 28px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        flex: 1;
      }

      /* Page header */
      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 4px;
        flex-wrap: wrap;
      }
      .breadcrumb a {
        color: var(--text-secondary);
        font-weight: 600;
        transition: 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .breadcrumb a:hover { color: var(--primary); }
      .breadcrumb i.fa-chevron-right { font-size: 9px; }
      .breadcrumb .current { color: var(--text-main); font-weight: 700; }

      .page-title {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .page-title h1 {
        font-size: clamp(20px, 1.2vw + 16px, 26px);
        font-weight: 700;
      }
      .code-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        font-family: ui-monospace, "SF Mono", monospace;
        font-size: 12.5px;
        font-weight: 700;
        padding: 5px 12px;
        border-radius: 20px;
      }
      .code-pill i { color: var(--primary); font-size: 11px; }

      .page-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: 0.2s;
        border: 1px solid transparent;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover { background: var(--primary-dark); }
      .btn-outline {
        background: var(--bg-soft);
        color: var(--text-secondary);
        border-color: var(--border);
      }
      .btn-outline:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: var(--primary-light);
      }

      /* Hero */
      .hero-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 1.2fr;
      }
      @media (max-width: 900px) {
        .hero-card { grid-template-columns: 1fr; }
      }

      .hero-image {
        background:
          linear-gradient(135deg, var(--bg-soft) 0%, var(--primary-light) 100%);
        min-height: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        position: relative;
      }
      .hero-image svg {
        max-width: 100%;
        max-height: 240px;
        filter: drop-shadow(0 6px 12px rgba(12, 30, 46, 0.18));
      }
      .hero-tag {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(255,255,255,0.85);
        border: 1px solid var(--border);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        backdrop-filter: blur(6px);
      }
      .hero-tag i { color: var(--primary); }

      .hero-info {
        padding: 32px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
      }
      .hero-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .category-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        background: var(--purple-bg);
        color: var(--purple);
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
      }
      .status-pill .dot {
        width: 7px; height: 7px; border-radius: 50%;
      }
      .status-producao { background: var(--blue-bg); color: var(--blue); }
      .status-producao .dot { background: var(--blue); }
      .status-concluido { background: var(--green-bg); color: var(--green); }
      .status-concluido .dot { background: var(--green); }
      .status-pendente { background: var(--amber-bg); color: var(--amber); }
      .status-pendente .dot { background: var(--amber); }
      .status-critico  { background: var(--red-bg); color: var(--red); }
      .status-critico  .dot { background: var(--red); }

      .hero-title {
        font-size: clamp(22px, 1.6vw + 14px, 32px);
        font-weight: 800;
        line-height: 1.2;
        color: var(--text-main);
      }
      .hero-desc {
        font-size: 14px;
        color: var(--text-secondary);
        line-height: 1.6;
      }
      .hero-codigo {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        padding: 8px 14px;
        border-radius: 10px;
        align-self: flex-start;
        font-family: ui-monospace, "SF Mono", monospace;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-main);
      }
      .hero-codigo i { color: var(--primary); }

      /* KPI grid */
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
      @media (max-width: 1100px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 480px)  { .kpi-grid { grid-template-columns: 1fr; } }

      .kpi-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px 20px;
        box-shadow: var(--shadow);
        transition: 0.25s;
        position: relative;
        overflow: hidden;
      }
      .kpi-card::after {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--primary), var(--primary-dark));
        opacity: 0.5;
      }
      .kpi-card:hover { transform: translateY(-2px); }
      .kpi-label {
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .kpi-icon {
        width: 30px; height: 30px;
        border-radius: 8px;
        background: var(--primary-light);
        color: var(--primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
      }
      .kpi-icon.green  { background: var(--green-bg);  color: var(--green); }
      .kpi-icon.amber  { background: var(--amber-bg);  color: var(--amber); }
      .kpi-icon.purple { background: var(--purple-bg); color: var(--purple); }
      .kpi-icon.blue   { background: var(--blue-bg);   color: var(--blue); }
      .kpi-value {
        font-size: clamp(18px, 1vw + 14px, 22px);
        font-weight: 700;
        color: var(--text-main);
        line-height: 1.15;
      }
      .kpi-sub {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 6px;
      }

      /* Cards genéricos */
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 22px 24px;
        box-shadow: var(--shadow);
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .card-header h2 {
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .card-header h2 i { color: var(--primary); }
      .badge-soft {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 20px;
      }

      /* Estoque */
      .estoque-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 20px;
        align-items: end;
        margin-bottom: 18px;
      }
      @media (max-width: 600px) { .estoque-row { grid-template-columns: 1fr; } }

      .estoque-atual-label {
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.4px;
      }
      .estoque-atual-num {
        font-size: clamp(30px, 2.2vw + 16px, 44px);
        font-weight: 800;
        color: var(--text-main);
        line-height: 1;
        margin-top: 6px;
      }
      .estoque-atual-num small {
        font-size: 0.5em;
        color: var(--text-muted);
        font-weight: 600;
        margin-left: 4px;
      }

      .estoque-pct {
        text-align: right;
      }
      .estoque-pct .num {
        font-size: 28px;
        font-weight: 800;
        color: var(--text-main);
        line-height: 1;
      }
      .estoque-pct .lbl {
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-top: 4px;
      }

      .progress-shell {
        position: relative;
        height: 10px;
        background: var(--bg-soft);
        border-radius: 6px;
        overflow: hidden;
        margin-top: 6px;
      }
      .progress-fill {
        height: 100%;
        border-radius: 6px;
        background: var(--primary);
        width: 0;
        transition: width 0.9s ease;
      }
      .progress-fill.green  { background: var(--green); }
      .progress-fill.amber  { background: var(--amber); }
      .progress-fill.red    { background: var(--red); }
      .progress-marker {
        position: absolute;
        top: -3px;
        bottom: -3px;
        width: 2px;
        background: var(--text-muted);
        opacity: 0.6;
      }
      .progress-legend {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        font-size: 11.5px;
        color: var(--text-muted);
        font-weight: 600;
      }
      .progress-legend .min { color: var(--amber); }

      .estoque-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }
      @media (max-width: 600px) { .estoque-grid { grid-template-columns: 1fr; } }

      .estoque-info {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .estoque-info .ic {
        width: 36px; height: 36px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 14px;
      }
      .estoque-info .ic.blue   { background: var(--blue-bg);  color: var(--blue); }
      .estoque-info .ic.amber  { background: var(--amber-bg); color: var(--amber); }
      .estoque-info .ic.red    { background: var(--red-bg);   color: var(--red); }
      .estoque-info .lbl {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.4px;
      }
      .estoque-info .val {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-main);
        margin-top: 3px;
      }
      .estoque-info .sub {
        font-size: 11.5px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      /* Tabela */
      .table-wrapper { overflow-x: auto; }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
        min-width: 640px;
      }
      th {
        text-align: left;
        padding: 10px 12px;
        font-weight: 700;
        color: var(--text-muted);
        border-bottom: 2px solid var(--border);
        font-size: 11px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        white-space: nowrap;
      }
      td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        color: var(--text-main);
        vertical-align: middle;
      }
      tbody tr:hover { background: var(--bg-soft); }
      tbody tr:last-child td { border-bottom: 0; }

      .event-cell {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .event-cell .ev-icon {
        width: 32px; height: 32px;
        border-radius: 8px;
        background: var(--primary-light);
        color: var(--primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        flex-shrink: 0;
      }
      .event-cell .ev-text {
        font-weight: 600;
        color: var(--text-main);
      }
      .op-cell {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .op-cell .avatar {
        width: 28px; height: 28px;
        border-radius: 50%;
        background: var(--primary);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
      }
      .action-btn {
        width: 30px; height: 30px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        border: 1px solid var(--border);
        background: var(--bg-soft);
        cursor: pointer;
        transition: 0.15s;
        font-size: 13px;
      }
      .action-btn:hover {
        color: var(--primary);
        border-color: var(--primary);
        background: var(--primary-light);
      }

      /* Empty / not found */
      .not-found {
        text-align: center;
        padding: 48px 16px;
        color: var(--text-muted);
      }
      .not-found i { font-size: 48px; color: var(--amber); margin-bottom: 12px; }
      .not-found h2 {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 8px;
      }
      .not-found p { font-size: 14px; margin-bottom: 18px; }

      @media (max-width: 768px) {
        .dashboard-container { padding: 14px; gap: 16px; }
        .hero-info { padding: 20px; }
        .hero-image { min-height: 220px; padding: 24px; }
        .card { padding: 18px; }
      }
    </style>
  </head>
  <body>
    <div id="sidebar-root"></div>

    <div class="main-wrapper">
      <div id="header-root"></div>

      <div class="dashboard-container">
        <!-- Page header -->
        <div class="page-header">
          <div>
            <div class="breadcrumb">
              <a href="qr.html"><i class="fas fa-qrcode"></i> Leitor QR</a>
              <i class="fas fa-chevron-right"></i>
              <a href="itens.html">Itens em Estoque</a>
              <i class="fas fa-chevron-right"></i>
              <span class="current" id="bcName">—</span>
            </div>
            <div class="page-title">
              <h1>Detalhes da Peça</h1>
              <span class="code-pill" id="codePill">
                <i class="fas fa-qrcode"></i> <span id="codeText">—</span>
              </span>
            </div>
          </div>
          <div class="page-actions">
            <a href="qr.html" class="btn btn-outline">
              <i class="fas fa-qrcode"></i> Ler outro QR
            </a>
            <button class="btn btn-primary" onclick="window.print()">
              <i class="fas fa-print"></i> Imprimir etiqueta
            </button>
          </div>
        </div>

        <!-- Conteúdo dinâmico -->
        <div id="conteudo"></div>
      </div>

      <div id="footer-root"></div>
    </div>

    <script>

      // ============================================================
      // LER CÓDIGO DA URL
      // ============================================================
      function getCodigo() {
        const params = new URLSearchParams(window.location.search);
        return (params.get("codigo") || "").trim().toUpperCase();
      }

      // ============================================================
      // RENDERIZAR CONTEÚDO
      // ============================================================
      function render() {
        const code = getCodigo();
        const container = document.getElementById("conteudo");

        // Header pills sempre atualizam
        document.getElementById("codeText").textContent = code || "—";
        document.getElementById("bcName").textContent = code || "Sem código";

        if (!code || !PECAS[code]) {
          container.innerHTML = `
            <div class="card">
              <div class="not-found">
                <i class="fas fa-triangle-exclamation"></i>
                <h2>Código não encontrado</h2>
                <p>O código <strong>${code || "(vazio)"}</strong> não corresponde a nenhuma peça cadastrada.</p>
                <a href="qr.html" class="btn btn-primary">
                  <i class="fas fa-qrcode"></i> Voltar ao leitor de QR
                </a>
              </div>
            </div>
          `;
          return;
        }

        const p = PECAS[code];
        document.getElementById("bcName").textContent = p.nome;
        document.title = `StockLog · ${p.nome}`;

        container.innerHTML = `
          <!-- HERO -->
          <section class="hero-card">
            <div class="hero-image">
              <span class="hero-tag"><i class="fas fa-image"></i> Foto do Produto</span>
              ${IMG[p.imagem] || IMG.eixo}
            </div>
            <div class="hero-info">
              <div class="hero-meta">
                <span class="category-pill">
                  <i class="fas fa-tag"></i> ${p.categoria}
                </span>
                <span class="status-pill status-${p.status}">
                  <span class="dot"></span> ${p.statusLabel}
                </span>
              </div>
              <h1 class="hero-title">${p.nome}</h1>
              <p class="hero-desc">${p.descricao}</p>
              <div class="hero-codigo">
                <i class="fas fa-qrcode"></i> ${code}
              </div>
            </div>
          </section>

          <!-- KPIs -->
          <section class="kpi-grid">
            ${p.kpis.map(k => `
              <div class="kpi-card">
                <div class="kpi-label">
                  <span class="kpi-icon ${k.cor}"><i class="fas ${k.icone}"></i></span>
                  ${k.label}
                </div>
                <div class="kpi-value">${k.valor}</div>
              </div>
            `).join("")}
          </section>

          <!-- ESTOQUE -->
          <section class="card">
            <div class="card-header">
              <h2><i class="fas fa-warehouse"></i> Nível de Estoque</h2>
              <span class="badge-soft">${Math.round(p.estoque.atual / p.estoque.max * 100)}% da capacidade</span>
            </div>

            ${(() => {
              const pct = Math.min(100, Math.round((p.estoque.atual / p.estoque.max) * 100));
              const minPct = Math.round((p.estoque.min / p.estoque.max) * 100);
              let corBar = "green";
              if (p.estoque.atual < p.estoque.min) corBar = "red";
              else if (p.estoque.atual < p.estoque.min * 1.5) corBar = "amber";
              return `
                <div class="estoque-row">
                  <div>
                    <div class="estoque-atual-label">Estoque Atual</div>
                    <div class="estoque-atual-num">${p.estoque.atual}<small>un.</small></div>
                  </div>
                  <div class="estoque-pct">
                    <div class="num">${pct}%</div>
                    <div class="lbl">Ocupação</div>
                  </div>
                </div>

                <div class="progress-shell">
                  <div class="progress-fill ${corBar}" id="stockBar" style="width:0%"></div>
                  <div class="progress-marker" style="left:${minPct}%"></div>
                </div>
                <div class="progress-legend">
                  <span>0</span>
                  <span class="min">Mínimo: ${p.estoque.min}</span>
                  <span>Máx: ${p.estoque.max}</span>
                </div>

                <div class="estoque-grid">
                  <div class="estoque-info">
                    <span class="ic blue"><i class="fas fa-location-dot"></i></span>
                    <div>
                      <div class="lbl">Localização</div>
                      <div class="val">${p.estoque.local}</div>
                      <div class="sub">${p.estoque.complemento}</div>
                    </div>
                  </div>
                  <div class="estoque-info">
                    <span class="ic amber"><i class="fas fa-battery-quarter"></i></span>
                    <div>
                      <div class="lbl">Estoque Mínimo</div>
                      <div class="val">${p.estoque.min} un.</div>
                      <div class="sub">Ponto de reposição</div>
                    </div>
                  </div>
                  <div class="estoque-info">
                    <span class="ic red"><i class="fas fa-battery-full"></i></span>
                    <div>
                      <div class="lbl">Estoque Máximo</div>
                      <div class="val">${p.estoque.max} un.</div>
                      <div class="sub">Capacidade total</div>
                    </div>
                  </div>
                </div>
              `;
            })()}
          </section>

          <!-- HISTÓRICO -->
          <section class="card">
            <div class="card-header">
              <h2><i class="fas fa-route"></i> Histórico de Rastreabilidade</h2>
              <span class="badge-soft">${p.historico.length} eventos</span>
            </div>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Evento</th>
                    <th>Data / Hora</th>
                    <th>Operador</th>
                    <th>Status</th>
                    <th>Ação</th>
                  </tr>
                </thead>
                <tbody>
                  ${p.historico.map(h => `
                    <tr>
                      <td>
                        <div class="event-cell">
                          <span class="ev-icon"><i class="fas fa-clock-rotate-left"></i></span>
                          <span class="ev-text">${h.evento}</span>
                        </div>
                      </td>
                      <td>${h.data}</td>
                      <td>
                        <div class="op-cell">
                          <span class="avatar">${h.ini}</span>
                          ${h.op}
                        </div>
                      </td>
                      <td>
                        <span class="status-pill status-${h.status}">
                          <span class="dot"></span> ${h.statusLabel}
                        </span>
                      </td>
                      <td>
                        <button class="action-btn" title="Ver detalhes">
                          <i class="fas fa-eye"></i>
                        </button>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </section>
        `;

        // Animar a barra de estoque
        const bar = document.getElementById("stockBar");
        if (bar) {
          const pct = Math.min(100, Math.round((p.estoque.atual / p.estoque.max) * 100));
          setTimeout(() => { bar.style.width = pct + "%"; }, 250);
        }
      }

      render();
    </script>
