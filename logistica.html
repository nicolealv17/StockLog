<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLog · Logística</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="components/css/sidebar.css" />
    <link rel="stylesheet" href="components/css/header.css" />
    <link rel="stylesheet" href="components/css/footer.css" />
    <link rel="stylesheet" href="components/css/modoescuro.css" />
    <link rel="stylesheet" href="components/css/responsive.css" />
    <style>
      /* ================================================================
         TOKENS / VARIÁVEIS
         ================================================================ */
      :root {
        --bg-body: #f0f5fc;
        --bg-card: #ffffff;
        --bg-soft: #f5faff;
        --border: #e2ecf6;
        --border-hover: #c6daea;

        --primary: #006bb3;
        --primary-dark: #004d80;
        --primary-light: #e1eefb;
        --primary-gradient: linear-gradient(135deg, #0077be 0%, #005a8c 100%);

        --text-main: #0a1f33;
        --text-secondary: #3d5f7e;
        --text-muted: #7b92b2;

        --shadow-card: 0 1px 2px rgba(0, 40, 80, 0.04), 0 4px 12px rgba(0, 40, 80, 0.04);
        --shadow-hover: 0 4px 8px rgba(0, 40, 80, 0.06), 0 12px 28px rgba(0, 40, 80, 0.08);
        --shadow-lift: 0 8px 20px rgba(0, 40, 80, 0.10), 0 20px 40px rgba(0, 40, 80, 0.06);

        --amber: #c47a1f;
        --amber-bg: #faecd6;
        --blue: #2f6fdb;
        --blue-bg: #e1ecfb;
        --brown: #8b5a2b;
        --brown-bg: #f1e3d2;
        --teal: #1a7b72;
        --teal-bg: #e0f2ea;
        --rose: #b2433a;
        --rose-bg: #fae2e0;
      }

      body.dark {
        --bg-body: #0d1727;
        --bg-card: #14243e;
        --bg-soft: #0f1f30;
        --border: #1d344b;
        --border-hover: #2a4866;

        --text-main: #e2edf8;
        --text-secondary: #a5bed6;
        --text-muted: #6f8daa;

        --primary-light: #1d3a55;
        --amber-bg: #3a2f15;
        --blue-bg: #1c2c4a;
        --brown-bg: #2f2418;
        --teal-bg: #123a2a;
        --rose-bg: #3a1f1f;

        --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
        --shadow-hover: 0 4px 8px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.25);
        --shadow-lift: 0 8px 20px rgba(0,0,0,.4), 0 20px 40px rgba(0,0,0,.3);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-body);
        color: var(--text-main);
        display: flex;
        min-height: 100vh;
        transition: background 0.3s, color 0.3s;
        -webkit-font-smoothing: antialiased;
      }
      a { text-decoration: none; color: inherit; }
      button { cursor: pointer; font-family: inherit; border: none; background: none; }
      input, select, textarea { font-family: inherit; color: var(--text-main); }

      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-width: 0;
      }
      .content {
        flex: 1;
        padding: 28px 32px 20px;
        min-width: 0;
      }

      /* ============ HEADER DA PÁGINA ============ */
      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 22px;
        gap: 16px;
        flex-wrap: wrap;
      }
      .page-head h1 {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 12px;
        letter-spacing: -0.01em;
      }
      .page-head h1 i {
        width: 38px; height: 38px;
        border-radius: 10px;
        background: var(--primary-light);
        color: var(--primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }
      .page-head p {
        color: var(--text-secondary);
        font-size: 13.5px;
        margin-top: 4px;
        margin-left: 50px;
      }

      /* ============ BOTÕES GERAIS ============ */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 600;
        border: 1px solid transparent;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
      }
      .btn i { font-size: 13px; transition: transform 0.2s ease; }
      .btn.btn-primary {
        background: var(--primary-gradient);
        color: #fff;
        box-shadow: 0 4px 12px rgba(0, 102, 179, 0.25);
      }
      .btn.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0, 102, 179, 0.35); }
      .btn.btn-primary:hover i { transform: rotate(90deg); }
      .btn.btn-secondary { background: var(--bg-card); color: var(--text-main); border-color: var(--border); }
      .btn.btn-secondary:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
      .btn.btn-danger { background: var(--rose-bg); color: var(--rose); border-color: var(--rose); }
      .btn.btn-danger:hover { background: var(--rose); color: #fff; }
      .btn.btn-sm { padding: 6px 11px; font-size: 12px; }
      .btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }

      /* ============ STATS / INDICADORES ============ */
      .log-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 20px; }
      .log-stat {
        background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
        padding: 18px 20px; box-shadow: var(--shadow-card);
        display: flex; align-items: center; gap: 14px; transition: all 0.25s ease;
        position: relative; overflow: hidden;
      }
      .log-stat::after {
        content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
        background: var(--accent, var(--primary)); opacity: 0; transition: opacity 0.25s ease;
      }
      .log-stat:hover { border-color: var(--border-hover); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
      .log-stat:hover::after { opacity: 1; }
      .log-stat-icon {
        width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center;
        justify-content: center; font-size: 19px; flex-shrink: 0;
      }
      .log-stat-body { flex: 1; min-width: 0; }
      .log-stat-num { font-size: 24px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
      .log-stat-label { font-size: 11.5px; color: var(--text-muted); font-weight: 600; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.03em; }
      .log-stat-trend { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; margin-top: 4px; padding: 1px 6px; border-radius: 10px; }
      .log-stat-trend.up { color: var(--teal); background: var(--teal-bg); }
      .log-stat-trend.down { color: var(--rose); background: var(--rose-bg); }

      /* ============ TOOLBAR / ÁREA DE AÇÕES ============ */
      .log-toolbar {
        display: flex; justify-content: space-between; align-items: center; gap: 16px;
        flex-wrap: wrap; margin-bottom: 20px; background: var(--bg-card);
        border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow-card);
      }
      .log-toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1; }
      .log-toolbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

      .log-search-wrap { position: relative; display: flex; align-items: center; flex: 1; min-width: 240px; max-width: 360px; }
      .log-search-wrap i { position: absolute; left: 14px; color: var(--text-muted); font-size: 13px; pointer-events: none; transition: color 0.2s ease; }
      .log-search {
        font-size: 13.5px; padding: 10px 14px 10px 38px; border: 1px solid var(--border);
        border-radius: 10px; background: var(--bg-soft); color: var(--text-main); width: 100%; outline: none; transition: all 0.2s ease;
      }
      .log-search::placeholder { color: var(--text-muted); }
      .log-search:focus { border-color: var(--primary); background: var(--bg-card); box-shadow: 0 0 0 3px var(--primary-light); }
      .log-search:focus + i, .log-search-wrap:focus-within i { color: var(--primary); }

      .toolbar-info { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); padding: 8px 12px; border-radius: 8px; background: var(--bg-soft); border: 1px dashed var(--border); }
      .toolbar-info i { color: var(--primary); }
      .toolbar-info strong { color: var(--text-main); font-weight: 600; }

      /* ============ KANBAN DE EXPEDIÇÃO ============ */
      .log-section-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; flex-wrap: wrap; gap: 8px; }
      .log-section-head .title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
      .log-section-head .title i { width: 32px; height: 32px; border-radius: 8px; background: var(--primary-light); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }

      .log-kanban { display: grid; grid-template-columns: repeat(5, minmax(230px, 1fr)); gap: 14px; margin-bottom: 28px; }
      .log-col { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 14px; padding: 0; min-height: 240px; display: flex; flex-direction: column; overflow: hidden; transition: border-color 0.2s ease; }
      
      .log-col-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 12px; background: var(--bg-card); border-bottom: 1px solid var(--border); border-top: 3px solid var(--accent, var(--primary)); }
      .log-col-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
      .log-col-title i { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; background: var(--accent-bg, var(--primary-light)); color: var(--accent, var(--primary)); }
      .log-col-count { background: var(--bg-soft); border: 1px solid var(--border); color: var(--text-secondary); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; min-width: 24px; text-align: center; }
      .log-col-body { display: flex; flex-direction: column; gap: 10px; flex: 1; padding: 12px; }
      .log-col-empty { text-align: center; color: var(--text-muted); font-size: 11.5px; font-style: italic; padding: 26px 6px; opacity: 0.7; }

      /* ============ CARDS DOS PEDIDOS ============ */
      .log-card {
        background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
        box-shadow: var(--shadow-card); cursor: pointer; transition: all 0.2s ease; position: relative;
      }
      .log-card:hover { border-color: var(--primary); box-shadow: var(--shadow-lift); transform: translateY(-2px); }
      .log-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
      .log-card-num { font-size: 15px; font-weight: 700; color: var(--primary); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
      .log-card-num small { display: block; font-size: 9.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 1px; }
      
      .log-badge-urgente {
        font-size: 9.5px; font-weight: 700; text-transform: uppercase; color: var(--rose);
        background: var(--rose-bg); padding: 3px 8px; border-radius: 20px; letter-spacing: 0.05em;
        display: inline-flex; align-items: center; gap: 4px; position: relative;
      }
      .log-badge-urgente::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--rose); animation: pulseDot 1.6s ease-in-out infinite; }
      @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.7); } }

      .log-card-cliente { font-size: 13.5px; font-weight: 600; margin-bottom: 10px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
      .log-card-info { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-bottom: 12px; font-size: 11.5px; }
      .log-card-info .item { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
      .log-card-info .item i { color: var(--text-muted); font-size: 10.5px; width: 12px; text-align: center; }
      .log-card-info .item strong { color: var(--text-main); font-weight: 600; font-variant-numeric: tabular-nums; }

      .log-card-driver { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg-soft); border-radius: 8px; margin-bottom: 10px; font-size: 11.5px; color: var(--text-secondary); }
      .log-card-driver .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
      .log-card-driver .info { flex: 1; min-width: 0; line-height: 1.3; }
      .log-card-driver .info strong { display: block; color: var(--text-main); font-weight: 600; font-size: 12px; }
      .log-card-driver .info span { font-size: 10.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

      .log-card-foot { display: flex; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border); }
      .log-card-foot .btn { flex: 1; justify-content: center; }

      /* ============ VEÍCULOS E MOTORISTAS ============ */
      .card { background: var(--bg-card); border-radius: 14px; padding: 22px; border: 1px solid var(--border); box-shadow: var(--shadow-card); }
      .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
      .card-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
      .card-title i { width: 32px; height: 32px; border-radius: 8px; background: var(--primary-light); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
      .card-subtitle { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; margin-left: 42px; }
      .card-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      
      .util-info { font-size: 12px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 20px; }
      .util-info strong { color: var(--text-main); font-weight: 700; }

      .log-vehicles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
      .log-vehicle-card {
        border: 1px solid var(--border); background: var(--bg-card); border-radius: 12px; padding: 16px;
        cursor: pointer; transition: all 0.2s ease; position: relative; overflow: hidden;
      }
      .log-vehicle-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--status-color, var(--primary)); transition: width 0.2s ease; }
      .log-vehicle-card:hover { border-color: var(--primary); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
      .log-vehicle-card:hover::before { width: 6px; }

      .log-vehicle-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
      .log-vehicle-icon { width: 44px; height: 44px; border-radius: 10px; background: var(--bg-soft); color: var(--status-color, var(--primary)); display: inline-flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
      .log-vehicle-plate { font-size: 14.5px; font-weight: 700; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
      .log-vehicle-plate small { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); margin-top: 2px; letter-spacing: 0; }

      .log-status-pill { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 4px 9px; border-radius: 20px; letter-spacing: 0.04em; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
      .log-status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulseDot 2s ease-in-out infinite; }
      .status-disponivel { background: var(--teal-bg); color: var(--teal); }
      .status-em_rota { background: var(--blue-bg); color: var(--blue); }
      .status-manutencao { background: var(--amber-bg); color: var(--amber); }

      .log-vehicle-driver { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
      .log-vehicle-driver .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
      .log-vehicle-driver .info { flex: 1; min-width: 0; line-height: 1.3; }
      .log-vehicle-driver .info strong { display: block; font-weight: 600; font-size: 12.5px; }
      .log-vehicle-driver .info span { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

      .util-bar { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--text-muted); }
      .util-bar .bar { flex: 1; height: 5px; background: var(--bg-soft); border-radius: 3px; overflow: hidden; position: relative; }
      .util-bar .fill { position: absolute; inset: 0; width: var(--w, 0%); background: var(--status-color, var(--primary)); border-radius: 3px; transition: width 0.4s ease; }
      .util-bar strong { color: var(--text-main); font-weight: 700; font-variant-numeric: tabular-nums; }

      /* ============ GRID INFERIOR ============ */
      .bottom-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-top: 8px; }
      @media (max-width: 1100px) { .bottom-grid { grid-template-columns: 1fr; } }

      .activity-list { display: flex; flex-direction: column; gap: 4px; }
      .activity-item { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 8px; transition: background 0.2s ease; }
      .activity-item:hover { background: var(--bg-soft); }
      .activity-icon { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
      .activity-item .text { flex: 1; min-width: 0; line-height: 1.3; }
      .activity-item .text strong { display: block; font-weight: 600; font-size: 12.5px; }
      .activity-item .text span { font-size: 11.5px; color: var(--text-muted); }
      .activity-item .hora { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

      /* ============ MODAL ============ */
      .modal-overlay { position: fixed; inset: 0; background: rgba(10, 20, 35, 0.55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
      .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lift); animation: slideUp 0.25s ease; }
      @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
      .modal-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; }
      .modal-body { padding: 22px 24px; }
      .modal-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

      /* ============ FORMULÁRIO ============ */
      .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
      .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
      .form-row.cols-3 { grid-template-columns: repeat(3, 1fr); }
      .form-group label { font-size: 11.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
      .form-input, .form-textarea, .form-select { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; outline: none; width: 100%; transition: 0.2s; color: var(--text-main); }
      .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--primary); background: var(--bg-card); box-shadow: 0 0 0 3px var(--primary-light); }
      .form-textarea { resize: vertical; min-height: 70px; font-family: inherit; }
      .form-select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237b92b2' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 10px center; background-size: 14px; padding-right: 32px; }

      /* ============ TOAST ============ */
      .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
      .toast { background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--primary); border-radius: 10px; padding: 12px 16px; box-shadow: var(--shadow-hover); display: flex; align-items: center; gap: 10px; min-width: 240px; max-width: 360px; pointer-events: auto; color: var(--text-main); font-size: 13.5px; font-weight: 500; animation: slideInRight 0.3s ease; }
      .toast.success { border-left-color: var(--teal); }
      .toast.error { border-left-color: var(--rose); }
      .toast.warning { border-left-color: var(--amber); }
      .toast i { font-size: 16px; }
      .toast.success i { color: var(--teal); }
      .toast.error i { color: var(--rose); }
      .toast.warning i { color: var(--amber); }
      .toast.info i { color: var(--primary); }
      @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

      /* ============ RESPONSIVIDADE ============ */
      @media (max-width: 1300px) {
        .log-stats { grid-template-columns: repeat(3, 1fr); }
        .log-kanban { grid-template-columns: repeat(3, minmax(230px, 1fr)); }
      }
      @media (max-width: 900px) {
        .log-stats { grid-template-columns: repeat(2, 1fr); }
        .log-kanban { grid-template-columns: repeat(2, minmax(230px, 1fr)); }
      }
      @media (max-width: 768px) {
        .content { padding: 18px 16px; }
        .log-toolbar { flex-direction: column; align-items: stretch; }
        .log-toolbar-left, .log-toolbar-right { justify-content: center; }
        .log-search { width: 100%; }
        .log-stats { grid-template-columns: repeat(2, 1fr); }
        .log-kanban { grid-template-columns: minmax(230px, 1fr); }
        .form-row, .form-row.cols-3 { grid-template-columns: 1fr; }
        .page-head h1 { font-size: 20px; }
        .page-head h1 i { width: 34px; height: 34px; font-size: 14px; }
        .page-head p { margin-left: 46px; }
      }
    </style>
  </head>
  <body>
    <!-- SIDEBAR -->
    <div id="sidebar-root"></div>

    <div class="main-wrapper">
      <!-- HEADER -->
      <div id="header-root"></div>

      <main class="content" role="main">
        <!-- Estatísticas / Indicadores -->
        <div class="log-stats" id="log-stats"></div>

        <!-- Barra de ações -->
        <div class="log-toolbar">
          <div class="log-toolbar-left">
            <button class="btn btn-primary" onclick="logOpenNewOrder()">
              <i class="fa-solid fa-plus"></i> Novo pedido de expedição
            </button>
            <div class="log-search-wrap">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" class="log-search" id="log-search" placeholder="Buscar por cliente ou nº do pedido..." oninput="logRender()">
            </div>
            <span class="toolbar-info" id="toolbarInfo">
              <i class="fa-solid fa-circle-info"></i>
              <span><strong id="toolbarCount">0</strong> pedidos visíveis</span>
            </span>
          </div>
          <div class="log-toolbar-right">
            <button class="btn btn-secondary" onclick="logOpenNewVehicle()">
              <i class="fa-solid fa-truck"></i> Novo veículo
            </button>
          </div>
        </div>

        <!-- Kanban de expedição -->
        <div class="log-section-head">
          <div class="title">
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
            Fluxo de expedição
          </div>
        </div>
        <div class="log-kanban" id="log-kanban"></div>

        <!-- Grid inferior: Frota + Atividade recente -->
        <div class="bottom-grid">
          <!-- Veículos e motoristas -->
          <section class="card">
            <div class="card-header">
              <div>
                <div class="card-title">
                  <i class="fa-solid fa-truck-fast"></i>
                  Frota & Motoristas
                </div>
              </div>
              <div class="card-actions">
                <span class="util-info">
                  <i class="fa-solid fa-chart-simple" style="color:var(--primary)"></i>
                  <span>Utilização da frota: <strong id="utilFrota">0%</strong></span>
                </span>
              </div>
            </div>
            <div class="log-vehicles-grid" id="log-vehicles-grid"></div>
          </section>

          <!-- Atividade recente -->
          <section class="card">
            <div class="card-header">
              <div>
                <div class="card-title">
                  <i class="fa-solid fa-bolt"></i>
                  Atividade recente
                </div>
                <div class="card-subtitle">Últimas movimentações</div>
              </div>
            </div>
            <div class="activity-list" id="log-activity"></div>
          </section>
        </div>
      </main>

      <!-- FOOTER -->
      <div id="footer-root"></div>
    </div>

    <!-- MODAL: NOVO / EDITAR PEDIDO DE EXPEDIÇÃO -->
    <div class="modal-overlay" id="modal-logPedido">
      <div class="modal">
        <div class="modal-head">
          <span class="modal-title" id="log-modal-title">
            <i class="fa-solid fa-box" style="color:var(--primary);margin-right:8px"></i>
            Novo pedido de expedição
          </span>
          <button class="btn btn-icon" onclick="closeModal('logPedido')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="log-ord-id">

          <div class="form-row">
            <div class="form-group">
              <label>Nº do pedido <span style="color:var(--rose)">*</span></label>
              <input type="text" class="form-input" id="log-ord-numero" placeholder="Ex: 1050">
            </div>
            <div class="form-group">
              <label>Prioridade</label>
              <select class="form-select" id="log-ord-prioridade">
                <option value="normal" selected>Normal</option>
                <option value="urgente">Urgente</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Cliente / Destino <span style="color:var(--rose)">*</span></label>
            <input type="text" class="form-input" id="log-ord-cliente" placeholder="Ex: Supermercado Boa Vista">
          </div>

          <div class="form-group">
            <label>Endereço de entrega</label>
            <input type="text" class="form-input" id="log-ord-endereco" placeholder="Rua, número, bairro, cidade">
          </div>

          <div class="form-row cols-3">
            <div class="form-group">
              <label>Qtd. de itens</label>
              <input type="number" min="0" class="form-input" id="log-ord-itens" placeholder="0">
            </div>
            <div class="form-group">
              <label>Peso (kg) <i class="fa-solid fa-weight-hanging" style="font-size:10px; color:var(--text-muted)"></i></label>
              <input type="number" min="0" step="0.1" class="form-input" id="log-ord-peso" placeholder="0.0">
            </div>
            <div class="form-group">
              <label>Volume (m³) <i class="fa-solid fa-cube" style="font-size:10px; color:var(--text-muted)"></i></label>
              <input type="number" min="0" step="0.1" class="form-input" id="log-ord-volume" placeholder="0.0">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Data prevista</label>
              <input type="date" class="form-input" id="log-ord-data">
            </div>
            <div class="form-group">
              <label>Etapa</label>
              <select class="form-select" id="log-ord-status">
                <option value="aguardando">Aguardando Separação</option>
                <option value="separacao">Em Separação</option>
                <option value="embalagem">Embalagem</option>
                <option value="expedicao">Em Expedição</option>
                <option value="entregue">Entregue</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Veículo / motorista designado</label>
            <select class="form-select" id="log-ord-veiculo">
              <option value="">Nenhum designado ainda</option>
            </select>
          </div>

          <div class="form-group">
            <label>Observações</label>
            <textarea class="form-textarea" id="log-ord-obs" placeholder="Instruções de separação, embalagem especial, etc."></textarea>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-secondary" onclick="closeModal('logPedido')"><i class="fa-solid fa-xmark"></i> Cancelar</button>
          <button class="btn btn-danger" id="log-ord-btn-delete" onclick="logDeleteOrder()" style="display:none"><i class="fa-solid fa-trash"></i> Excluir</button>
          <button class="btn btn-primary" onclick="logSaveOrder()"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
        </div>
      </div>
    </div>

    <!-- MODAL: NOVO / EDITAR VEÍCULO -->
    <div class="modal-overlay" id="modal-logVeiculo">
      <div class="modal">
        <div class="modal-head">
          <span class="modal-title" id="log-veh-modal-title">
            <i class="fa-solid fa-truck" style="color:var(--primary);margin-right:8px"></i>
            Novo veículo
          </span>
          <button class="btn btn-icon" onclick="closeModal('logVeiculo')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="log-veh-id">

          <div class="form-row">
            <div class="form-group">
              <label>Placa <span style="color:var(--rose)">*</span></label>
              <input type="text" class="form-input" id="log-veh-placa" placeholder="Ex: ABC-1234">
            </div>
            <div class="form-group">
              <label>Modelo</label>
              <input type="text" class="form-input" id="log-veh-modelo" placeholder="Ex: Fiorino, Sprinter...">
            </div>
          </div>

          <div class="form-group">
            <label>Motorista <span style="color:var(--rose)">*</span></label>
            <input type="text" class="form-input" id="log-veh-motorista" placeholder="Nome do motorista">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Telefone</label>
              <input type="text" class="form-input" id="log-veh-telefone" placeholder="(00) 00000-0000">
            </div>
            <div class="form-group">
              <label>Status</label>
              <select class="form-select" id="log-veh-status">
                <option value="disponivel">Disponível</option>
                <option value="em_rota">Em rota</option>
                <option value="manutencao">Manutenção</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-secondary" onclick="closeModal('logVeiculo')"><i class="fa-solid fa-xmark"></i> Cancelar</button>
          <button class="btn btn-danger" id="log-veh-btn-delete" onclick="logDeleteVehicle()" style="display:none"><i class="fa-solid fa-trash"></i> Excluir</button>
          <button class="btn btn-primary" onclick="logSaveVehicle()"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
        </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts dos componentes -->
    <script src="components/js/header.js"></script>
    <script src="components/js/sidebar.js"></script>
    <script src="components/js/chat.js"></script>
    <script src="components/js/config.js"></script>
    <script src="components/js/footer.js"></script>
    <script src="components/js/modoescuro.js"></script>

    <!-- Lógica da Logística -->
    <script>
      const LOG_STORAGE_ORDERS = "stocklog_log_orders_v1";
      const LOG_STORAGE_VEHICLES = "stocklog_log_vehicles_v1";
      const LOG_STORAGE_ACTIVITY = "stocklog_log_activity_v1";

      const STATUS_ORDER = ["aguardando", "separacao", "embalagem", "expedicao", "entregue"];
      const STATUS_LABELS = {
        aguardando: "Aguardando Separação",
        separacao: "Em Separação",
        embalagem: "Embalagem",
        expedicao: "Em Expedição",
        entregue: "Entregue",
      };
      const STATUS_ICONS = {
        aguardando: "fa-hourglass-half",
        separacao: "fa-people-carry-box",
        embalagem: "fa-box-open",
        expedicao: "fa-truck-ramp-box",
        entregue: "fa-circle-check",
      };
      const STATUS_THEME = {
        aguardando: { accent: "var(--amber)", bg: "var(--amber-bg)" },
        separacao: { accent: "var(--blue)",  bg: "var(--blue-bg)" },
        embalagem: { accent: "var(--brown)", bg: "var(--brown-bg)" },
        expedicao: { accent: "var(--primary)", bg: "var(--primary-light)" },
        entregue:  { accent: "var(--teal)",  bg: "var(--teal-bg)" },
      };
      const VEHICLE_STATUS_LABELS = { disponivel: "Disponível", em_rota: "Em rota", manutencao: "Manutenção" };
      const VEHICLE_STATUS_THEME = {
        disponivel: "var(--teal)",
        em_rota:   "var(--blue)",
        manutencao:"var(--amber)",
      };

      let logState = { orders: [], vehicles: [], activity: [] };

      function logLoad() {
        try {
          const savedOrders = localStorage.getItem(LOG_STORAGE_ORDERS);
          logState.orders = savedOrders ? JSON.parse(savedOrders) : logDefaultOrders();
          if (!savedOrders) logSaveOrders();
        } catch (e) { logState.orders = logDefaultOrders(); }

        try {
          const savedVehicles = localStorage.getItem(LOG_STORAGE_VEHICLES);
          logState.vehicles = savedVehicles ? JSON.parse(savedVehicles) : logDefaultVehicles();
          if (!savedVehicles) logSaveVehicles();
        } catch (e) { logState.vehicles = logDefaultVehicles(); }

        try {
          const savedActivity = localStorage.getItem(LOG_STORAGE_ACTIVITY);
          logState.activity = savedActivity ? JSON.parse(savedActivity) : logDefaultActivity();
          if (!savedActivity) logSaveActivity();
        } catch (e) { logState.activity = logDefaultActivity(); }
      }
      function logSaveOrders()    { localStorage.setItem(LOG_STORAGE_ORDERS,    JSON.stringify(logState.orders)); }
      function logSaveVehicles()  { localStorage.setItem(LOG_STORAGE_VEHICLES,  JSON.stringify(logState.vehicles)); }
      function logSaveActivity()  { localStorage.setItem(LOG_STORAGE_ACTIVITY,  JSON.stringify(logState.activity)); }

      function logDefaultActivity() {
        return [
          { id: "a1", icon: "fa-truck",        color: "blue",   titulo: "Veículo ABC-1234 saiu para entrega",     subtitulo: "Distribuidora Nordeste",         hora: "08:42" },
          { id: "a2", icon: "fa-box-open",     color: "brown",  titulo: "Pedido #1039 iniciou embalagem",          subtitulo: "Padaria Pão Quente",             hora: "08:18" },
          { id: "a3", icon: "fa-bell",         color: "rose",   titulo: "Pedido #1043 marcado como urgente",       subtitulo: "Supermercado Boa Vista",         hora: "07:55" },
          { id: "a4", icon: "fa-circle-check", color: "teal",   titulo: "Pedido #1030 entregue",                   subtitulo: "Mercadinho Ipê",                  hora: "07:30" },
        ];
      }

      function logDefaultVehicles() {
        return [
          { id: "v1", placa: "ABC-1234", modelo: "Fiorino Furgão",      motorista: "João Silva",      telefone: "(11) 98888-1234", status: "em_rota" },
          { id: "v2", placa: "XYZ-5678", modelo: "VW Delivery 9.170",   motorista: "Marcos Souza",    telefone: "(11) 97777-5678", status: "disponivel" },
          { id: "v3", placa: "JKL-9012", modelo: "Sprinter Van",        motorista: "Ana Paula Rocha", telefone: "(11) 96666-9012", status: "manutencao" },
        ];
      }

      function logDefaultOrders() {
        return [
          { id: "o1", numero: "1043", cliente: "Supermercado Boa Vista", endereco: "Av. Central, 900 - Centro", itens: 300, peso: 150.5, volume: 2.3, prioridade: "urgente", status: "aguardando", veiculoId: "", data: "2026-08-21", obs: "Cliente pediu conferência dupla antes da separação." },
          { id: "o2", numero: "1042", cliente: "Restaurante Sabor & Cia", endereco: "Rua das Flores, 120",    itens: 120, peso: 85.0, volume: 1.2, prioridade: "normal",  status: "separacao",  veiculoId: "",    data: "2026-08-22", obs: "" },
          { id: "o3", numero: "1039", cliente: "Padaria Pão Quente",    endereco: "Rua Dez, 45",             itens: 60,  peso: 40.2, volume: 0.8, prioridade: "normal",  status: "embalagem",  veiculoId: "",    data: "2026-08-22", obs: "Embalagem térmica." },
          { id: "o4", numero: "1035", cliente: "Distribuidora Nordeste",endereco: "Rod. BR-101, km 12",      itens: 500, peso: 820.0, volume: 8.5, prioridade: "urgente", status: "expedicao",  veiculoId: "v1", data: "2026-08-21", obs: "" },
          { id: "o5", numero: "1030", cliente: "Mercadinho Ipê",        endereco: "Travessa Ipê, 8",        itens: 80,  peso: 120.0, volume: 1.5, prioridade: "normal",  status: "entregue",   veiculoId: "v2", data: "2026-08-20", obs: "" },
        ];
      }

      function logNextStatus(status) {
        const idx = STATUS_ORDER.indexOf(status);
        return idx >= 0 && idx < STATUS_ORDER.length - 1 ? STATUS_ORDER[idx + 1] : null;
      }
      function logPrevStatus(status) {
        const idx = STATUS_ORDER.indexOf(status);
        return idx > 0 ? STATUS_ORDER[idx - 1] : null;
      }
      function logAddActivity(icon, color, titulo, subtitulo) {
        const agora = new Date();
        const hora = `${String(agora.getHours()).padStart(2,"0")}:${String(agora.getMinutes()).padStart(2,"0")}`;
        logState.activity.unshift({ id: "a" + Date.now().toString(36), icon, color, titulo, subtitulo, hora });
        if (logState.activity.length > 8) logState.activity.pop();
        logSaveActivity();
      }

      function logRender() {
        logRenderStats();
        logRenderToolbar();
        logRenderKanban();
        logRenderVehicles();
        logRenderActivity();
      }

      function logRenderStats() {
        const counts = { aguardando: 0, separacao: 0, embalagem: 0, expedicao: 0, entregue: 0 };
        logState.orders.forEach(o => { if (counts[o.status] !== undefined) counts[o.status]++; });
        const disponiveis = logState.vehicles.filter(v => v.status === "disponivel").length;
        const emRota = logState.vehicles.filter(v => v.status === "em_rota").length;
        const urgentes = logState.orders.filter(o => o.prioridade === "urgente" && o.status !== "entregue").length;

        const tiles = [
          { label: "Aguardando Separação", num: counts.aguardando, icon: "fa-hourglass-half",     color: "amber",   trend: `${counts.aguardando} pendentes`, trendUp: counts.aguardando === 0 },
          { label: "Em Separação",        num: counts.separacao,   icon: "fa-people-carry-box",   color: "blue",    trend: `${emRota} veículos em rota`,   trendUp: true },
          { label: "Embalagem",           num: counts.embalagem,   icon: "fa-box-open",           color: "brown",   trend: "Tempo médio 35min",          trendUp: true },
          { label: "Em Expedição",        num: counts.expedicao,   icon: "fa-truck-ramp-box",     color: "primary", trend: `${disponiveis} disponíveis`,   trendUp: true },
          { label: "Veículos disponíveis",num: disponiveis,        icon: "fa-truck",              color: "teal",    trend: urgentes > 0 ? `${urgentes} urgentes` : "Sem urgências", trendUp: urgentes === 0 },
        ];

        document.getElementById("log-stats").innerHTML = tiles.map(t => `
          <div class="log-stat" style="--accent: ${getColor(t.color, "fg")}">
            <div class="log-stat-icon" style="background:${getColor(t.color, "bg")};color:${getColor(t.color, "fg")}">
              <i class="fa-solid ${t.icon}"></i>
            </div>
            <div class="log-stat-body">
              <div class="log-stat-num">${t.num}</div>
              <div class="log-stat-label">${t.label}</div>
              <div class="log-stat-trend ${t.trendUp ? "up" : "down"}">
                <i class="fa-solid ${t.trendUp ? "fa-arrow-up" : "fa-arrow-down"}" style="font-size:9px"></i>
                ${t.trend}
              </div>
            </div>
          </div>
        `).join("");
      }

      function getColor(name, kind) {
        const map = {
          amber:   { bg: "var(--amber-bg)",   fg: "var(--amber)" },
          blue:    { bg: "var(--blue-bg)",    fg: "var(--blue)" },
          brown:   { bg: "var(--brown-bg)",   fg: "var(--brown)" },
          primary: { bg: "var(--primary-light)", fg: "var(--primary)" },
          teal:    { bg: "var(--teal-bg)",    fg: "var(--teal)" },
        };
        return (map[name] || map.primary)[kind];
      }

      function logRenderToolbar() {
        const term = (document.getElementById("log-search")?.value || "").toLowerCase().trim();
        const count = term
          ? logState.orders.filter(o => o.cliente.toLowerCase().includes(term) || o.numero.toLowerCase().includes(term)).length
          : logState.orders.length;
        document.getElementById("toolbarCount").textContent = count;
      }

      function logRenderKanban() {
        const term = (document.getElementById("log-search")?.value || "").toLowerCase().trim();
        const filtered = logState.orders.filter(o =>
          !term || o.cliente.toLowerCase().includes(term) || o.numero.toLowerCase().includes(term)
        );

        const kanban = document.getElementById("log-kanban");
        kanban.innerHTML = STATUS_ORDER.map(status => {
          const items = filtered.filter(o => o.status === status).sort((a, b) => {
            if (a.prioridade !== b.prioridade) return a.prioridade === "urgente" ? -1 : 1;
            return a.data.localeCompare(b.data);
          });
          const theme = STATUS_THEME[status];

          return `
            <div class="log-col" style="--accent: ${theme.accent}">
              <div class="log-col-head" style="border-top-color: ${theme.accent}">
                <span class="log-col-title" style="--accent: ${theme.accent}; --accent-bg: ${theme.bg}">
                  <i class="fa-solid ${STATUS_ICONS[status]}"></i> ${STATUS_LABELS[status]}
                </span>
                <span class="log-col-count">${items.length}</span>
              </div>
              <div class="log-col-body">
                ${items.length === 0
                  ? '<div class="log-col-empty">Nenhum pedido aqui.</div>'
                  : items.map(o => logCardHtml(o)).join("")}
              </div>
            </div>
          `;
        }).join("");
      }

      function logCardHtml(o) {
        const veh = logState.vehicles.find(v => v.id === o.veiculoId);
        const next = logNextStatus(o.status);
        const prev = logPrevStatus(o.status);
        const nextLabel = next ? STATUS_LABELS[next] : null;
        const nextTheme = next ? STATUS_THEME[next] : null;

        const initials = (o.cliente || "?").split(" ").slice(0, 2).map(s => s[0]).join("").toUpperCase();

        return `
          <div class="log-card" onclick="logEditOrder('${o.id}')">
            <div class="log-card-head">
              <div class="log-card-num">#${escapeHtml(o.numero)}<small>Pedido</small></div>
              ${o.prioridade === "urgente" ? '<span class="log-badge-urgente">Urgente</span>' : ""}
            </div>
            <div class="log-card-cliente">${escapeHtml(o.cliente)}</div>

            <div class="log-card-info">
              <div class="item"><i class="fa-solid fa-boxes-stacked"></i> <strong>${o.itens || 0}</strong>&nbsp;itens</div>
              <div class="item"><i class="fa-solid fa-calendar"></i> ${logFmtBR(o.data)}</div>
              <div class="item"><i class="fa-solid fa-weight-hanging"></i> <strong>${o.peso || 0}</strong>&nbsp;kg</div>
              <div class="item"><i class="fa-solid fa-cube"></i> <strong>${o.volume || 0}</strong>&nbsp;m³</div>
            </div>

            ${veh ? `
              <div class="log-card-driver">
                <span class="avatar">${initials}</span>
                <div class="info">
                  <strong>${escapeHtml(veh.motorista)}</strong>
                  <span><i class="fa-solid fa-truck"></i> ${escapeHtml(veh.placa)}</span>
                </div>
              </div>` : ""}

            <div class="log-card-foot" onclick="event.stopPropagation()">
              ${prev ? `
                <button class="btn btn-secondary btn-sm" onclick="logRevertStatus('${o.id}')" title="Voltar para ${STATUS_LABELS[prev]}">
                  <i class="fa-solid fa-arrow-left"></i> Voltar
                </button>` : ""}
              ${next ? `
                <button class="btn btn-primary btn-sm" style="${nextTheme ? `background:${nextTheme.accent}; box-shadow: 0 4px 12px ${nextTheme.accent}40;` : ""}" onclick="logAdvanceStatus('${o.id}')" title="Avançar para ${nextLabel}">
                  <i class="fa-solid fa-arrow-right"></i> Avançar
                </button>` : `
                <button class="btn btn-secondary btn-sm" disabled>
                  <i class="fa-solid fa-circle-check"></i> Concluído
                </button>`}
            </div>
          </div>
        `;
      }

      function logRenderVehicles() {
        const grid = document.getElementById("log-vehicles-grid");
        if (logState.vehicles.length === 0) {
          grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:24px;font-style:italic">Nenhum veículo cadastrado.</div>`;
          document.getElementById("utilFrota").textContent = "0%";
          return;
        }

        const ocupados = logState.vehicles.filter(v => v.status !== "disponivel").length;
        const utilPct = Math.round((ocupados / logState.vehicles.length) * 100);
        document.getElementById("utilFrota").textContent = utilPct + "%";

        grid.innerHTML = logState.vehicles.map(v => {
          const theme = VEHICLE_STATUS_THEME[v.status] || "var(--primary)";
          const initials = (v.motorista || "?").split(" ").slice(0, 2).map(s => s[0]).join("").toUpperCase();
          const util = v.status === "em_rota" ? 85 : v.status === "manutencao" ? 30 : 10;
          const utilLabel = v.status === "em_rota" ? "Em rota" : v.status === "manutencao" ? "Em manutenção" : "Ocioso";

          return `
            <div class="log-vehicle-card" style="--status-color: ${theme}" onclick="logEditVehicle('${v.id}')">
              <div class="log-vehicle-top">
                <div style="display:flex;gap:12px;align-items:center">
                  <div class="log-vehicle-icon"><i class="fa-solid fa-truck"></i></div>
                  <div class="log-vehicle-plate">
                    ${escapeHtml(v.placa)}
                    <small>${escapeHtml(v.modelo || "—")}</small>
                  </div>
                </div>
                <span class="log-status-pill status-${v.status}">${VEHICLE_STATUS_LABELS[v.status]}</span>
              </div>

              <div class="log-vehicle-driver">
                <span class="avatar">${initials}</span>
                <div class="info">
                  <strong>${escapeHtml(v.motorista)}</strong>
                  ${v.telefone ? `<span><i class="fa-solid fa-phone"></i> ${escapeHtml(v.telefone)}</span>` : '<span style="color:var(--text-muted)">Sem telefone</span>'}
                </div>
              </div>

              <div class="util-bar" title="${utilLabel}">
                <span>Uso</span>
                <div class="bar"><div class="fill" style="--w: ${util}%; background: ${theme}"></div></div>
                <strong>${util}%</strong>
              </div>
            </div>
          `;
        }).join("");
      }

      function logRenderActivity() {
        const list = document.getElementById("log-activity");
        if (!logState.activity.length) {
          list.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:24px;font-style:italic">Sem movimentações registradas.</div>`;
          return;
        }
        const colorMap = {
          blue:   { bg: "var(--blue-bg)",   fg: "var(--blue)" },
          brown:  { bg: "var(--brown-bg)",  fg: "var(--brown)" },
          rose:   { bg: "var(--rose-bg)",   fg: "var(--rose)" },
          teal:   { bg: "var(--teal-bg)",   fg: "var(--teal)" },
          amber:  { bg: "var(--amber-bg)",  fg: "var(--amber)" },
        };
        list.innerHTML = logState.activity.map(a => {
          const c = colorMap[a.color] || colorMap.blue;
          return `
            <div class="activity-item">
              <div class="activity-icon" style="background:${c.bg};color:${c.fg}">
                <i class="fa-solid ${a.icon}"></i>
              </div>
              <div class="text">
                <strong>${escapeHtml(a.titulo)}</strong>
                <span>${escapeHtml(a.subtitulo)}</span>
              </div>
              <div class="hora">${escapeHtml(a.hora)}</div>
            </div>
          `;
        }).join("");
      }

      function logAdvanceStatus(id) {
        const o = logState.orders.find(x => x.id === id);
        if (!o) return;
        const next = logNextStatus(o.status);
        if (!next) return;
        o.status = next;
        logSaveOrders();
        logAddActivity("fa-arrow-right", "blue", `Pedido #${o.numero} avançou para "${STATUS_LABELS[next]}"`, o.cliente);
        logRender();
        showToast(`Pedido #${o.numero} avançou para "${STATUS_LABELS[next]}".`, "success");
      }

      function logRevertStatus(id) {
        const o = logState.orders.find(x => x.id === id);
        if (!o) return;
        const prev = logPrevStatus(o.status);
        if (!prev) return;
        o.status = prev;
        logSaveOrders();
        logAddActivity("fa-arrow-left", "amber", `Pedido #${o.numero} voltou para "${STATUS_LABELS[prev]}"`, o.cliente);
        logRender();
        showToast(`Pedido #${o.numero} voltou para "${STATUS_LABELS[prev]}".`, "warning");
      }

      function logPopulateVehicleSelect(selectedId) {
        const sel = document.getElementById("log-ord-veiculo");
        sel.innerHTML = '<option value="">Nenhum designado ainda</option>' +
          logState.vehicles.map(v => `<option value="${v.id}">${escapeHtml(v.placa)} · ${escapeHtml(v.motorista)}</option>`).join("");
        sel.value = selectedId || "";
      }

      function logOpenNewOrder() {
        document.getElementById("log-ord-id").value = "";
        document.getElementById("log-ord-numero").value = "";
        document.getElementById("log-ord-cliente").value = "";
        document.getElementById("log-ord-endereco").value = "";
        document.getElementById("log-ord-itens").value = "";
        document.getElementById("log-ord-peso").value = "";
        document.getElementById("log-ord-volume").value = "";
        document.getElementById("log-ord-data").value = "";
        document.getElementById("log-ord-status").value = "aguardando";
        document.getElementById("log-ord-prioridade").value = "normal";
        document.getElementById("log-ord-obs").value = "";
        logPopulateVehicleSelect("");
        document.getElementById("log-modal-title").innerHTML = '<i class="fa-solid fa-box" style="color:var(--primary);margin-right:8px"></i>Novo pedido de expedição';
        document.getElementById("log-ord-btn-delete").style.display = "none";
        openModal("logPedido");
      }

      function logEditOrder(id) {
        const o = logState.orders.find(x => x.id === id);
        if (!o) return;
        document.getElementById("log-ord-id").value = o.id;
        document.getElementById("log-ord-numero").value = o.numero;
        document.getElementById("log-ord-cliente").value = o.cliente;
        document.getElementById("log-ord-endereco").value = o.endereco || "";
        document.getElementById("log-ord-itens").value = o.itens || "";
        document.getElementById("log-ord-peso").value = o.peso || "";
        document.getElementById("log-ord-volume").value = o.volume || "";
        document.getElementById("log-ord-data").value = o.data || "";
        document.getElementById("log-ord-status").value = o.status;
        document.getElementById("log-ord-prioridade").value = o.prioridade || "normal";
        document.getElementById("log-ord-obs").value = o.obs || "";
        logPopulateVehicleSelect(o.veiculoId);
        document.getElementById("log-modal-title").innerHTML = '<i class="fa-solid fa-pen" style="color:var(--primary);margin-right:8px"></i>Editar pedido';
        document.getElementById("log-ord-btn-delete").style.display = "inline-flex";
        openModal("logPedido");
      }

      function logSaveOrder() {
        const id = document.getElementById("log-ord-id").value;
        const numero = document.getElementById("log-ord-numero").value.trim();
        const cliente = document.getElementById("log-ord-cliente").value.trim();
        if (!numero || !cliente) { showToast("Preencha o número do pedido e o cliente.", "error"); return; }

        const data = {
          numero,
          cliente,
          endereco: document.getElementById("log-ord-endereco").value.trim(),
          itens: parseInt(document.getElementById("log-ord-itens").value) || 0,
          peso: parseFloat(document.getElementById("log-ord-peso").value) || 0,
          volume: parseFloat(document.getElementById("log-ord-volume").value) || 0,
          data: document.getElementById("log-ord-data").value,
          status: document.getElementById("log-ord-status").value,
          prioridade: document.getElementById("log-ord-prioridade").value,
          veiculoId: document.getElementById("log-ord-veiculo").value,
          obs: document.getElementById("log-ord-obs").value.trim(),
        };

        if (id) {
          const o = logState.orders.find(x => x.id === id);
          if (o) Object.assign(o, data);
          showToast("Pedido atualizado.", "success");
          logAddActivity("fa-pen", "blue", `Pedido #${o.numero} atualizado`, o.cliente);
        } else {
          const novo = { id: "o" + Date.now().toString(36), ...data };
          logState.orders.push(novo);
          showToast("Pedido de expedição criado.", "success");
          logAddActivity("fa-plus", "blue", `Pedido #${novo.numero} criado`, novo.cliente);
        }
        logSaveOrders();
        closeModal("logPedido");
        logRender();
      }

      function logDeleteOrder() {
        const id = document.getElementById("log-ord-id").value;
        if (!id) return;
        if (!confirm("Excluir este pedido de expedição?")) return;
        const o = logState.orders.find(x => x.id === id);
        logState.orders = logState.orders.filter(o => o.id !== id);
        logSaveOrders();
        closeModal("logPedido");
        if (o) logAddActivity("fa-trash", "rose", `Pedido #${o.numero} excluído`, o.cliente);
        logRender();
        showToast("Pedido excluído.", "warning");
      }

      function logOpenNewVehicle() {
        document.getElementById("log-veh-id").value = "";
        document.getElementById("log-veh-placa").value = "";
        document.getElementById("log-veh-modelo").value = "";
        document.getElementById("log-veh-motorista").value = "";
        document.getElementById("log-veh-telefone").value = "";
        document.getElementById("log-veh-status").value = "disponivel";
        document.getElementById("log-veh-modal-title").innerHTML = '<i class="fa-solid fa-truck" style="color:var(--primary);margin-right:8px"></i>Novo veículo';
        document.getElementById("log-veh-btn-delete").style.display = "none";
        openModal("logVeiculo");
      }

      function logEditVehicle(id) {
        const v = logState.vehicles.find(x => x.id === id);
        if (!v) return;
        document.getElementById("log-veh-id").value = v.id;
        document.getElementById("log-veh-placa").value = v.placa;
        document.getElementById("log-veh-modelo").value = v.modelo || "";
        document.getElementById("log-veh-motorista").value = v.motorista;
        document.getElementById("log-veh-telefone").value = v.telefone || "";
        document.getElementById("log-veh-status").value = v.status;
        document.getElementById("log-veh-modal-title").innerHTML = '<i class="fa-solid fa-pen" style="color:var(--primary);margin-right:8px"></i>Editar veículo';
        document.getElementById("log-veh-btn-delete").style.display = "inline-flex";
        openModal("logVeiculo");
      }

      function logSaveVehicle() {
        const id = document.getElementById("log-veh-id").value;
        const placa = document.getElementById("log-veh-placa").value.trim();
        const motorista = document.getElementById("log-veh-motorista").value.trim();
        if (!placa || !motorista) { showToast("Preencha a placa e o motorista.", "error"); return; }

        const data = {
          placa,
          modelo: document.getElementById("log-veh-modelo").value.trim(),
          motorista,
          telefone: document.getElementById("log-veh-telefone").value.trim(),
          status: document.getElementById("log-veh-status").value,
        };

        if (id) {
          const v = logState.vehicles.find(x => x.id === id);
          if (v) Object.assign(v, data);
          showToast("Veículo atualizado.", "success");
        } else {
          logState.vehicles.push({ id: "v" + Date.now().toString(36), ...data });
          showToast("Veículo cadastrado.", "success");
        }
        logSaveVehicles();
        closeModal("logVeiculo");
        logRender();
      }

      function logDeleteVehicle() {
        const id = document.getElementById("log-veh-id").value;
        if (!id) return;
        if (!confirm("Excluir este veículo?")) return;
        const v = logState.vehicles.find(x => x.id === id);
        logState.vehicles = logState.vehicles.filter(v => v.id !== id);
        logState.orders.forEach(o => { if (o.veiculoId === id) o.veiculoId = ""; });
        logSaveVehicles();
        logSaveOrders();
        closeModal("logVeiculo");
        if (v) logAddActivity("fa-trash", "rose", `Veículo ${v.placa} removido`, v.motorista);
        logRender();
        showToast("Veículo excluído.", "warning");
      }

      function logFmtBR(iso) {
        if (!iso) return "—";
        const [y, m, d] = iso.split("-");
        return `${d}/${m}/${y}`;
      }
      function escapeHtml(str) {
        if (str == null) return "";
        return String(str).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
      }
      function openModal(id) { document.getElementById("modal-" + id).classList.add("open"); }
      function closeModal(id) { document.getElementById("modal-" + id).classList.remove("open"); }

      function showToast(message, type = "info") {
        const container = document.getElementById("toastContainer");
        const icons = { success: "fa-circle-check", error: "fa-circle-xmark", warning: "fa-triangle-exclamation", info: "fa-circle-info" };
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${icons[type] || "fa-circle-info"}"></i><span>${escapeHtml(message)}</span>`;
        container.appendChild(toast);
        setTimeout(() => { toast.style.opacity = "0"; setTimeout(() => toast.remove(), 300); }, 3200);
      }

      document.addEventListener("keydown", e => {
        if (e.key === "Escape") { closeModal("logPedido"); closeModal("logVeiculo"); }
      });

      logLoad();
      logRender();
    </script>
  </body>
</html>
