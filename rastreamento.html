<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLog · Rastreamento de Pedidos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="components/css/sidebar.css" />
    <link rel="stylesheet" href="components/css/header.css" />
    <link rel="stylesheet" href="components/css/chat.css" />
    <link rel="stylesheet" href="components/css/footer.css" />
    <link rel="stylesheet" href="components/css/modoescuro.css" />
    <link rel="stylesheet" href="components/css/responsive.css" />

    <style>

      :root {
        --bg-body: #edf3f8;
        --bg-card: #ffffff;
        --bg-soft: #f4f8fc;
        --border: #d4e2f0;

        --text-main: #0c1e2e;
        --text-secondary: #3b5a75;
        --text-muted: #718da8;

        --primary: #006bb3;
        --primary-light: #e3f0fb;

        --green: #16a34a;
        --green-bg: #dcfce7;

        --blue: #0284c7;
        --blue-bg: #e0f2fe;

        --amber: #d97706;
        --amber-bg: #fef3c7;

        --purple: #7c3aed;
        --purple-bg: #f3e8ff;

        --shadow: 0 8px 24px rgba(12, 30, 46, 0.08);
        --radius: 14px;
      }

      body.dark {
        --bg-body: #0a131d;
        --bg-card: #111f2e;
        --bg-soft: #16283b;
        --border: #1e364f;

        --text-main: #e2edf8;
        --text-secondary: #9cb5cd;
        --text-muted: #6482a0;

        --primary: #38bdf8;
        --primary-light: #17324d;

        --green: #4ade80;
        --green-bg: #143823;

        --blue: #38bdf8;
        --blue-bg: #123147;

        --amber: #fbbf24;
        --amber-bg: #3d2d11;

        --purple: #c084fc;
        --purple-bg: #321d47;

        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        min-height: 100vh;
        transition: background-color 0.3s, color 0.3s;
      }

      /* Layout principal: sidebar fixa à esquerda + coluna de conteúdo */
      .app-layout {
        display: flex;
        min-height: 100vh;
        width: 100%;
      }

      #sidebar-root {
        flex-shrink: 0;
      }

      .main-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      /* Container agora ocupa a largura toda do espaço disponível */
      .container {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 24px 28px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        flex: 1;
      }

      /* Filtros */
      .filter-bar {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 22px;
        box-shadow: var(--shadow);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
      }
      .filter-chips { display: flex; gap: 10px; flex-wrap: wrap; }
      .chip {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        padding: 9px 18px;
        border-radius: 22px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        white-space: nowrap;
      }
      .chip:hover { border-color: var(--primary); color: var(--primary); }
      .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

      .search-box {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        padding: 10px 16px;
        border-radius: 10px;
        width: 360px;
        max-width: 100%;
      }
      .search-box input {
        border: none;
        background: transparent;
        color: var(--text-main);
        outline: none;
        font-weight: 600;
        width: 100%;
        font-family: inherit;
        font-size: 13.5px;
      }

      /* Grid principal: lista mais larga e mapa bem maior */
      .main-grid {
        display: grid;
        grid-template-columns: minmax(360px, 420px) 1fr;
        gap: 22px;
        min-height: 680px;
      }
      @media (max-width: 1100px) {
        .main-grid { grid-template-columns: 1fr; }
      }

      /* Lista de entregas */
      .delivery-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
        max-height: 820px;
        padding-right: 6px;
      }
      .delivery-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px 20px;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: var(--shadow);
      }
      .delivery-card:hover { border-color: var(--primary); transform: translateY(-2px); }
      .delivery-card.selected { border: 2px solid var(--primary); background: var(--primary-light); }

      .status-badge {
        font-size: 11px;
        font-weight: 800;
        padding: 5px 12px;
        border-radius: 14px;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .status-preparacao { background: var(--amber-bg); color: var(--amber); }
      .status-transito { background: var(--blue-bg); color: var(--blue); }
      .status-entregue { background: var(--green-bg); color: var(--green); }

      /* Mapa bem mais alto */
      .map-view-container { display: flex; flex-direction: column; gap: 22px; }
      .map-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        height: 520px;
        position: relative;
        box-shadow: var(--shadow);
      }
      #map { width: 100%; height: 100%; z-index: 1; }

      .details-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }
      @media (max-width: 900px) {
        .details-grid { grid-template-columns: 1fr; }
      }

      .info-box {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 22px 24px;
        box-shadow: var(--shadow);
      }

      /* Stepper */
      .stepper {
        display: flex;
        justify-content: space-between;
        position: relative;
        margin-top: 18px;
        padding: 0 6px;
      }
      .stepper::before {
        content: '';
        position: absolute;
        top: 16px;
        left: 18px;
        right: 18px;
        height: 3px;
        background: var(--border);
        z-index: 1;
      }
      .step-item {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        flex: 1;
      }
      .step-node {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--bg-card);
        border: 3px solid var(--border);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
      }
      .step-item.completed .step-node { background: var(--green); border-color: var(--green); color: #fff; }
      .step-item.active .step-node {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
        box-shadow: 0 0 0 4px var(--primary-light);
      }
      .step-label {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--text-secondary);
        max-width: 80px;
      }

      .marker-truck {
        background: var(--primary);
        color: #fff;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        font-size: 14px;
      }

      @media (max-width: 768px) {
        .container { padding: 14px; gap: 16px; }
        .filter-bar { flex-direction: column; align-items: stretch; }
        .search-box { width: 100%; }
        .map-card { height: 380px; }
      }
    </style>
  </head>
  <body>

    <div class="app-layout">

      <div id="sidebar-root"></div>

      <div class="main-column">

        <div id="header-root"></div>

        <div class="container">

          <section class="filter-bar">
            <div class="filter-chips">
              <div class="chip active" onclick="filterStatus('todos', this)">Todas Entregas</div>
              <div class="chip" onclick="filterStatus('em_preparacao', this)"><i class="fas fa-clock" style="color:var(--amber)"></i> Em Preparação</div>
              <div class="chip" onclick="filterStatus('em_transito', this)"><i class="fas fa-truck-moving" style="color:var(--blue)"></i> Em Trânsito</div>
              <div class="chip" onclick="filterStatus('entregue', this)"><i class="fas fa-check" style="color:var(--green)"></i> Entregues</div>
            </div>

            <div class="search-box">
              <i class="fas fa-search" style="color:var(--text-muted)"></i>
              <input type="text" id="searchInput" placeholder="Motorista, veículo, código..." oninput="renderList()" />
            </div>
          </section>

          <div class="main-grid">

            <div class="delivery-list" id="deliveryList"></div>

            <div class="map-view-container">
              <div class="map-card">
                <div id="map"></div>
              </div>

              <div class="details-grid">

                <div class="info-box">
                  <h4 style="font-size:14px; font-weight:700; margin-bottom:12px; display:flex; justify-content:space-between; color:var(--text-main);">
                    <span>Progresso da Entrega</span>
                    <span id="selectedCode" style="color:var(--primary)">-</span>
                  </h4>

                  <div class="stepper" id="stepperContainer">
                    <div class="step-item">
                      <div class="step-node">1</div>
                      <div class="step-label">Preparação</div>
                    </div>
                    <div class="step-item">
                      <div class="step-node">2</div>
                      <div class="step-label">Coletado</div>
                    </div>
                    <div class="step-item">
                      <div class="step-node">3</div>
                      <div class="step-label">Em Trânsito</div>
                    </div>
                    <div class="step-item">
                      <div class="step-node">4</div>
                      <div class="step-label">Entregue</div>
                    </div>
                  </div>
                </div>

                <div class="info-box">
                  <h4 style="font-size:14px; font-weight:700; margin-bottom:12px; color:var(--text-main);">
                    <i class="fas fa-gauge-high" style="color:var(--primary)"></i> Telemetria & Dados em Tempo Real
                  </h4>
                  <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; text-align:center;">
                    <div style="background:var(--bg-soft); padding:10px; border-radius:8px;">
                      <span style="font-size:11px; color:var(--text-muted); font-weight:700;">VELOCIDADE</span>
                      <div style="font-size:16px; font-weight:800; color:var(--text-main);" id="teleSpeed">-</div>
                    </div>
                    <div style="background:var(--bg-soft); padding:10px; border-radius:8px;">
                      <span style="font-size:11px; color:var(--text-muted); font-weight:700;">TEMP. BAÚ</span>
                      <div style="font-size:16px; font-weight:800; color:var(--text-main);" id="teleTemp">-</div>
                    </div>
                    <div style="background:var(--bg-soft); padding:10px; border-radius:8px;">
                      <span style="font-size:11px; color:var(--text-muted); font-weight:700;">BATERIA/TANQUE</span>
                      <div style="font-size:16px; font-weight:800; color:var(--green)" id="teleFuel">-</div>
                    </div>
                  </div>
                </div>

              </div>
            </div>

          </div>

        </div>

        <div id="footer-root"></div>

      </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="JS/rastreamento.js"></script>
    <script src="components/js/header.js"></script>
    <script src="components/js/sidebar.js"></script>
    <script src="components/js/chat.js"></script>
    <script src="components/js/config.js"></script>
    <script src="components/js/footer.js"></script>
    <script src="components/js/modoescuro.js"></script>
  </body>
</html>
