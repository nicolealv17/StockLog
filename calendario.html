<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLog · Calendário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="components/css/sidebar.css" />
    <link rel="stylesheet" href="components/css/header.css" />
    <link rel="stylesheet" href="components/css/chat.css" />
    <link rel="stylesheet" href="components/css/footer.css" />
    <link rel="stylesheet" href="components/css/modoescuro.css" />
    <link rel="stylesheet" href="components/css/responsive.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      /* ================================================================
         TOKENS / VARIÁVEIS (mesmo padrão da index)
         ================================================================ */
      :root {
        --bg-body: #f0f5fc;
        --bg-card: #ffffff;
        --bg-soft: #f5faff;
        --border: #e2ecf6;
        --border-hover: #c6daea;

        --primary: #1a73e8;
        --primary-dark: #1558b0;
        --primary-light: #e8f0fe;
        --primary-gradient: var(--primary);

        --text-main: #0a1f33;
        --text-secondary: #3d5f7e;
        --text-muted: #7b92b2;

        --shadow-card: 0 4px 12px rgba(0, 40, 80, 0.04), 0 12px 32px rgba(0, 40, 80, 0.02);
        --shadow-hover: 0 8px 24px rgba(0, 40, 80, 0.08), 0 16px 48px rgba(0, 40, 80, 0.04);

        --green: #1a7b72;
        --green-bg: #e0f2ea;
        --amber: #c47a1f;
        --amber-bg: #faecd6;
        --red: #b2433a;
        --red-bg: #fae2e0;
        --purple: #6f4c4e;
        --purple-bg: #ede6f5;
        --pink: #a13e73;
        --pink-bg: #f7e3ee;
        --blue: #2f81f7;
        --teal: #3fb950;
      }

      body.dark {
        --bg-body: #0d1727;
        --bg-card: #14243e;
        --bg-soft: #0f1f30;
        --border: #1d344b;
        --border-hover: #2a4866;

        --text-main: #e2edf8;
        --text-secondary: #a5bed6;
        --text-muted: #6f8daa;

        --primary-light: #1d3a55;

        --green-bg: #123a2a;
        --amber-bg: #3a2f15;
        --red-bg: #3a1f1f;
        --purple-bg: #2a1f3d;
        --pink-bg: #351427;
        --pink: #d1699f;

        --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.2);
        --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.4), 0 16px 48px rgba(0, 0, 0, 0.2);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-body);
        color: var(--text-main);
        display: flex;
        min-height: 100vh;
        transition: background 0.3s, color 0.3s;
      }
      a { text-decoration: none; color: inherit; }
      button { cursor: pointer; font-family: inherit; border: none; background: none; }
      input, select, textarea { font-family: inherit; color: var(--text-main); }

      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-width: 0;
      }
      .content {
        flex: 1;
        padding: 28px 32px 20px;
        min-width: 0;
      }

      /* ============ TOOLBAR DO CALENDÁRIO ============ */
      .cal-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 18px;
        box-shadow: var(--shadow-card);
      }
      .cal-toolbar-left {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .cal-toolbar-right { display: flex; align-items: center; gap: 8px; }
      .cal-nav-group {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 4px;
      }
      .cal-month-label {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-main);
        padding: 0 12px;
        min-width: 130px;
        text-align: center;
        text-transform: capitalize;
      }
      .cal-view-group {
        display: flex;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 4px;
        gap: 2px;
      }
      .cal-view-btn {
        background: transparent;
        border: none;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        border-radius: 7px;
        transition: 0.2s;
        cursor: pointer;
      }
      .cal-view-btn:hover { color: var(--text-main); }
      .cal-view-btn.active {
        background: var(--bg-card);
        color: var(--primary);
        box-shadow: var(--shadow-card);
      }

      /* ============ BOTÕES GERAIS ============ */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid transparent;
        cursor: pointer;
        transition: 0.2s;
        white-space: nowrap;
      }
      .btn i { font-size: 13px; }
      .btn.btn-primary {
        background: var(--primary-gradient);
        color: #fff;
        box-shadow: var(--shadow-card);
      }
      .btn.btn-primary:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
      .btn.btn-secondary {
        background: var(--bg-soft);
        color: var(--text-main);
        border-color: var(--border);
      }
      .btn.btn-secondary:hover { border-color: var(--border-hover); }
      .btn.btn-danger {
        background: var(--red-bg);
        color: var(--red);
        border-color: var(--red);
      }
      .btn.btn-danger:hover { background: var(--red); color: #fff; }
      .btn.btn-icon {
        padding: 7px 10px;
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid transparent;
      }
      .btn.btn-icon:hover { background: var(--bg-soft); color: var(--text-main); }

      /* ============ LEGENDA ============ */
      .cal-legend {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        padding: 10px 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 14px;
        font-size: 12.5px;
        color: var(--text-secondary);
        box-shadow: var(--shadow-card);
      }
      .cal-leg-item { display: inline-flex; align-items: center; gap: 6px; }
      .cal-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      /* ============ GRADE DO CALENDÁRIO (MÊS) ============ */
      .cal-wrap {
        position: relative;
        margin-bottom: 22px;
      }
      .cal-grid-month {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow-card);
        overflow: hidden;
      }
      .cal-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        background: var(--bg-soft);
        border-bottom: 1px solid var(--border);
      }
      .cal-weekday {
        padding: 12px 10px;
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .cal-days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        grid-auto-rows: minmax(110px, auto);
      }
      .cal-day {
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        padding: 6px 8px;
        cursor: pointer;
        transition: background 0.15s;
        display: flex;
        flex-direction: column;
        gap: 3px;
        position: relative;
        min-height: 110px;
      }
      .cal-day:nth-child(7n) { border-right: 0; }
      .cal-day:hover { background: var(--bg-soft); }
      .cal-day.outside { background: transparent; color: var(--text-muted); opacity: 0.45; }
      .cal-day.today .cal-day-num {
        background: var(--primary-gradient);
        color: #fff;
        border-radius: 50%;
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .cal-day-num {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 2px;
      }
      .cal-evt {
        font-size: 11px;
        padding: 3px 8px 3px 6px;
        border-radius: 4px;
        background: var(--primary-light);
        color: var(--primary-dark);
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .cal-evt::before {
        content: "";
        width: 6px;
        height: 6px;
        min-width: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .cal-evt.type-reuniao { background: rgba(47,129,247,.15); color: var(--blue); }
      .cal-evt.type-treinamento { background: var(--green-bg); color: var(--green); }
      .cal-evt.type-prazo { background: var(--amber-bg); color: var(--amber); }
      .cal-evt.type-compromisso { background: var(--purple-bg); color: var(--purple); }
      .cal-evt.type-urgente { background: var(--red-bg); color: var(--red); }
      .cal-evt.type-google { background: rgba(26,115,232,.12); color: var(--primary); }
      body.dark .cal-evt.type-reuniao { background: rgba(47,129,247,.22); }
      body.dark .cal-evt.type-google { background: rgba(26,115,232,.22); }

      /* ============ PAINEL LATERAL DE EVENTOS DO DIA ============ */
      .cal-side-panel {
        position: fixed;
        top: 0; right: -420px;
        width: 400px;
        max-width: 92vw;
        height: 100vh;
        background: var(--bg-card);
        border-left: 1px solid var(--border);
        box-shadow: -8px 0 32px rgba(0,0,0,.18);
        z-index: 900;
        display: flex;
        flex-direction: column;
        transition: right .3s ease;
      }
      .cal-side-panel.open { right: 0; }
      .cal-side-head {
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 700;
        font-size: 14px;
      }
      .cal-side-body {
        flex: 1;
        padding: 16px 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .cal-side-foot {
        padding: 14px 20px;
        border-top: 1px solid var(--border);
      }
      .cal-side-foot .btn { width: 100%; justify-content: center; }
      .cal-side-item {
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-left: 3px solid var(--primary);
      }
      .cal-side-item.type-reuniao { border-left-color: var(--blue); }
      .cal-side-item.type-treinamento { border-left-color: var(--green); }
      .cal-side-item.type-prazo { border-left-color: var(--amber); }
      .cal-side-item.type-compromisso { border-left-color: var(--purple); }
      .cal-side-item.type-urgente { border-left-color: var(--red); }
      .cal-side-item.type-google { border-left-color: var(--primary); }
      .cal-side-item-title {
        font-weight: 700;
        font-size: 13.5px;
        color: var(--text-main);
        margin-bottom: 4px;
      }
      .cal-side-item-meta {
        font-size: 11.5px;
        color: var(--text-muted);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      /* ============ GRADE SEMANA / DIA ============ */
      .cal-grid-week, .cal-grid-day {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow-card);
        padding: 16px;
        min-height: 480px;
      }
      .cal-week-header {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      .cal-week-col {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        min-height: 380px;
      }
      .cal-week-col-title {
        font-weight: 700;
        font-size: 12px;
        color: var(--text-secondary);
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      /* ============ MODAL DE NOVO COMPROMISSO ============ */
      .modal-overlay {
        position: fixed; inset: 0;
        background: rgba(10, 20, 35, 0.55);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 20px;
      }
      .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .modal {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        width: 100%;
        max-width: 560px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: var(--shadow-hover);
        animation: slideUp 0.25s ease;
      }
      @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      .modal-head {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .modal-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-main);
        display: flex;
        align-items: center;
      }
      .modal-body { padding: 22px 24px; }
      .modal-foot {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      /* ============ FORMULÁRIO ============ */
      .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
      .form-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 14px;
      }
      .form-group label {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .form-input, .form-textarea, .form-select {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13.5px;
        outline: none;
        width: 100%;
        transition: 0.2s;
        color: var(--text-main);
      }
      .form-input:focus, .form-textarea:focus, .form-select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-light);
      }
      .form-textarea { resize: vertical; min-height: 80px; font-family: inherit; }
      .form-select {
        cursor: pointer;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237b92b2' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 14px;
        padding-right: 32px;
      }

      /* Seletor de tipo de compromisso */
      .cal-type-picker {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .cal-type-btn {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        padding: 7px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: 0.2s;
      }
      .cal-type-btn:hover { border-color: var(--border-hover); color: var(--text-main); }
      .cal-type-btn.active {
        background: var(--primary-light);
        color: var(--primary);
        border-color: var(--primary);
      }

      /* ============ PRÓXIMOS COMPROMISSOS ============ */
      .card {
        background: var(--bg-card);
        border-radius: 14px;
        padding: 22px 24px 24px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-card);
        transition: 0.3s;
      }
      .card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-hover); }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        gap: 10px;
        flex-wrap: wrap;
      }
      .card-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main);
        display: flex;
        align-items: center;
      }
      .upcoming-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
      }
      .upcoming-item:last-child { border-bottom: 0; }
      .upcoming-date {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 12px;
        text-align: center;
        min-width: 60px;
      }
      .upcoming-date .day {
        font-size: 18px;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1;
      }
      .upcoming-date .month {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-top: 2px;
      }
      .upcoming-info { flex: 1; min-width: 0; }
      .upcoming-title {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 3px;
      }
      .upcoming-meta {
        font-size: 11.5px;
        color: var(--text-muted);
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .upcoming-tag {
        font-size: 10.5px;
        padding: 3px 10px;
        border-radius: 20px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .tag-reuniao { background: rgba(47,129,247,.15); color: var(--blue); }
      .tag-treinamento { background: var(--green-bg); color: var(--green); }
      .tag-prazo { background: var(--amber-bg); color: var(--amber); }
      .tag-compromisso { background: var(--purple-bg); color: var(--purple); }
      .tag-urgente { background: var(--red-bg); color: var(--red); }
      .tag-google { background: rgba(26,115,232,.12); color: var(--primary); }
      .cal-google-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        color: var(--primary);
        background: var(--primary-light);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 14px;
      }

      /* ============ TOAST ============ */
      .toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
      }
      .toast {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-left: 3px solid var(--primary);
        border-radius: 10px;
        padding: 12px 16px;
        box-shadow: var(--shadow-hover);
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 240px;
        max-width: 360px;
        pointer-events: auto;
        color: var(--text-main);
        font-size: 13.5px;
        font-weight: 500;
        animation: slideInRight 0.3s ease;
      }
      .toast.success { border-left-color: var(--green); }
      .toast.error { border-left-color: var(--red); }
      .toast.warning { border-left-color: var(--amber); }
      .toast i { font-size: 16px; }
      .toast.success i { color: var(--green); }
      .toast.error i { color: var(--red); }
      .toast.warning i { color: var(--amber); }
      .toast.info i { color: var(--primary); }
      @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

      /* ============ RESPONSIVIDADE ============ */
      @media (max-width: 1100px) {
        .cal-week-header { grid-template-columns: repeat(3, 1fr); }
        .form-row { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 768px) {
        .content { padding: 18px 16px; }
        .cal-toolbar { flex-direction: column; align-items: stretch; }
        .cal-toolbar-left, .cal-toolbar-right { justify-content: center; }
        .cal-days { grid-auto-rows: minmax(80px, auto); }
        .cal-day { min-height: 80px; padding: 4px 5px; }
        .cal-day-num { font-size: 11px; }
        .cal-week-header { grid-template-columns: 1fr; }
        .form-row { grid-template-columns: 1fr; }
        .cal-legend { font-size: 11px; gap: 10px; }
      }
    </style>
  </head>
  <body>
    <!-- SIDEBAR -->
    <div id="sidebar-root"></div>

    <div class="main-wrapper">
      <!-- HEADER -->
      <div id="header-root"></div>

      <main class="content" role="main">


        <!-- Toolbar -->
        <div class="cal-toolbar">
          <div class="cal-toolbar-left">
            <button class="btn btn-primary" onclick="calOpenNewEvent()">
              <i class="fa-solid fa-plus"></i> Novo compromisso
            </button>

            <div class="cal-nav-group">
              <button class="btn btn-icon" onclick="calNavMonth(-1)" title="Mês anterior">

            <div class="cal-view-group">

        <!-- Legenda -->

    <!-- Lógica do calendário -->
    <script>
      /* =========================================================
         StockLog — Calendário inteligente
         ========================================================= */
      /* =========================================================
         CONFIGURAÇÃO DO GOOGLE CALENDAR
         Troque pelo Client ID do SEU projeto no Google Cloud Console
         (OAuth Client ID > tipo "Aplicativo da Web").
         Veja o passo a passo que te mandei junto com este arquivo.
         ========================================================= */
      const GOOGLE_CLIENT_ID = "SEU_CLIENT_ID_AQUI.apps.googleusercontent.com";
      const GOOGLE_SCOPES = "https://www.googleapis.com/auth/calendar.readonly";
      let googleTokenClient = null;
      let googleAccessToken = null;

      const CAL_STORAGE = "stocklog_cal_v1";
      const MONTHS_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
      const WEEKDAYS_PT = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

      let calState = {
        events: [],
        view: "month",
        cursor: new Date(2026, 7, 1), // agosto 2026 (mês 7 = agosto)
        selectedDate: null,
        type: "reuniao",
      };

      function calLoad() {
        try {
          const saved = localStorage.getItem(CAL_STORAGE);
          calState.events = saved ? JSON.parse(saved) : calDefaultEvents();
          if (!saved) calSave();
        } catch (e) {
          calState.events = calDefaultEvents();
        }
      }
      function calSave() { localStorage.setItem(CAL_STORAGE, JSON.stringify(calState.events)); }

      function calDefaultEvents() {
        return [
          { id: "e1", title: "Reunião de alinhamento semanal", type: "reuniao", date: "2026-08-21", time: "09:00", duration: 60, desc: "Pauta: revisão de KPIs e alertas." },
          { id: "e2", title: "Treinamento POP-018 — Recepção de Insumos", type: "treinamento", date: "2026-08-24", time: "14:00", duration: 120, desc: "Capacitação Almoxarifado." },
          { id: "e3", title: "Vencimento POP-042 — Controle de pH", type: "prazo", date: "2026-08-25", time: "08:00", duration: 0, desc: "Revisar e reemitir POP." },
          { id: "e4", title: "Visita técnica fornecedor Inox do Brasil", type: "compromisso", date: "2026-08-27", time: "10:30", duration: 180, desc: "Levantar novos itens para cotação." },
          { id: "e5", title: "Auditoria interna — Qualidade", type: "urgente", date: "2026-08-28", time: "08:00", duration: 240, desc: "Atender auditores." },
          { id: "e6", title: "Treinamento WMS — Equipe Produção", type: "treinamento", date: "2026-08-30", time: "09:00", duration: 180, desc: "Capacitar 4 operadores." }
        ];
      }

      function calPad(n) { return String(n).padStart(2, "0"); }
      function calFmtISO(d) { return `${d.getFullYear()}-${calPad(d.getMonth()+1)}-${calPad(d.getDate())}`; }
      function calFmtBR(iso) { const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; }

      function calRender() {
        document.getElementById("cal-month-label").textContent =
          `${MONTHS_PT[calState.cursor.getMonth()]} ${calState.cursor.getFullYear()}`;

        document.getElementById("cal-grid-month").style.display = calState.view === "month" ? "block" : "none";
        document.getElementById("cal-grid-week").style.display = calState.view === "week" ? "block" : "none";
        document.getElementById("cal-grid-day").style.display  = calState.view === "day"  ? "block" : "none";

        if (calState.view === "month") calRenderMonth();
        else if (calState.view === "week") calRenderWeek();
        else calRenderDay();

        calRenderUpcoming();
      }

      function calRenderMonth() {
        const grid = document.getElementById("cal-grid-month");
        const year = calState.cursor.getFullYear();
        const month = calState.cursor.getMonth();
        const first = new Date(year, month, 1);
        const start = new Date(first);
        start.setDate(1 - first.getDay()); // volta até o domingo

        const todayIso = calFmtISO(new Date());
        let html = `<div class="cal-weekdays">`;
        WEEKDAYS_PT.forEach(w => html += `<div class="cal-weekday">${w}</div>`);
        html += `</div><div class="cal-days">`;

        for (let i = 0; i < 42; i++) {
          const d = new Date(start);
          d.setDate(start.getDate() + i);
          const iso = calFmtISO(d);
          const outside = d.getMonth() !== month;
          const today = iso === todayIso;
          const dayEvents = calState.events.filter(e => e.date === iso).slice(0, 3);

          html += `<div class="cal-day ${outside ? "outside" : ""} ${today ? "today" : ""}" onclick="calOpenDay('${iso}')">
            <div class="cal-day-num">${d.getDate()}</div>
            ${dayEvents.map(e => `<div class="cal-evt type-${e.type}" title="${escapeHtml(e.title)}">${escapeHtml(e.title)}</div>`).join("")}
          </div>`;
        }
        html += `</div>`;
        grid.innerHTML = html;
      }

      function calRenderWeek() {
        const grid = document.getElementById("cal-grid-week");
        const start = new Date(calState.cursor);
        start.setDate(calState.cursor.getDate() - calState.cursor.getDay());

        let html = `<div class="cal-week-header">`;
        for (let i = 0; i < 7; i++) {
          const d = new Date(start);
          d.setDate(start.getDate() + i);
          const iso = calFmtISO(d);
          const dayEvents = calState.events.filter(e => e.date === iso);
          html += `<div class="cal-week-col">
            <div class="cal-week-col-title">${WEEKDAYS_PT[d.getDay()]} ${calPad(d.getDate())}/${calPad(d.getMonth()+1)}</div>
            ${dayEvents.map(e => `<div class="cal-evt type-${e.type}" style="margin-bottom:6px" onclick="calEdit('${e.id}')">${escapeHtml(e.title)}</div>`).join("") || '<div style="font-size:11px;color:var(--text-muted);font-style:italic">sem compromissos</div>'}
          </div>`;
        }
        html += `</div>`;
        grid.innerHTML = html;
      }

      function calRenderDay() {
        const grid = document.getElementById("cal-grid-day");
        const iso = calFmtISO(calState.cursor);
        const dayEvents = calState.events.filter(e => e.date === iso);
        grid.innerHTML = `
          <div class="cal-week-col-title" style="font-size:14px;margin-bottom:14px">
            ${WEEKDAYS_PT[calState.cursor.getDay()]}, ${calState.cursor.getDate()} de ${MONTHS_PT[calState.cursor.getMonth()]} de ${calState.cursor.getFullYear()}
          </div>
          ${dayEvents.length === 0
            ? '<div style="text-align:center;color:var(--text-muted);padding:40px;font-style:italic">Nenhum compromisso nesta data.</div>'
            : dayEvents.map(e => `
              <div class="cal-side-item type-${e.type}" style="margin-bottom:10px;cursor:pointer" onclick="calEdit('${e.id}')">
                <div class="cal-side-item-title">${escapeHtml(e.title)}</div>
                <div class="cal-side-item-meta">
                  <span><i class="fa-solid fa-clock"></i> ${e.time || "—"}</span>
                  <span><i class="fa-solid fa-tag"></i> ${e.type}</span>
                </div>
                ${e.desc ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:6px">${escapeHtml(e.desc)}</div>` : ""}
              </div>
            `).join("")
          }`;
      }

      function calRenderUpcoming() {
        const list = document.getElementById("cal-upcoming-list");
        const today = calFmtISO(new Date());
        const items = calState.events
          .filter(e => e.date >= today)
          .sort((a, b) => a.date.localeCompare(b.date))
          .slice(0, 10);

        if (items.length === 0) {
          list.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:24px;font-style:italic">Nenhum compromisso futuro.</div>`;
          return;
        }
        list.innerHTML = items.map(e => {
          const [y, m, d] = e.date.split("-");
          return `
            <div class="upcoming-item" onclick="calEdit('${e.id}')" style="cursor:pointer">
              <div class="upcoming-date">
                <div class="day">${parseInt(d)}</div>
                <div class="month">${MONTHS_PT[parseInt(m)-1].slice(0,3)}</div>
              </div>
              <div class="upcoming-info">
                <div class="upcoming-title">${escapeHtml(e.title)}</div>
                <div class="upcoming-meta">
                  <span><i class="fa-solid fa-clock"></i> ${e.time || "—"}</span>
                  <span><i class="fa-solid fa-calendar"></i> ${calFmtBR(e.date)}</span>
                </div>
              </div>
              <span class="upcoming-tag tag-${e.type}">${e.type}</span>
            </div>`;
        }).join("");
      }

      function calFilterList(q) {
        q = q.toLowerCase();
        const items = document.querySelectorAll(".upcoming-item");
        items.forEach(it => {
          const title = it.querySelector(".upcoming-title").textContent.toLowerCase();
          it.style.display = title.includes(q) ? "flex" : "none";
        });
      }

      function calOpenDay(iso) {
        calState.selectedDate = iso;
        const [y, m, d] = iso.split("-");
        document.getElementById("cal-side-date-label").textContent =
          `${parseInt(d)} de ${MONTHS_PT[parseInt(m)-1]} de ${y}`;
        const dayEvents = calState.events.filter(e => e.date === iso);
        const body = document.getElementById("cal-side-body");
        body.innerHTML = dayEvents.length === 0
          ? `<div style="text-align:center;color:var(--text-muted);padding:24px;font-style:italic">Nenhum compromisso.</div>`
          : dayEvents.map(e => `
              <div class="cal-side-item type-${e.type}" onclick="calEdit('${e.id}')" style="cursor:pointer">
                <div class="cal-side-item-title">${escapeHtml(e.title)}</div>
                <div class="cal-side-item-meta">
                  <span><i class="fa-solid fa-clock"></i> ${e.time || "—"}</span>
                  <span><i class="fa-solid fa-tag"></i> ${e.type}</span>
                </div>
                ${e.desc ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:6px">${escapeHtml(e.desc)}</div>` : ""}
              </div>`).join("");
        document.getElementById("cal-side-panel").classList.add("open");
      }

      function calNavMonth(delta) {
        calState.cursor.setMonth(calState.cursor.getMonth() + delta);
        calRender();
      }
      function calGoToday() {
        calState.cursor = new Date();
        calRender();
      }
      function calSetView(view, btn) {
        calState.view = view;
        document.querySelectorAll(".cal-view-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        calRender();
      }

      function calSelectType(type, btn) {
        calState.type = type;
        document.querySelectorAll(".cal-type-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      }

      function calOpenNewEvent(dateIso = null) {
        document.getElementById("taskForm")?.reset();
        document.getElementById("cal-evt-id").value = "";
        document.getElementById("cal-evt-titulo").value = "";
        document.getElementById("cal-evt-desc").value = "";
        document.getElementById("cal-evt-data").value = dateIso || calFmtISO(new Date());
        document.getElementById("cal-evt-hora").value = "09:00";
        document.getElementById("cal-evt-duracao").value = "60";
        document.getElementById("cal-evt-lembrete").value = "30";
        calSelectType("reuniao", document.querySelector('.cal-type-btn[data-type="reuniao"]'));
        document.getElementById("cal-modal-title").innerHTML =
          '<i class="fa-solid fa-calendar-plus" style="color:var(--primary);margin-right:8px"></i>Novo compromisso';
        document.getElementById("cal-btn-delete").style.display = "none";
        document.getElementById("cal-google-badge").style.display = "none";
        openModal("calEvento");
      }

      function calEdit(id) {
        const e = calState.events.find(x => x.id === id);
        if (!e) return;
        document.getElementById("cal-evt-id").value = e.id;
        document.getElementById("cal-evt-titulo").value = e.title;
        document.getElementById("cal-evt-data").value = e.date;
        document.getElementById("cal-evt-hora").value = e.time || "09:00";
        document.getElementById("cal-evt-duracao").value = e.duration || 60;
        document.getElementById("cal-evt-lembrete").value = e.lembrete || 30;
        document.getElementById("cal-evt-desc").value = e.desc || "";
        calSelectType(e.type, document.querySelector(`.cal-type-btn[data-type="${e.type}"]`));
        document.getElementById("cal-modal-title").innerHTML =
          '<i class="fa-solid fa-pen" style="color:var(--primary);margin-right:8px"></i>Editar compromisso';
        document.getElementById("cal-btn-delete").style.display = "inline-flex";
        document.getElementById("cal-google-badge").style.display = e.source === "google" ? "flex" : "none";
        document.getElementById("cal-side-panel").classList.remove("open");
        openModal("calEvento");
      }

      function calSaveEvent() {
        const id = document.getElementById("cal-evt-id").value;
        const title = document.getElementById("cal-evt-titulo").value.trim();
        const date = document.getElementById("cal-evt-data").value;
        if (!title || !date) { showToast("Preencha título e data.", "error"); return; }

        const data = {
          title,
          type: calState.type,
          date,
          time: document.getElementById("cal-evt-hora").value,
          duration: parseInt(document.getElementById("cal-evt-duracao").value),
          lembrete: parseInt(document.getElementById("cal-evt-lembrete").value),
          desc: document.getElementById("cal-evt-desc").value.trim(),
        };

        if (id) {
          const e = calState.events.find(x => x.id === id);
          if (e) Object.assign(e, data);
          showToast("Compromisso atualizado.", "success");
        } else {
          calState.events.push({ id: "e" + Date.now().toString(36), ...data });
          showToast("Compromisso criado.", "success");
        }
        calSave();
        closeModal("calEvento");
        calRender();
      }

      function calDeleteEvent() {
        const id = document.getElementById("cal-evt-id").value;
        if (!id) return;
        if (!confirm("Excluir este compromisso?")) return;
        calState.events = calState.events.filter(e => e.id !== id);
        calSave();
        closeModal("calEvento");
        calRender();
        showToast("Compromisso excluído.", "warning");
      }

      function calImportGoogle() {
        if (GOOGLE_CLIENT_ID.includes("SEU_CLIENT_ID_AQUI")) {
          showToast("Configure o GOOGLE_CLIENT_ID no código antes de sincronizar.", "warning");
          return;
        }
        if (typeof google === "undefined" || !google.accounts) {
          showToast("Biblioteca do Google ainda não carregou. Tente novamente em instantes.", "error");
          return;
        }
        if (!googleTokenClient) {
          googleTokenClient = google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID,
            scope: GOOGLE_SCOPES,
            callback: (resp) => {
              if (resp.error) {
                showToast("Não foi possível autenticar com o Google.", "error");
                return;
              }
              googleAccessToken = resp.access_token;
              calFetchGoogleEvents();
            },
          });
        }
        googleTokenClient.requestAccessToken({ prompt: googleAccessToken ? "" : "consent" });
      }

      async function calFetchGoogleEvents() {
        const btn = document.getElementById("cal-sync-btn");
        btn.disabled = true;
        showToast("Sincronizando com o Google Calendar...", "info");
        try {
          const timeMin = new Date();
          timeMin.setMonth(timeMin.getMonth() - 1);
          const timeMax = new Date();
          timeMax.setMonth(timeMax.getMonth() + 3);
          const params = new URLSearchParams({
            timeMin: timeMin.toISOString(),
            timeMax: timeMax.toISOString(),
            singleEvents: "true",
            orderBy: "startTime",
            maxResults: "250",
          });
          const res = await fetch(
            `https://www.googleapis.com/calendar/v3/calendars/primary/events?${params.toString()}`,
            { headers: { Authorization: `Bearer ${googleAccessToken}` } }
          );
          if (res.status === 401) {
            googleAccessToken = null;
            throw new Error("Sessão expirada, faça login novamente.");
          }
          if (!res.ok) throw new Error("Erro " + res.status);

          const data = await res.json();
          const imported = (data.items || [])
            .map(ev => ({
              id: "g_" + ev.id,
              title: ev.summary || "(sem título)",
              type: "google",
              date: (ev.start.date || ev.start.dateTime || "").slice(0, 10),
              time: ev.start.dateTime ? ev.start.dateTime.slice(11, 16) : "",
              duration: 60,
              desc: ev.description || "",
              source: "google",
            }))
            .filter(e => e.date);

          calState.events = calState.events.filter(e => e.source !== "google");
          calState.events.push(...imported);
          calSave();
          calRender();
          showToast(`${imported.length} compromisso(s) importado(s) do Google Calendar.`, "success");
        } catch (err) {
          console.error(err);
          showToast("Não foi possível sincronizar com o Google Calendar.", "error");
        } finally {
          btn.disabled = false;
        }
      }

      /* Utilitários */
      function escapeHtml(str) {
        if (str == null) return "";
        return String(str).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
      }
      function openModal(id) { document.getElementById("modal-" + id).classList.add("open"); }
      function closeModal(id) { document.getElementById("modal-" + id).classList.remove("open"); }

      function showToast(message, type = "info") {
        const container = document.getElementById("toastContainer");
        const icons = { success: "fa-circle-check", error: "fa-circle-xmark", warning: "fa-triangle-exclamation", info: "fa-circle-info" };
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${icons[type] || "fa-circle-info"}"></i><span>${escapeHtml(message)}</span>`;
        container.appendChild(toast);
        setTimeout(() => { toast.style.opacity = "0"; setTimeout(() => toast.remove(), 300); }, 3200);
      }

      document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
          closeModal("calEvento");
          document.getElementById("cal-side-panel").classList.remove("open");
        }
      });

      /* Inicialização */
      calLoad();
      calRender();
    </script>
  </body>
</html>
