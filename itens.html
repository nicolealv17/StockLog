<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLog · Itens em Estoque</title>
    <link rel="icon" type="image/png" href="IMG/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="components/css/sidebar.css" />
    <link rel="stylesheet" href="components/css/header.css" />
    <link rel="stylesheet" href="components/css/chat.css" />
    <link rel="stylesheet" href="components/css/footer.css" />
    <link rel="stylesheet" href="components/css/modoescuro.css" />
    <link rel="stylesheet" href="components/css/responsive.css" />

    <style>
      :root {
        --bg-body: #f0f5fc;
        --bg-card: #ffffff;
        --bg-soft: #f5faff;
        --border: #e2ecf6;
        --text-main: #0a1f33;
        --text-secondary: #3d5f7e;
        --text-muted: #7b92b2;
        --primary: #006bb3;
        --primary-light: #e1eefb;
        --green: #1a7b72;
        --green-bg: #e6f3f1;
        --green-bar: #1a7b72;
        --amber: #c47a1f;
        --amber-bg: #fcf3e6;
        --amber-bar: #c47a1f;
        --red: #b2433a;
        --red-bg: #faeeed;
        --red-bar: #b2433a;
        --purple: #4a5a7a;
        --purple-bg: #edf0f7;
        --purple-bar: #4a5a7a;
        --blue: #2d6bb0;
        --blue-bg: #e2ecfa;
        --blue-bar: #2d6bb0;
        --teal: #2d7d74;
        --teal-bg: #deeeec;
        --teal-bar: #2d7d74;
        --row-stripe: #f5faff;
        --shadow: 0 4px 12px rgba(0, 40, 80, 0.04), 0 12px 32px rgba(0, 40, 80, 0.02);
        --fs-base: clamp(14px, 0.9vw + 12px, 16px);
        --fs-h1: clamp(19px, 1.2vw + 14px, 24px);
        --fs-title: clamp(15px, 1vw + 12px, 18px);
        --fs-table: clamp(12.5px, 0.5vw + 11.5px, 14px);
        --pad-content: 16px 20px;
        --gap-grid: clamp(14px, 1vw, 22px);
        --pad-card: clamp(18px, 1.4vw, 28px);
      }

      body.dark {
        --bg-body: #0d1727;
        --bg-card: #14243e;
        --bg-soft: #0f1f30;
        --border: #1d344b;
        --text-main: #e2edf8;
        --text-secondary: #a5bed6;
        --text-muted: #6f8daa;
        --primary: #38bdf8;
        --primary-light: #1d3a55;
        --green: #4a9d8f;
        --green-bg: #123a2a;
        --green-bar: #4a9d8f;
        --amber: #d1a24a;
        --amber-bg: #3a2f15;
        --amber-bar: #d1a24a;
        --red: #c96a61;
        --red-bg: #3a1f1f;
        --red-bar: #c96a61;
        --purple: #9fb1d8;
        --purple-bg: #202d46;
        --purple-bar: #9fb1d8;
        --blue: #5b8fc9;
        --blue-bg: #17283d;
        --blue-bar: #5b8fc9;
        --teal: #4fa89c;
        --teal-bg: #113330;
        --teal-bar: #4fa89c;
        --row-stripe: #152638;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html { font-size: var(--fs-base); }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        display: flex;
        min-height: 100vh;
        transition: background-color 0.2s, color 0.2s;
        font-size: 1rem;
        line-height: 1.5;
      }

      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-width: 0;
      }

      .dashboard-container {
        max-width: 100%;
        width: 100%;
        margin: 0;
        padding: var(--pad-content);
        display: flex;
        flex-direction: column;
        gap: var(--gap-grid);
      }

      .top-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .header-title-group {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .header-title-group h1 {
        font-size: var(--fs-h1);
        font-weight: 700;
      }

      .header-title-group h1 span {
        color: var(--primary);
      }

      .status-pill-live {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background-color: var(--green-bg);
        color: var(--green);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12.5px;
        font-weight: 600;
      }

      .status-pill-live .dot {
        width: 7px;
        height: 7px;
        background-color: var(--green);
        border-radius: 50%;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        cursor: pointer;
        position: relative;
        transition: 0.15s;
      }

      .icon-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: var(--bg-soft);
      }

      .icon-btn .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        background-color: var(--red);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 5px;
        border-radius: 10px;
        border: 1.5px solid var(--bg-card);
      }

      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: var(--pad-card);
        box-shadow: var(--shadow);
        width: 100%;
      }

      .card-header-title {
        font-size: var(--fs-title);
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        flex-wrap: wrap;
        gap: 10px;
      }

      .card-header-title .title-text {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .card-header-title i {
        color: var(--text-muted);
        font-size: 1em;
      }

      .charts-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: var(--gap-grid);
      }

      .cat-progress-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .cat-progress-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .cat-progress-info {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 600;
      }

      .cat-progress-info span {
        color: var(--text-secondary);
      }

      .cat-progress-info strong {
        color: var(--text-main);
      }

      .progress-bar-bg {
        width: 100%;
        height: 8px;
        background: var(--bg-soft);
        border-radius: 6px;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        border-radius: 6px;
        transition: width 0.3s;
      }

      .alert-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .alert-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
      }

      .alert-item-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .alert-icon {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        flex-shrink: 0;
      }

      .alert-icon.critico { background: var(--red-bg); color: var(--red); }
      .alert-icon.baixo { background: var(--amber-bg); color: var(--amber); }

      .alert-info {
        display: flex;
        flex-direction: column;
      }

      .alert-title {
        font-weight: 700;
        color: var(--text-main);
      }

      .alert-sub {
        font-size: 11.5px;
        color: var(--text-muted);
      }

      .alert-badge {
        font-size: 11.5px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 10px;
      }

      .alert-badge.critico { background: var(--red-bg); color: var(--red); }
      .alert-badge.baixo { background: var(--amber-bg); color: var(--amber); }

      .table-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        min-width: 240px;
        flex: 1;
      }

      .search-box i {
        color: var(--text-muted);
        font-size: 13px;
      }

      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        color: var(--text-main);
        font-family: inherit;
        font-size: 13.5px;
        width: 100%;
      }

      .search-box input::placeholder {
        color: var(--text-muted);
      }

      select.filter-select {
        border: 1px solid var(--border);
        background: var(--bg-soft);
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 8px;
        outline: none;
        cursor: pointer;
      }

      .filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        background: var(--bg-soft);
        color: var(--text-secondary);
        font-size: 12.5px;
        font-weight: 600;
        padding: 7px 14px;
        border-radius: 20px;
        cursor: pointer;
        transition: 0.15s;
      }

      .filter-chip:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .filter-chip.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      .table-wrapper {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: var(--fs-table);
        min-width: 750px;
      }

      th {
        text-align: left;
        padding: 10px 12px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-muted);
        border-bottom: 2px solid var(--border);
        white-space: nowrap;
        user-select: none;
      }

      td {
        padding: 10px 12px;
        vertical-align: middle;
        border-bottom: 1px solid var(--border);
      }

      tbody tr:nth-child(even) td {
        background-color: var(--row-stripe);
      }

      tbody tr:hover td {
        background-color: var(--primary-light);
      }

      .item-code {
        font-weight: 700;
        color: var(--text-secondary);
        font-size: 0.9em;
      }

      .item-name {
        font-weight: 600;
      }

      .item-sub {
        font-size: 0.82em;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .cat-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.82em;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 12px;
      }

      .loc-cell {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-secondary);
        font-weight: 600;
        font-size: 0.9em;
      }

      .loc-cell i {
        color: var(--text-muted);
        font-size: 0.9em;
      }

      .qty-cell {
        font-weight: 700;
        font-size: 1rem;
      }

      .qty-min {
        color: var(--text-muted);
        font-weight: 600;
        font-size: 0.82em;
      }

      .table-progress-cell {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 130px;
      }

      .progress-perc {
        font-size: 0.82em;
        font-weight: 700;
        min-width: 32px;
        color: var(--text-secondary);
      }

      .flow-cell {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 0.82em;
        font-weight: 700;
      }

      .flow-in { color: var(--green); }
      .flow-out { color: var(--red); }

      .status-pill {
        font-size: 0.82em;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 12px;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .status-pill.ok { background: var(--green-bg); color: var(--green); }
      .status-pill.baixo { background: var(--amber-bg); color: var(--amber); }
      .status-pill.critico { background: var(--red-bg); color: var(--red); }

      .qty-btns {
        display: flex;
        gap: 5px;
      }

      .qty-btn {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-secondary);
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.15s;
      }

      .qty-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .empty-state {
        text-align: center;
        padding: 36px 12px;
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      .empty-state i {
        font-size: 26px;
        margin-bottom: 8px;
        display: block;
        color: var(--border);
      }

      .results-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 14px;
        font-size: 0.88em;
        color: var(--text-muted);
        flex-wrap: wrap;
        gap: 10px;
      }

      /* ===== ESTILOS DO MODAL DE ADICIONAR ITEM ===== */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .modal-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      .modal {
        background: var(--bg-card);
        border-radius: 12px;
        width: 90%;
        max-width: 600px;
        max-height: 90vh;
        overflow-y: auto;
        padding: 24px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        transform: translateY(20px);
        transition: transform 0.3s ease;
      }

      .modal-overlay.active .modal {
        transform: translateY(0);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .modal-header h2 {
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .modal-close {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.15s;
      }

      .modal-close:hover {
        background: var(--bg-soft);
        color: var(--text-main);
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-group.full-width {
        grid-column: span 2;
      }

      .form-group label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .form-group input,
      .form-group select {
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-soft);
        color: var(--text-main);
        font-family: inherit;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.15s;
      }

      .form-group input:focus,
      .form-group select:focus {
        border-color: var(--primary);
      }

      .form-group input::placeholder {
        color: var(--text-muted);
      }

      .form-actions {
        margin-top: 24px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .btn {
        padding: 9px 20px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s;
        border: 1px solid transparent;
      }

      .btn-secondary {
        background: var(--bg-soft);
        border-color: var(--border);
        color: var(--text-secondary);
      }

      .btn-secondary:hover {
        background: var(--border);
        color: var(--text-main);
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
      }

      .btn-primary:hover {
        filter: brightness(1.1);
      }

      .btn-add-item {
        background: var(--primary);
        color: #fff;
        padding: 8px 18px;
        border-radius: 8px;
        border: 1px solid var(--primary);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: 0.15s;
      }

      .btn-add-item:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }

      .toast-popup {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--green-bar);
        color: #ffffff;
        padding: 14px 22px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(20px);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 9999;
      }

      .toast-popup.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      /* Responsividade Avançada */
      @media (max-width: 1024px) {
        .charts-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 768px) {
        .dashboard-container {
          padding: 12px;
        }

        .table-controls {
          flex-direction: column;
          align-items: stretch;
          width: 100%;
        }

        .search-box {
          width: 100%;
        }

        select.filter-select {
          width: 100%;
        }

        .modal {
          padding: 16px;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .form-group.full-width {
          grid-column: span 1;
        }

        .toast-popup {
          left: 16px;
          right: 16px;
          bottom: 16px;
          text-align: center;
          justify-content: center;
        }
      }

      @media (max-width: 480px) {
        .card-header-title {
          font-size: 14px;
        }

        .filter-chip {
          padding: 6px 10px;
          font-size: 11.5px;
        }

        .btn-add-item {
          padding: 6px 12px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="sidebar-root"></div>

    <div class="main-wrapper">
      <div id="header-root"></div>

      <div class="dashboard-container">
        <section class="charts-grid">
          <div class="card">
            <div class="card-header-title">
              <span class="title-text"><i class="fas fa-chart-pie"></i> Capacidade por Categoria</span>
            </div>
            <div class="cat-progress-list" id="catProgressList"></div>
          </div>

          <div class="card">
            <div class="card-header-title">
              <span class="title-text"><i class="fas fa-triangle-exclamation" style="color:var(--amber);"></i> Alertas de Reposição</span>
              <span id="alertCountBadge" style="font-size: 12px; color: var(--red); font-weight: 700;">4 pendentes</span>
            </div>
            <div class="alert-list" id="alertList"></div>
          </div>
        </section>

        <section class="card">
          <div class="card-header-title">
            <span class="title-text"><i class="fas fa-warehouse"></i> Consulta de itens</span>
            <div class="table-controls">
              <div class="search-box">
                <i class="fas fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Buscar por código ou nome..." oninput="renderAll()" />
              </div>
              <select class="filter-select" id="categoryFilter" onchange="renderAll()">
                <option value="todas">Todas categorias</option>
                <option value="Matéria-Prima">Matéria-Prima</option>
                <option value="Componentes">Componentes</option>
                <option value="Embalagens">Embalagens</option>
                <option value="Consumíveis">Consumíveis</option>
                <option value="Ferramental">Ferramental</option>
              </select>
              <!-- BOTÃO ADICIONAR ITEM -->
              <button class="btn-add-item" onclick="openAddModal()">
                <i class="fas fa-plus"></i> Adicionar Item
              </button>
            </div>
          </div>

          <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;">
            <button class="filter-chip active" data-status="todos" onclick="setStatusFilter('todos', this)">Todos</button>
            <button class="filter-chip" data-status="ok" onclick="setStatusFilter('ok', this)"><i class="fas fa-circle" style="color:var(--green); font-size:7px;"></i> Normal</button>
            <button class="filter-chip" data-status="baixo" onclick="setStatusFilter('baixo', this)"><i class="fas fa-circle" style="color:var(--amber); font-size:7px;"></i> Baixo</button>
            <button class="filter-chip" data-status="critico" onclick="setStatusFilter('critico', this)"><i class="fas fa-circle" style="color:var(--red); font-size:7px;"></i> Crítico</button>
          </div>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Cód.</th>
                  <th>Item</th>
                  <th>Categoria</th>
                  <th>Localização</th>
                  <th>Qtd. Atual</th>
                  <th>Nível</th>
                  <th>Entradas/Saídas (hoje)</th>
                  <th>Status</th>
                  <th>Ação rápida</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>

          <div class="results-footer">
            <span id="resultsCount">Mostrando 12 de 12 itens</span>
            <span>Última sincronização: <span id="lastSync">agora</span></span>
          </div>
        </section>
      </div>

      <div id="footer-root"></div>
    </div>

    <!-- MODAL DE ADICIONAR ITEM -->
    <div id="addItemModal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2><i class="fas fa-box-open" style="color: var(--primary);"></i> Adicionar Novo Item</h2>
          <button class="modal-close" onclick="closeAddModal()">
            <i class="fas fa-xmark"></i>
          </button>
        </div>
        <form id="addItemForm" onsubmit="handleAddItem(event)">
          <div class="form-grid">
            <div class="form-group">
              <label for="newCodigo">Código *</label>
              <input type="text" id="newCodigo" placeholder="Ex: MP-1103" required />
            </div>
            <div class="form-group">
              <label for="newNome">Nome do Item *</label>
              <input type="text" id="newNome" placeholder="Nome do produto" required />
            </div>
            <div class="form-group full-width">
              <label for="newSub">Descrição Complementar</label>
              <input type="text" id="newSub" placeholder="Ex: Especificação, unidade, etc." />
            </div>
            <div class="form-group">
              <label for="newCategoria">Categoria *</label>
              <select id="newCategoria" required>
                <option value="">Selecione...</option>
                <option value="Matéria-Prima">Matéria-Prima</option>
                <option value="Componentes">Componentes</option>
                <option value="Embalagens">Embalagens</option>
                <option value="Consumíveis">Consumíveis</option>
                <option value="Ferramental">Ferramental</option>
              </select>
            </div>
            <div class="form-group">
              <label for="newLocal">Localização *</label>
              <input type="text" id="newLocal" placeholder="Ex: A-02-05" required />
            </div>
            <div class="form-group">
              <label for="newAtual">Quantidade Atual *</label>
              <input type="number" id="newAtual" min="0" step="1" placeholder="0" required />
            </div>
            <div class="form-group">
              <label for="newMinimo">Estoque Mínimo *</label>
              <input type="number" id="newMinimo" min="0" step="1" placeholder="0" required />
            </div>
            <div class="form-group">
              <label for="newMaximo">Estoque Máximo *</label>
              <input type="number" id="newMaximo" min="0" step="1" placeholder="0" required />
            </div>
            <div class="form-group">
              <label for="newEntradas">Entradas (hoje)</label>
              <input type="number" id="newEntradas" min="0" step="1" value="0" />
            </div>
            <div class="form-group">
              <label for="newSaidas">Saídas (hoje)</label>
              <input type="number" id="newSaidas" min="0" step="1" value="0" />
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Cancelar</button>
            <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Salvar Item</button>
          </div>
        </form>
      </div>
    </div>

    <div id="toastPopup" class="toast-popup">
      <i class="fas fa-circle-check" style="font-size: 18px;"></i>
      <span>Dados atualizados com sucesso!</span>
    </div>

    <script src="components/js/modoescuro.js"></script>
    <script src="components/js/header.js"></script>
    <script src="components/js/sidebar.js"></script>
    <script src="components/js/chat.js"></script>
    <script src="components/js/config.js"></script>
    <script src="components/js/footer.js"></script>
    <script src="JS/itens.js"></script>
  </body>
</html>
